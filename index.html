 even. Its factors are 1, 2, 3, 6. In Roman numerals it is VI. In binary it is 110 and in hexadecimal it is 6. Its square is 36. It is a triangular number. Six is a perfect number because its factors other than itself add up to 6. Half a dozen is six, and a cube has six faces.", "legend"], ["w-numf-8", "numf", "Seven (7)", "7 is spelled seven. It is odd. It is a prime. In Roman numerals it is VII. In binary it is 111 and in hexadecimal it is 7. Its square is 49. Seven is the number of days in a week and colors in a rainbow.", "legend"], ["w-numf-9", "numf", "Eight (8)", "8 is spelled eight. It is even. Its factors are 1, 2, 4, 8. It is a perfect cube, 2 cubed. In Roman numerals it is VIII. In binary it is 1000 and in hexadecimal it is 8. Its square is 64. It is a Fibonacci number. Eight is the number of bits in a byte and of legs on a spider or octopus.", "legend"], ["w-numf-10", "numf", "Nine (9)", "9 is spelled nine. It is odd. Its factors are 1, 3, 9. It is a perfect square, 3 times 3. In Roman numerals it is IX. In binary it is 1001 and in hexadecimal it is 9. Its square is 81. Nine is the largest single digit. Multiples of nine have digits that add up to a multiple of nine.", "legend"], ["w-numf-11", "numf", "Ten (10)", "10 is spelled ten. It is even. Its factors are 1, 2, 5, 10. In Roman numerals it is X. In binary it is 1010 and in hexadecimal it is A. Its square is 100. It is a triangular number. Ten is the base of our number system and the number of fingers on two hands.", "legend"], ["w-numf-12", "numf", "Eleven (11)", "11 is spelled eleven. It is odd. It is a prime. In Roman numerals it is XI. In binary it is 1011 and in hexadecimal it is B. Its square is 121. Eleven is the first two-digit prime. A soccer team has eleven players on the field.", "legend"], ["w-numf-13", "numf", "Twelve (12)", "12 is spelled twelve. It is even. Its factors are 1, 2, 3, 4, 6, 12. In Roman numerals it is XII. In binary it is 1100 and in hexadecimal it is C. Its square is 144. Twelve is a dozen, the number of months in a year, of hours on a clock face and of inches in a foot.", "legend"], ["w-numf-14", "numf", "Thirteen (13)", "13 is spelled thirteen. It is odd. It is a prime. In Roman numerals it is XIII. In binary it is 1101 and in hexadecimal it is D. Its square is 169. It is a Fibonacci number. Thirteen is a baker's dozen, one more than twelve, and is considered unlucky in some cultures.", "legend"], ["w-numf-15", "numf", "Fourteen (14)", "14 is spelled fourteen. It is even. Its factors are 1, 2, 7, 14. In Roman numerals it is XIV. In binary it is 1110 and in hexadecimal it is E. Its square is 196. Fourteen is two weeks of days, a fortnight.", "legend"], ["w-numf-16", "numf", "Fifteen (15)", "15 is spelled fifteen. It is odd. Its factors are 1, 3, 5, 15. In Roman numerals it is XV. In binary it is 1111 and in hexadecimal it is F. Its square is 225. It is a triangular number. Fifteen is the number of minutes in a quarter hour.", "legend"], ["w-numf-17", "numf", "Sixteen (16)", "16 is spelled sixteen. It is even. Its factors are 1, 2, 4, 8, 16. It is a perfect square, 4 times 4. In Roman numerals it is XVI. In binary it is 10000 and in hexadecimal it is 10. Its square is 256. Sixteen is the number of ounces in a pound and of tablespoons in a cup.", "legend"], ["w-numf-18", "numf", "Seventeen (17)", "17 is spelled seventeen. It is odd. It is a prime. In Roman numerals it is XVII. In binary it is 10001 and in hexadecimal it is 11. Its square is 289. Seventeen is a prime number often shown in puzzles because it is rarely a multiple of anything.", "legend"], ["w-numf-19", "numf", "Eighteen (18)", "18 is spelled eighteen. It is even. Its factors are 1, 2, 3, 6, 9, 18. In Roman numerals it is XVIII. In binary it is 10010 and in hexadecimal it is 12. Its square is 324. Eighteen is the age of adulthood in many places.", "legend"], ["w-numf-20", "numf", "Nineteen (19)", "19 is spelled nineteen. It is odd. It is a prime. In Roman numerals it is XIX. In binary it is 10011 and in hexadecimal it is 13. Its square is 361.", "legend"], ["w-numf-21", "numf", "Twenty (20)", "20 is spelled twenty. It is even. Its factors are 1, 2, 4, 5, 10, 20. In Roman numerals it is XX. In binary it is 10100 and in hexadecimal it is 14. Its square is 400. Twenty is a score, an old way of counting.", "legend"], ["w-numf-22", "numf", "Twenty-one (21)", "21 is spelled twenty-one. It is odd. Its factors are 1, 3, 7, 21. In Roman numerals it is XXI. In binary it is 10101 and in hexadecimal it is 15. Its square is 441. It is a Fibonacci number. It is a triangular number.", "legend"], ["w-numf-23", "numf", "Twenty-two (22)", "22 is spelled twenty-two. It is even. Its factors are 1, 2, 11, 22. In Roman numerals it is XXII. In binary it is 10110 and in hexadecimal it is 16. Its square is 484.", "legend"], ["w-numf-24", "numf", "Twenty-three (23)", "23 is spelled twenty-three. It is odd. It is a prime. In Roman numerals it is XXIII. In binary it is 10111 and in hexadecimal it is 17. Its square is 529.", "legend"], ["w-numf-25", "numf", "Twenty-four (24)", "24 is spelled twenty-four. It is even. Its factors are 1, 2, 3, 4, 6, 8, 12, 24. In Roman numerals it is XXIV. In binary it is 11000 and in hexadecimal it is 18. Its square is 576. Twenty-four is the number of hours in a day.", "legend"], ["w-numf-26", "numf", "Twenty-five (25)", "25 is spelled twenty-five. It is odd. Its factors are 1, 5, 25. It is a perfect square, 5 times 5. In Roman numerals it is XXV. In binary it is 11001 and in hexadecimal it is 19. Its square is 625. Twenty-five is the number of cents in a quarter.", "legend"], ["w-numf-27", "numf", "Twenty-six (26)", "26 is spelled twenty-six. It is even. Its factors are 1, 2, 13, 26. In Roman numerals it is XXVI. In binary it is 11010 and in hexadecimal it is 1A. Its square is 676. Twenty-six is the number of letters in the English alphabet.", "legend"], ["w-numf-28", "numf", "Twenty-seven (27)", "27 is spelled twenty-seven. It is odd. Its factors are 1, 3, 9, 27. It is a perfect cube, 3 cubed. In Roman numerals it is XXVII. In binary it is 11011 and in hexadecimal it is 1B. Its square is 729.", "legend"], ["w-numf-29", "numf", "Twenty-eight (28)", "28 is spelled twenty-eight. It is even. Its factors are 1, 2, 4, 7, 14, 28. In Roman numerals it is XXVIII. In binary it is 11100 and in hexadecimal it is 1C. Its square is 784. It is a triangular number. Twenty-eight is a perfect number and the number of days in February in a normal year.", "legend"], ["w-numf-30", "numf", "Twenty-nine (29)", "29 is spelled twenty-nine. It is odd. It is a prime. In Roman numerals it is XXIX. In binary it is 11101 and in hexadecimal it is 1D. Its square is 841.", "legend"], ["w-numf-31", "numf", "Thirty (30)", "30 is spelled thirty. It is even. Its factors are 1, 2, 3, 5, 6, 10, 15, 30. In Roman numerals it is XXX. In binary it is 11110 and in hexadecimal it is 1E. Its square is 900. Thirty is the number of days in April, June, September and November.", "legend"], ["w-numf-32", "numf", "Thirty-one (31)", "31 is spelled thirty-one. It is odd. It is a prime. In Roman numerals it is XXXI. In binary it is 11111 and in hexadecimal it is 1F. Its square is 961. Thirty-one is the number of days in seven months of the year.", "legend"], ["w-numf-33", "numf", "Thirty-two (32)", "32 is spelled thirty-two. It is even. Its factors are 1, 2, 4, 8, 16, 32. In Roman numerals it is XXXII. In binary it is 100000 and in hexadecimal it is 20. Its square is 1024. Thirty-two is the freezing point of water in Fahrenheit and a power of two.", "legend"], ["w-numf-34", "numf", "Thirty-three (33)", "33 is spelled thirty-three. It is odd. Its factors are 1, 3, 11, 33. In Roman numerals it is XXXIII. In binary it is 100001 and in hexadecimal it is 21. Its square is 1089.", "legend"], ["w-numf-35", "numf", "Thirty-four (34)", "34 is spelled thirty-four. It is even. Its factors are 1, 2, 17, 34. In Roman numerals it is XXXIV. In binary it is 100010 and in hexadecimal it is 22. Its square is 1156. It is a Fibonacci number.", "legend"], ["w-numf-36", "numf", "Thirty-five (35)", "35 is spelled thirty-five. It is odd. Its factors are 1, 5, 7, 35. In Roman numerals it is XXXV. In binary it is 100011 and in hexadecimal it is 23. Its square is 1225.", "legend"], ["w-numf-37", "numf", "Thirty-six (36)", "36 is spelled thirty-six. It is even. Its factors are 1, 2, 3, 4, 6, 9, 12, 18, 36. It is a perfect square, 6 times 6. In Roman numerals it is XXXVI. In binary it is 100100 and in hexadecimal it is 24. Its square is 1296. It is a triangular number. Thirty-six is the number of inches in a yard.", "legend"], ["w-numf-38", "numf", "Thirty-seven (37)", "37 is spelled thirty-seven. It is odd. It is a prime. In Roman numerals it is XXXVII. In binary it is 100101 and in hexadecimal it is 25. Its square is 1369.", "legend"], ["w-numf-39", "numf", "Thirty-eight (38)", "38 is spelled thirty-eight. It is even. Its factors are 1, 2, 19, 38. In Roman numerals it is XXXVIII. In binary it is 100110 and in hexadecimal it is 26. Its square is 1444.", "legend"], ["w-numf-40", "numf", "Thirty-nine (39)", "39 is spelled thirty-nine. It is odd. Its factors are 1, 3, 13, 39. In Roman numerals it is XXXIX. In binary it is 100111 and in hexadecimal it is 27. Its square is 1521.", "legend"], ["w-numf-41", "numf", "Forty (40)", "40 is spelled forty. It is even. Its factors are 1, 2, 4, 5, 8, 10, 20, 40. In Roman numerals it is XL. In binary it is 101000 and in hexadecimal it is 28. Its square is 1600. Forty is the length of a standard work week in hours in many places.", "legend"], ["w-numf-42", "numf", "Forty-one (41)", "41 is spelled forty-one. It is odd. It is a prime. In Roman numerals it is XLI. In binary it is 101001 and in hexadecimal it is 29. Its square is 1681.", "legend"], ["w-numf-43", "numf", "Forty-two (42)", "42 is spelled forty-two. It is even. Its factors are 1, 2, 3, 6, 7, 14, 21, 42. In Roman numerals it is XLII. I const EMR=`aurora|Depression: types and signs|Depression includes major depression, persistent low-grade depression and seasonal patterns. Signs include low mood or emptiness, lost interest, changes in sleep and appetite, fatigue, guilt and trouble concentrating. If it lasts two weeks or more, see a clinician. It is treatable with therapy, medication or both.
aurora|Anxiety disorders|Anxiety disorders include generalized anxiety (constant worry), social anxiety, panic disorder and phobias. Signs include restlessness, a racing heart, muscle tension and avoiding feared situations. Therapy such as CBT works well, and some people also benefit from medication. A clinician can assess what fits.
aurora|Panic attacks|A panic attack is a sudden surge of fear with a pounding heart, short breath and dizziness that peaks within minutes. It feels dangerous but passes. Slow breathing, naming what is happening and grounding with the five senses help. Get chest pain checked to be safe.
aurora|Trauma and PTSD|Trauma can leave the nervous system stuck on alert. PTSD may involve flashbacks, nightmares, avoidance, jumpiness and harsh beliefs after a frightening event. Trauma-focused therapy helps a great deal. Go gently, and work with a trained professional.
aurora|Social anxiety|Social anxiety is intense fear of being judged in social situations. It is more than shyness. It often improves with gradual practice, CBT and swapping thoughts like everyone is watching me for realistic ones.
nova|Bipolar disorder|Bipolar disorder involves mood episodes: mania or hypomania (high energy, little sleep, racing thoughts, risky choices) and depression. Bipolar I includes full mania, bipolar II includes hypomania and depression. It is a medical condition treated with mood stabilizing medication and therapy. Only a clinician can diagnose it.
nova|The stress response|Stress triggers fight, flight or freeze. Adrenaline and cortisol raise heart rate and sharpen focus. Short bursts help, but long-term stress wears on sleep, mood and health. Slow breathing, movement and rest let the body switch the alarm off.
nova|Sleep and mood|Sleep and mood affect each other. Poor sleep raises irritability and anxiety and can worsen depression. A steady schedule, a dark cool room, less late caffeine and screens off before bed help. Ongoing insomnia deserves a doctor’s attention.
oracle|Paranoia|Paranoia is persistent suspicion that others mean harm without enough evidence. It can come from stress, lack of sleep, substances, trauma, or conditions such as paranoid personality disorder or psychosis. Mild suspicion is common. If the thoughts feel convincing, frightening or disrupt life, talk to a clinician. Checking facts gently with someone you trust helps.
oracle|Stoic view of emotions|Stoic philosophy separates what you control, like your judgments and actions, from what you do not. Feelings are not wrong, but you can examine the thought behind them. Epictetus taught that we are disturbed more by our views of events than by the events themselves.
oracle|Hope and meaning|Viktor Frankl, a psychiatrist who survived the Nazi camps, argued that meaning helps people endure suffering. Small purposes, relationships and values can support hope in dark times. Hope grows through small steps, not only through feeling.
oracle|How treatment of mental illness changed|For centuries people with mental illness were hidden or mistreated in asylums. Modern care grew from 19th century reforms, medications from the 1950s, community care and talk therapy. Stigma has fallen but remains. Today treatment is evidence-based and recovery is expected.
legend|Burnout|Burnout is long-term exhaustion from chronic stress, with cynicism and a sense of being ineffective. It is not laziness. Recovery needs rest, boundaries, a lighter workload, support and sometimes changing the situation. If it deepens into hopelessness, see a professional.
legend|Decision fatigue|Making many decisions drains mental energy and leads to worse or avoided choices. Reduce it by deciding important things early in the day, using routines, limiting options and setting rules ahead of time.
legend|Resilience|Resilience is adapting well after stress. It grows from supportive relationships, realistic optimism, flexible thinking, healthy habits and learning from setbacks. It is built, not inborn, and asking for help is part of it.
titan|Doomscrolling and screen time|Doomscrolling is compulsively reading bad news, which can raise anxiety and hurt sleep. Set time limits, turn off non-essential notifications, pick fixed times for news and keep phones out of the bedroom.
titan|Mood tracking|Tracking mood, sleep and activity in a notes app can reveal patterns, like poor sleep before low days. Keep it simple: a score from 1 to 10 and a few words. Share the log with a clinician if you see one.
titan|Social media comparison|People post highlights, so comparing your life to feeds can fuel envy and low self-worth. Curate who you follow, take breaks and remember that what you see is edited.
pepper|Imposter syndrome|Imposter syndrome is feeling like a fraud despite real achievements, and it is common in high performers. Keep a record of wins, share the feeling with peers and treat mistakes as data. Skills are built, not just proven.
pepper|Perfectionism|Perfectionism sets standards so high that nothing feels good enough, and it often causes procrastination and anxiety. Aim for good enough, set time limits and judge effort as well as results.
pepper|OCD basics|Obsessive-compulsive disorder involves unwanted intrusive thoughts and repeated rituals done to ease distress. It is far more than being neat. Exposure and response prevention is the leading therapy, sometimes with medication.
vex|Music and mood|Music can change mood, release tension and help people process feelings. Upbeat tracks lift energy, slow tempos calm, and lyrics you relate to can help you feel understood. Music therapy is used alongside treatment.
vex|Stage fright|Performance anxiety causes shaking, a dry mouth and racing thoughts. Prepare well, practice in front of friends, breathe slowly and reframe nerves as excitement. Many great performers feel it every time.
vex|Creative blocks|Creative blocks often come from fear of judgment, perfectionism or exhaustion. Try small daily sessions, make bad drafts on purpose, change your setting and rest. A long block with low mood is worth talking about with someone.
vex|Sad songs and nostalgia|Sad songs can comfort by validating feelings. Nostalgia is a mix of warmth and longing that often boosts connection. If music keeps you stuck replaying the same worries, balance it with other activities.
elite|Financial anxiety|Money worry is a leading cause of stress. Helpful steps are knowing your numbers, making a simple budget, building a small emergency fund and paying the highest-interest debt first. Free credit counseling exists.
elite|Emotional spending|Buying to soothe stress gives a short lift and often regret. Wait 24 hours before non-essential purchases, notice the feeling behind the urge and find other comforts.
elite|Gratitude|Writing down three things you appreciate each day modestly improves mood over time. It works best as a habit with specific details, not forced positivity.
midnight|Loneliness and solitude|Loneliness is wanting more connection than you have, while solitude is chosen time alone. Loneliness affects health, so small steps help: one message, one shared activity. Quality of connection matters more than quantity.
midnight|Anger|Anger is a normal signal that a boundary was crossed. It becomes a problem when it explodes or is bottled up. Pause, breathe, name what is underneath it and act after the heat passes.
midnight|Emotional numbness|Feeling nothing can follow stress, trauma or depression as the mind protects itself. Gentle routines, movement and talking to someone help. If numbness lasts, a clinician can help.
luna|Exercise and mood|Regular movement reduces symptoms of anxiety and depression and improves sleep. Even a 10 minute walk helps. Pick something you enjoy and build gradually.
luna|Motivation and procrastination|Procrastination is usually avoiding a feeling, not laziness. Start with a two-minute step, remove friction and reward progress. Low energy that lasts for weeks may point to depression.
luna|Self-talk and confidence|Harsh self-talk drains confidence. Notice the voice, ask what you would say to a friend and swap in fair, specific statements. Confidence grows from keeping small promises to yourself.
simba|Mania and hypomania|Mania is an extreme high with little need for sleep, fast speech, grand ideas and risky choices. Hypomania is milder. Both can be part of bipolar disorder. Seek urgent help if safety is at risk.
simba|ADHD and impulsivity|ADHD involves differences in attention, restlessness and impulse control that start in childhood and can last into adulthood. Routines, timers, breaking tasks into steps and sometimes medication help. A professional evaluation is needed.
simba|Humor as coping|Humor can reduce stress and help people bond. It helps most when it is kind and not used to dodge feelings that need attention.
panther|Pets and wellbeing|Pets can ease loneliness, add routine and lower stress. Caring for a cat or dog gives structure and affection, though pets do not replace professional care.
panther|Pet loss grief|Grief after losing a pet is real and can be intense. Allow yourself to mourn, make a ritual or keepsake and talk with people who understand. Pet loss support groups exist.
panther|Driving anxiety and road rage|Driving anxiety can follow an accident or a fear of losing control, and gradual practice in quiet places helps. Road rage is anger behind the wheel: leave early, breathe and do not engage with aggressive drivers.`;

<script>
/* HOW-TO LIBRARY - detailed step-by-step explanations, offline. Each entry: need, how it works, steps, example, problems, fixes, alternatives. */
(function(){
const H=[
{k:/(reset|restart|reboot).*(router|modem|wi-?fi box)|(router|modem).*(reset|restart|reboot)/,t:"Restart or reset your router",simple:"A router is a small computer. Restarting clears its short-term memory, like closing and reopening an app.",need:["The router and its power cable","About 5 minutes","Only for a full reset: the router’s default Wi-Fi name and password (often on a sticker)"],how:"A restart (power cycle) just clears the router’s temporary state. A factory reset also erases your Wi-Fi name, password and settings and puts it back to how it shipped.",steps:["Unplug the router (and the modem, if it’s a separate box) from power.","Wait a full 30 seconds. This lets it fully discharge.","Plug the modem in first and wait 2 minutes for its lights to settle.","Plug the router in and wait another 2 minutes.","Check your phone or PC. If the internet’s back, you’re done.","Only if that failed: hold the small recessed Reset button for 10 seconds with a paperclip, release, and set the router up again with the sticker’s name and password."],example:"Example: your phone shows Wi-Fi connected but pages won’t load. A power cycle fixes this surprisingly often, because the router’s connection to your provider got stuck.",problems:["A factory reset deletes your custom Wi-Fi name and password, so every device must reconnect.","Pressing Reset for only a second just restarts it.","Some routers are provider-managed, so a reset can break their setup."],fix:["No lights at all: check the power adapter and outlet.","Lights on but no internet: the problem is probably your provider, so check their outage page on mobile data.","Phone connects but no internet: forget the network on the phone and rejoin."],alt:["Restart from the router’s admin page (often 192.168.1.1) with no unplugging.","Use a smart plug to reboot it on a schedule.","Call your provider if it keeps dropping."]},
{k:/(pair|connect).*(bluetooth|headphones|earbuds|speaker)|bluetooth.*(pair|connect|not working)/,t:"Pair a Bluetooth device",simple:"Both devices must announce themselves at the same time so they can find each other.",need:["The Bluetooth device, charged","Your phone or PC with Bluetooth on"],how:"Bluetooth devices only connect to something new while in pairing mode, which is a short window where they broadcast their name. After the first pairing they remember each other.",steps:["Charge the device for a few minutes.","Put it in pairing mode: usually hold the power button 5 to 7 seconds until a light blinks blue/white or you hear a tone.","On your phone: Settings, Bluetooth, turn it on, and wait for the list to refresh.","Tap the device’s name when it appears.","Confirm any pairing prompt. Play something to test it."],example:"Example: earbuds in the case. Open the case lid and hold the button on the case until the light flashes, then pick them on your phone.",problems:["Device not appearing: it left pairing mode (they time out after about 1 to 2 minutes).","Already paired to another phone, which grabs it first.","Audio comes from the phone speaker: it connected but isn’t selected as output."],fix:["Forget the device in Bluetooth settings, then pair again from scratch.","Turn Bluetooth off and on, or restart the phone.","Reset the device itself (often hold the button 15 seconds, check the manual)."],alt:["Use a 3.5 mm or USB-C wired connection.","Use a Bluetooth adapter on PCs without Bluetooth."]},
{k:/(free up|clear|get more|running out of|low).*(storage|space)|storage.*(full|low)|phone.*(full)/,t:"Free up phone storage",simple:"Your phone is a full closet. You throw out the biggest, oldest things first.",need:["10 to 20 minutes","A backup option (cloud photo backup or a computer)"],how:"Most space is taken by photos and videos, then apps and their cached data, then downloads. Look at what is biggest before deleting anything.",steps:["Open Settings, Storage. See what category is biggest.","Back up your photos and videos first (to your cloud photos app or a computer), then delete the local copies.","Uninstall apps you haven’t opened in months (Storage often lists them).","Clear cache for big apps like browsers, social and streaming apps (Settings, Apps, the app, Storage, Clear cache).","Delete old downloads and large videos, and empty ‘recently deleted’ in your gallery.","In messaging apps, clear large media from old chats."],example:"Example: a phone with 3 GB left, 28 GB of videos. Backing them up and deleting local copies frees the space in minutes.",problems:["‘Clear data’ deletes logins and saves, but ‘Clear cache’ is safe.","Deleting photos before backup confirms is permanent.","Offline downloads (maps, music) quietly use gigabytes."],fix:["Storage doesn’t go down: restart the phone, since deleted items can take a bit to update.","Low space even after cleaning: check ‘System’ or ‘Other’ and consider a factory reset only after backup."],alt:["Add a microSD card if the phone has a slot.","Stream instead of downloading.","Use a ‘free up space’ tool in your photo app."]},
{k:/(slow|speed up|lagging|laggy|fix).*(pc|computer|laptop|windows)|(pc|computer|laptop).*(slow|lag)/,t:"Speed up a slow PC",simple:"Too many things are running at once and the drive or memory is full.",need:["15 to 30 minutes","A Windows PC with admin access","Optionally a USB stick for backup"],how:"PCs slow down when startup programs, a nearly full drive, too little memory, a failing drive or malware compete for resources. Find the bottleneck before changing things.",steps:["Restart the PC. It sounds silly, but it clears a lot.","Open Task Manager (Ctrl+Shift+Esc), Processes. Sort by CPU, Memory and Disk to see what’s hogging.","In Task Manager, Startup tab: disable apps you don’t need at boot.","Settings, System, Storage: free space so the C: drive has at least 15 to 20 percent free.","Run Windows Update and a Windows Security full scan.","If the PC has a hard drive and 8 GB or less, the best upgrades are an SSD and more RAM."],example:"Example: boot takes 5 minutes, Task Manager shows Disk at 100 percent. That’s usually a hard drive struggling, and an SSD upgrade is the big fix.",problems:["Don’t use ‘registry cleaners’. They rarely help and can break things.","Disabling the wrong startup item can break antivirus or drivers.","Overheating also makes PCs slow, so check fans and dust."],fix:["Disk 100 percent: check drive health (SMART) before spending money.","Memory above 90 percent: close tabs or add RAM.","Still slow: back up your files, then reset Windows."],alt:["Install a lightweight Linux for an old machine.","Use a lighter browser or fewer tabs."]},
{k:/(secure|protect|strong|make|create).*(password|account)|two.?factor|2fa|set up 2fa/,t:"Secure your accounts (strong password and 2FA)",simple:"A long unique password is the lock, and a code on your phone is the second lock.",need:["A password manager (built-in browser one is fine to start)","Your phone for an authenticator app","15 minutes"],how:"Attackers reuse leaked passwords across sites. Unique, long passwords stop that, and two-factor authentication means a stolen password alone isn’t enough.",steps:["Pick a password manager (Bitwarden, your phone’s built-in one, or similar).","Start with email and banking. Change each password to a long random one (16+ characters) generated by the manager.","Turn on two-factor in each account’s security settings. Prefer an authenticator app over SMS.","Save the backup codes somewhere safe and offline, such as written down.","Repeat for your other important accounts over the next few days."],example:"Example: a passphrase like four random words strung together is long and easier to remember than ‘P@ssw0rd!’.",problems:["Losing your phone without backup codes can lock you out.","Using the same password anywhere defeats the point.","Never share codes, even with someone claiming to be support."],fix:["Locked out: use backup codes or the account’s recovery process.","New phone: move your authenticator app accounts before wiping the old one."],alt:["Use hardware security keys for important accounts.","Passkeys, where a site supports them."]},
{k:/(back ?up|backup).*(phone|photos|contacts)|save.*(phone data)/,t:"Back up your phone",simple:"Make a second copy so losing the phone doesn’t mean losing everything.",need:["Wi-Fi","A cloud account or a computer and cable","10 to 30 minutes"],how:"A backup is a copy stored somewhere else. Cloud backups run automatically on Wi-Fi, and a computer backup is a manual copy.",steps:["Connect to Wi-Fi and plug the phone in.","Open Settings, search ‘Backup’, and turn on your phone’s cloud backup. Choose what to include.","Open your photo app’s settings and turn on photo backup.","Tap ‘Back up now’ and wait for it to finish.","Once a month, check the date of the last backup.","For a second copy, plug the phone into a computer and copy the DCIM and Download folders."],example:"Example: before a factory reset, confirm the backup date says today, then reset.",problems:["Free cloud space fills up and silently stops backing up.","Messaging app chats often need their own backup setting.","Backups don’t include everything, like some game data."],fix:["Backup stuck: connect to Wi-Fi, charge, and free cloud space.","Missing photos: check the photo app’s backup status screen."],alt:["Copy to a USB drive or an external SSD.","Use more than one backup place."]},
{k:/(github pages|host.*(website|site|pwa|page)|put.*(site|website|app).*online|publish.*(site|website))|upload.*(pwa|site).*github/,t:"Host a website for free on GitHub Pages",simple:"GitHub stores your website files, and Pages turns them into a real web address.",need:["A free GitHub account","Your website files (index.html and the rest)","A browser, phone is fine"],how:"GitHub Pages serves the files in a repository as a website. Whatever is at the repository root becomes the site, and index.html is the front page.",steps:["Sign in to GitHub and tap New repository. Name it, set Public, and create it.","Tap Add file, Upload files, and select every file from your project (all of them, including data files).","Commit the upload.","Open the repository Settings, then Pages.","Under Source choose ‘Deploy from a branch’, pick the main branch and the root folder, and Save.","Wait 1 to 2 minutes, reload the Pages screen, and open the link it shows.","On your phone, open the link and choose Add to Home screen to install."],example:"Example: repository ‘legendary-twelve’ gives the site at yourname.github.io/legendary-twelve.",problems:["404 means index.html isn’t at the repository root or the files are in a subfolder.","Forgetting some files (like data .json files) breaks features.","Old versions are cached, so reload twice after an update."],fix:["Still 404 after 5 minutes: check Settings, Pages for a green ‘live’ message.","Changes not showing: hard refresh, or clear the site’s data once.","Files too large to upload on mobile: upload in batches."],alt:["Netlify or Cloudflare Pages (drag and drop folder).","Host from a USB stick or local network for private use."]},
{k:/(run|execute|start).*(python|\.py)|python.*(not recognized|not found|won'?t run)/,t:"Run a Python script on Windows",simple:"You tell Python which file to read and it follows the instructions in it.",need:["Python installed (python.org, tick ‘Add Python to PATH’)","Your script file (for example hello.py)","Command Prompt or Windows Terminal"],how:"Python is a program that reads your .py file and executes it line by line. The terminal needs to know where Python is (PATH) and where your file is (current folder).",steps:["Install Python from python.org and tick ‘Add python.exe to PATH’ in the installer.","Open the folder containing your script, click the address bar, type cmd and press Enter.","Check Python works: type python --version","Run your script: type python hello.py","If it needs packages, install them first with python -m pip install package_name"],example:"Example: save print('Hello') as hello.py, run python hello.py, and you should see Hello.",problems:["‘python is not recognized’ means PATH wasn’t set. Reinstall and tick the PATH box, or use py hello.py.","Running from the wrong folder gives ‘can’t open file’.","Multiple Python versions can use different packages."],fix:["Try py instead of python.","Use python -m pip, not just pip.","Read the last line of any error. It says what went wrong."],alt:["Run it in an IDE such as VS Code or IDLE with a Run button.","Use a virtual environment for bigger projects."]},
{k:/(git|github).*(commit|push|upload|save)|(commit|push).*(git|code|changes)/,t:"Commit and push code with Git",simple:"Commit saves a snapshot of your work, and push sends that snapshot to GitHub.",need:["Git installed","A repository (git clone or git init)","A GitHub account"],how:"Git tracks changes. You stage the files you want, commit them with a message, and push the commit to the remote copy on GitHub.",steps:["Open a terminal in your project folder.","See what changed: git status","Stage files: git add . (or name specific files)","Commit with a message: git commit -m \"Describe the change\"","Send to GitHub: git push","Check your repository on GitHub to see the update."],example:"Example: you fixed a typo. git add index.html, git commit -m \"Fix typo\", git push.",problems:["‘Please tell me who you are’: run git config --global user.name and user.email once.","Push rejected: someone else’s changes exist, so run git pull first.","Don’t commit passwords or API keys."],fix:["Authentication failed: use a personal access token instead of your password.","Committed the wrong thing: git reset --soft HEAD~1 undoes the last commit but keeps changes."],alt:["Use GitHub Desktop or the GitHub web upload for simple cases.","Use VS Code’s Source Control panel."]},
{k:/(learn|start|begin|get into).*(coding|programming|code|python|javascript)/,t:"Start learning to code",simple:"Pick one language, make tiny programs, and build up slowly.",need:["A computer (or even a phone to begin)","30 to 60 minutes, most days","One small project idea"],how:"Coding is a skill like an instrument. You learn by writing small programs, breaking them and fixing them, not by watching tutorials.",steps:["Pick one language. Python is great for beginners, JavaScript if you want websites.","Install it (or use an in-browser editor).","Learn the basics: variables, if statements, loops, functions, lists.","Do small exercises every day, even 20 minutes.","Pick a tiny project (a quiz, calculator, to-do list) and build it.","When stuck, read the error, search it, then ask for help with the exact error text.","Save everything on GitHub as you go."],example:"Example: first project in Python, a number guessing game, uses variables, input, a loop and an if.",problems:["Tutorial hell: watching without building teaches little.","Switching languages too early slows you down.","Skipping error messages makes everything harder."],fix:["Stuck for 30+ minutes: explain the problem out loud, step away, then return.","Overwhelmed: shrink the project until it’s doable in an hour."],alt:["Interactive courses (freeCodeCamp, CS50, Codecademy free tier).","Build mods or bots for a game you like."]},
{k:/(make|build|create).*(website|web site|web page|webpage|landing page)/,t:"Build a first website",simple:"A website is a text file of instructions that a browser turns into a page.",need:["A text editor (VS Code or Notepad)","A browser","Optionally a GitHub account to publish"],how:"HTML defines what’s on the page, CSS defines how it looks, and JavaScript adds behavior. A single index.html file can be a full site.",steps:["Make a folder and a file named index.html.","Add the basic structure: <!DOCTYPE html>, <html>, <head> with a <title>, and <body>.","Add content inside body: <h1>, <p>, <img>, <a>.","Add style with a <style> block in head: colors, fonts, spacing.","Open the file in your browser to preview. Refresh after each save.","Publish it for free with GitHub Pages or Netlify."],example:"Example: <h1>My page</h1><p>Hello!</p> inside body already works.",problems:["Forgetting to save before refreshing.","Image links that point to files you didn’t include.","Page looks tiny on phones without <meta name=\"viewport\">."],fix:["Blank page: check you typed the tags closed correctly.","Style not applying: check the selector and spelling."],alt:["Website builders if you don’t want to code.","Start from a free template and edit it."]},
{k:/(take|capture|get).*screenshot|screenshot.*(phone|android|iphone|pc|windows)/,t:"Take a screenshot",simple:"Press two buttons at once and the screen is saved as a picture.",need:["Your device"],how:"Every device has a built-in shortcut that saves what’s on screen as an image.",steps:["Android: press Power and Volume Down together for a second.","iPhone: press Side button and Volume Up together (or Home and Side on older ones).","Windows: press Windows key + Shift + S, drag to select, or press PrtScn.","Mac: Command + Shift + 3 for the whole screen, 4 to select.","Find it in your Photos or Screenshots folder."],example:"Example: on most Android phones, a thumbnail pops up at the corner after the shot, tap it to edit or share.",problems:["Some apps (banking, streaming) block screenshots.","Wrong button timing just dims or locks the screen."],fix:["Press both buttons at exactly the same moment.","Try the swipe-three-fingers gesture in settings if available."],alt:["Quick Settings tile or voice assistant.","Scrolling screenshot option for long pages."]},
{k:/(wi-?fi|internet).*(not working|won'?t connect|keeps dropping|slow|down)|(fix|troubleshoot).*(wi-?fi|internet)/,t:"Fix Wi-Fi that isn’t working",simple:"Work from the device outward until you find where the chain breaks.",need:["Your phone or PC","Access to the router","10 minutes"],how:"Internet problems are in one of three places: the device, the router, or your provider. Testing in that order finds the cause fast.",steps:["Test another device. If only one device fails, the problem is that device.","On the failing device: toggle Wi-Fi off and on, or Airplane mode on then off, and restart it.","Forget the network and rejoin with the password.","Restart the router and modem (unplug 30 seconds).","Move closer to the router to rule out weak signal.","Check your provider’s outage page using mobile data.","If everything fails, factory reset the router as a last step."],example:"Example: laptop says ‘No internet, secured’. Phone works fine. Fix: forget the network on the laptop and rejoin.",problems:["Interference from microwaves, thick walls and crowded channels.","Wrong password after a router reset.","IP conflicts or old DNS."],fix:["Use 5 GHz for speed up close and 2.4 GHz for range.","Switch DNS to 1.1.1.1 or 8.8.8.8.","Update the router firmware."],alt:["Use mobile hotspot temporarily.","Add a mesh node or access point for dead zones.","Ethernet cable for PCs."]},
{k:/(battery|charge).*(drain|dies|dying|fast|bad|saving|last longer)|(save|extend).*(battery)/,t:"Stop fast battery drain",simple:"Something is using power in the background, or the battery is getting old.",need:["Your phone’s battery settings","10 minutes"],how:"Battery drain comes from screen brightness, background apps, bad signal and an aging battery. Battery settings show which one is guilty.",steps:["Open Settings, Battery, and look at usage per app.","Restrict background activity for the worst apps.","Lower screen brightness and turn on adaptive brightness or dark mode.","Turn off location for apps that don’t need it.","Update apps and the phone’s system.","Restart the phone. Stuck processes often drain power.","Check Battery health. Below about 80 percent, consider replacing it."],example:"Example: a social app using 30 percent in the background. Restricting it can add hours.",problems:["Weak signal makes the phone work harder and burn power.","Heat and fast charging age the battery.","‘Battery saver’ apps usually don’t help."],fix:["Drain started after an update: reboot, or wait a day or two for fixes.","Still draining: boot in safe mode to test if an app causes it."],alt:["Use battery saver mode.","Carry a power bank.","Replace the battery."]},
{k:/(test|check|measure).*(battery|voltage|circuit|continuity|fuse)|multimeter/,t:"Test a battery or circuit with a multimeter",simple:"A multimeter is a measuring stick for electricity.",need:["A multimeter","The battery or circuit","Safety: no mains electricity unless you know what you’re doing"],how:"Voltage is the push in a circuit. A battery under no load should read near its rated voltage, and a low reading means it’s weak or dead. Continuity mode beeps when two points are connected.",steps:["Plug the black lead into COM and the red lead into the V (volts) jack.","Set the dial to DC voltage (V with a straight line), at a range above the battery’s voltage (for example 20 V for a 9 V battery).","Touch the red probe to the positive (+) end and black to the negative (-) end.","Read the number. A fresh AA is about 1.5 V, a 9 V about 9 V, a car battery about 12.6 V.","For continuity: set to the beep/diode symbol, touch both probes together to confirm it beeps, then test the part.","Switch the dial off when done."],example:"Example: an AA reading 1.1 V is nearly flat even if a device barely works.",problems:["Measuring current in the wrong jack can blow the meter’s fuse.","A battery can read good with no load and still fail under load.","Never measure resistance or continuity on a powered circuit."],fix:["No reading: check leads in the correct jacks and the dial setting.","Reading jumps: poor contact, press probes firmly."],alt:["Cheap battery testers for common sizes.","Load tests for car batteries."]},
{k:/(solder|soldering)/,t:"Solder basics",simple:"Melting metal glue to join two metal parts.",need:["Soldering iron (about 330 to 350 C)","Lead-free or leaded solder with flux core","Sponge or brass wool","Helping hands, ventilation, safety glasses"],how:"Solder melts and flows onto two heated metal surfaces, then cools into an electrical and mechanical joint. The key is heating the parts, not the solder.",steps:["Set up in a ventilated spot with a stand for the iron.","Clean the tip with brass wool and tin it with a little fresh solder.","Place the part in the hole and hold it steady.","Touch the iron to both the pad and the lead for about 2 seconds.","Feed solder into the joint (not onto the iron) until a small shiny cone forms.","Remove the solder, then the iron. Don’t move the part for 3 to 5 seconds.","Trim the lead and inspect the joint."],example:"Example: a good joint is shiny and shaped like a tiny volcano. A dull, ball-shaped blob is a cold joint.",problems:["Cold joints from not heating both surfaces.","Burns from the tip or hot solder.","Bridging between pins with too much solder."],fix:["Cold joint: reheat and add a little fresh solder.","Bridge: use desoldering braid to wick it away."],alt:["Use connectors, crimp terminals or breadboards for no-solder projects.","Hot air station for surface-mount."]},
{k:/(clean|fix|restore).*(cartridge|retro game|nes|snes|n64|genesis|game boy|gameboy)|(retro|old).*(game).*(not working|won'?t load|clean)/,t:"Clean a retro game cartridge",simple:"The metal contacts get dirty, so gently clean them.",need:["99% isopropyl alcohol","Cotton swabs or a soft cloth","A game bit or screwdriver to open it (optional)"],how:"Cartridges talk to the console through metal pins. Dirt and oxidation block the connection, so the game flickers or won’t load.",steps:["Turn the console off and unplug it.","Dip a cotton swab in isopropyl alcohol (99% is best).","Gently scrub the edge connector (the gold or silver contacts) until the swab stops coming away dirty.","Let it dry fully for several minutes.","Clean the console’s cartridge slot pins the same way using a swab or a card wrapped in a cloth.","Reinsert firmly and power on."],example:"Example: a Super Nintendo game showing a gray screen often starts after a good contact cleaning.",problems:["Using too much liquid or abrasive scrubbing damages the contacts.","Bending the pins in the console.","Fake games may never work."],fix:["Still failing: try another game to test the console.","Try a different cleaning pass, or replace the console’s 72-pin or other connector."],alt:["Clean with a pencil eraser very gently (not recommended unless needed).","Replace the console’s slot connector."]},
{k:/(improve|get better|better).*(aim|fps|shooter|shooting)|aim.*(better|improve|practice)/,t:"Improve your aim in shooters",simple:"Practice smooth, small movements and fix your setup first.",need:["A mouse or controller you like","A consistent sensitivity","15 to 30 minutes of practice a day"],how:"Aim is muscle memory plus good habits. Consistent settings, crosshair placement and short focused practice beat long random sessions.",steps:["Lock your setup: pick one sensitivity and keep it for weeks.","Place your crosshair at head height where enemies appear.","Practice 10 to 15 minutes in an aim trainer or a range before playing.","Aim with your arm for big moves and wrist for small, not tense.","Slow down: accuracy first, then speed.","Review your deaths. Ask whether positioning, not aim, was the issue.","Take breaks and sleep, since tired aim is worse."],example:"Example: dropping sensitivity a bit and doing 10 minutes of tracking drills before ranked games gives steady gains over two weeks.",problems:["Changing sensitivity constantly resets your muscle memory.","Tilting after losses makes aim worse.","Gripping too tight causes shaky aim."],fix:["Stuck on a plateau: change one thing at a time and track results.","Pain in wrist: rest, fix posture, and see a professional if it persists."],alt:["Controller aim assist tuning.","Use a gaming mouse pad with consistent glide."]},
{k:/(beat|defeat|get past|win).*(boss|level)|boss.*(too hard|beat|keep dying)/,t:"Beat a hard boss",simple:"Learn the boss’s patterns, then practice one safe piece at a time.",need:["Patience","Notes on what kills you","The game’s upgrades or builds available"],how:"Bosses repeat attack patterns. Dying teaches you the patterns, so progress comes from recognizing the tells and being safe between attacks.",steps:["Watch the first minute without trying to win. Learn each attack’s wind-up.","Write down the attacks and what dodges or blocks each one.","Level up, upgrade gear, or change builds if you’re underpowered.","Fight in phases. Aim to survive one phase cleanly before pushing.","Only attack in the safe windows after the boss’s moves.","Heal and use items before you need them, not after.","Take a break after several tries and come back fresh."],example:"Example: a boss that swings twice then pauses. Dodge the two swings, hit once, back off. Repeat.",problems:["Greed (one more hit) is the top cause of deaths.","Tunnel vision on your health instead of the boss’s animation.","Being under-leveled makes it feel unfair."],fix:["Check the game’s wiki for weaknesses.","Try summons, co-op or a different weapon.","Lower the difficulty if available. It’s okay."],alt:["Farm to level up first.","Watch a guide for the tells only, not the whole fight."]},
{k:/(start|begin|learn|get into).*(wrestling|grappling)|wrestling.*(training|basics|beginner)/,t:"Start wrestling training safely",simple:"Find a coach, learn to fall safely, and build up slowly.",need:["A local club, gym or coach","Comfortable athletic clothing","Water and a towel","Medical OK if you have any health concerns"],how:"Wrestling is learned in layers: stance and movement, takedown basics, then control and escapes. Safe falling (and a good coach) come first.",steps:["Find a local wrestling or grappling club and try a free class.","Warm up properly: neck, shoulders, hips, light jogging.","Learn stance and movement first: knees bent, back straight, hands up.","Learn to fall safely: breakfalls and rolls on mats.","Drill one or two basic moves (single leg, sprawl) slowly with a partner.","Build conditioning: bodyweight, cardio and neck strengthening.","Rest and eat well between sessions."],example:"Example: first month is mostly stance, movement, rolls and drilling a basic takedown with no hard sparring.",problems:["Training without a coach risks injuries.","Overtraining without rest.","Neck and shoulder strain from poor technique."],fix:["Pain that doesn’t fade: stop and see a doctor.","Skin infections: shower right after practice and keep gear clean."],alt:["Judo or Brazilian jiu-jitsu clubs if wrestling is not nearby.","Fitness and flexibility work at home until you find a club."]},
{k:/(introduce|bring home|new).*(cat|kitten)|cat.*(introduce|meet).*(cat|dog)/,t:"Introduce a new cat to your home",simple:"Go slowly so smell comes before sight.",need:["A separate quiet room","Litter box, food, water, bed, hiding spot","1 to 2 weeks of patience"],how:"Cats are territorial and scent-driven. Gradual introductions help them learn each other’s smell before meeting.",steps:["Set up a closed ‘base room’ for the new cat with food, litter and hiding spots.","Let them settle for a few days.","Swap bedding between cats so they learn each other’s scent.","Feed them on opposite sides of the closed door.","Open the door a crack with a barrier or crate for short, supervised meetings.","Allow brief supervised time together, rewarding calm behavior with treats.","Increase time slowly over days to weeks."],example:"Example: day 1 to 3 base room, day 4 to 7 scent swap and door feeding, week 2 short supervised sessions.",problems:["Rushing leads to fights and stress.","Not enough litter boxes (rule of thumb: one per cat plus one).","Hissing at first is normal, but constant fighting isn’t."],fix:["If they fight: separate calmly and restart slowly.","Persistent aggression: talk to a vet or a cat behaviorist."],alt:["Use feline pheromone diffusers.","Use baby gates for visual access without contact."]},
{k:/(cat|kitten).*(litter|peeing|pooping|outside the box|accident)|litter box.*(problem|avoid|won'?t use)/,t:"Fix a cat avoiding the litter box",simple:"First rule out a health issue, then fix the box setup.",need:["A vet visit if it’s sudden","Unscented litter and clean boxes","Enzymatic cleaner"],how:"Cats avoid the litter box because of medical problems, dirty boxes, litter they dislike, stress or location. A sudden change often means health.",steps:["Book a vet check first, especially if it started suddenly or the cat is straining.","Scoop at least once a day and fully wash the box weekly with mild soap.","Use one box per cat plus one extra, in quiet spots.","Try unscented clumping litter.","Clean accidents with an enzymatic cleaner so the smell is gone.","Reduce stressors: new pets, noise, schedule changes.","Reward use with calm praise or a treat."],example:"Example: a cat suddenly peeing outside the box could have a urinary issue, so see the vet first.",problems:["Punishing the cat makes it worse.","Strong cleaners or scented litter can drive cats away.","Urinary blockages in male cats are an emergency."],fix:["Straining or no urine: go to the vet or emergency vet now.","Persisting after a clean bill of health: try a different box type or location."],alt:["Large, uncovered boxes suit many cats.","Pheromone diffusers for stress."]},
{k:/(write|make|create).*(song|lyrics|lyric|verse|chorus)/,t:"Write a song or lyrics",simple:"Start with one true feeling and build lines around it.",need:["A feeling or story to write about","Notes app or paper","A beat or chord loop if you want one"],how:"Songs usually have verses that tell the story, a chorus with the main hook, and sometimes a bridge for a twist. The chorus is the heart, so start there.",steps:["Pick one feeling or one story. One idea per song.","Write the hook line, the sentence you want people to remember.","Build the chorus around the hook, with a simple rhyme or repeated phrase.","Write verse 1: set the scene with specific details, not general statements.","Write verse 2: move the story forward or deepen the feeling.","Add a bridge only if you need a change of perspective.","Read it out loud over a beat and trim anything clunky."],example:"Example: hook ‘static in my chest’. Verse: the room, the phone, the silence. Chorus: the hook, repeated with a twist at the end.",problems:["Trying to be clever instead of honest.","Too many ideas in one song.","Fighting for perfect rhymes."],fix:["Stuck: write the worst version and fix it later.","Switch to a different section and come back."],alt:["Start from a beat or a chord progression first.","Write from a title or image prompt."]},
{k:/(make|create|produce|build).*(beat|instrumental|track)/,t:"Make a beat",simple:"Pick a tempo, a drum pattern, then a bassline and a melody on top.",need:["A music app (FL Studio Mobile, BandLab, GarageBand, LMMS)","Headphones","A reference song you like"],how:"A beat is layers: drums set the rhythm, bass holds the foundation, and melody gives it a hook. Keeping each layer simple makes it sound professional.",steps:["Set the tempo (BPM): 70 to 90 for hip-hop, 120 to 128 for house, 140 for trap.","Build a drum loop: kick on the strong beats, snare on 2 and 4, hi-hats between.","Add a bassline that follows the kick.","Add a simple chord or melody loop, 4 or 8 bars.","Arrange: intro, main loop, a drop-out, back in, ending.","Balance volumes so nothing clips, kick and bass in the center.","Listen on phone speakers and headphones before you finish."],example:"Example: 90 BPM, kick on 1 and the ‘and’ of 2, snare on 2 and 4, a slow minor-key piano loop.",problems:["Too many layers fighting for the same frequencies.","Loudness war: leave headroom.","Not finishing tracks."],fix:["Muddy sound: cut low frequencies from non-bass instruments.","Boring loop: change one element every 4 or 8 bars."],alt:["Start from a free sample pack or loops.","Remix a section of your own song."]},
{k:/(study|focus|concentrat|stop procrastinat|get motivated).*|how.*(study|focus)/,t:"Study or focus better",simple:"Short focused sessions, one task, phone away.",need:["A timer","A quiet spot","A clear list of what to study"],how:"Focus is easier in short bursts with clear goals and fewer distractions. Testing yourself beats rereading.",steps:["Write the exact task (‘finish 10 practice problems’, not ‘study’).","Put your phone out of reach or on do-not-disturb.","Work for 25 minutes, then break for 5 (repeat 4 times, then a longer break).","Quiz yourself from memory instead of rereading.","Explain the topic out loud as if teaching someone.","Review briefly the next day and again after a week.","Sleep and eat. They matter more than extra hours."],example:"Example: 25 minutes on flashcards, 5 minute walk, 25 minutes on practice problems.",problems:["Multitasking cuts focus and memory.","Cramming the night before fades fast.","Starting is the hardest part."],fix:["Can’t start: commit to just 5 minutes.","Easily distracted: use website blockers and a clean desk."],alt:["Study with a friend or in a library.","Use a different method: diagrams, practice tests, teaching."]},
{k:/(make|create|start|set up).*(budget)|budget.*(start|make|plan)|save money/,t:"Make a simple budget",simple:"Know what comes in, decide where it goes before you spend it.",need:["Your monthly income","Your bills and spending for the past 1 to 2 months","A notes app or spreadsheet"],how:"A budget assigns every dollar a job. A popular starting point is 50 percent needs, 30 percent wants and 20 percent savings or debt, adjusted to your life.",steps:["List your monthly take-home income.","List fixed bills: rent, utilities, phone, insurance, loan payments.","Look at last month’s spending to estimate food, gas, fun.","Subtract expenses from income to see what’s left.","Set a savings target, even a small one, and automate it.","Track spending weekly for the first month.","Adjust categories until the numbers balance."],example:"Example: $2,000 income, $1,000 needs, $600 wants, $400 savings gives a 50/30/20 style plan.",problems:["Forgetting yearly or irregular costs.","Making it too strict to follow.","Not tracking, so the plan stays theoretical."],fix:["Overspent a category: move money from another and keep going.","Income varies: budget with your lowest typical month."],alt:["Envelope or cash method.","A budgeting app with bank syncing if you’re comfortable."]},
{k:/(sleep|fall asleep|insomnia).*(better|faster|can'?t|trouble)|how.*(fall asleep|sleep better)/,t:"Sleep better",simple:"A steady schedule and a calm, dark, cool room do most of the work.",need:["A consistent bedtime","A dark, cool, quiet room","Screens off 30 to 60 minutes before bed"],how:"Your body clock likes regularity. Light, caffeine and stress keep the brain alert, so the goal is to signal ‘night’ consistently.",steps:["Pick a wake-up time and keep it every day, even weekends.","Get bright light soon after waking, and dim lights in the evening.","Stop caffeine by early afternoon.","Put screens away 30 to 60 minutes before bed.","Keep the room cool, dark and quiet.","If you can’t sleep after about 20 minutes, get up, do something calm, then return.","Write tomorrow’s worries in a notebook before bed."],example:"Example: same wake time daily, no coffee after 2 pm, phone on the charger across the room.",problems:["Naps late in the day can steal sleep.","Alcohol makes sleep lighter.","Checking the clock increases anxiety."],fix:["Racing thoughts: slow breathing or a body scan.","Long-term trouble: talk to a doctor."],alt:["White noise or a fan.","A warm shower before bed."]},
{k:/(calm down|relax|stop (feeling )?(anxious|stressed)|cope with stress|panic)/,t:"Calm down when stressed",simple:"Slow your breathing and bring your attention to the present.",need:["2 to 5 minutes","A seat or a place to stand"],how:"Slow breathing tells your nervous system to ease off, and grounding pulls attention away from racing thoughts. It helps in the moment but doesn’t replace support for ongoing anxiety.",steps:["Sit or stand and relax your shoulders.","Box breathe: in 4 seconds, hold 4, out 4, hold 4. Repeat 4 or more times.","Name 5 things you can see, 4 you can hear, 3 you can feel.","Drink some water and loosen your jaw and hands.","Step outside or move for a minute if you can.","Talk to someone you trust about what’s going on."],example:"Example: before a test, 4 rounds of box breathing and a short walk.",problems:["If breathing makes you dizzy, breathe more gently.","Ignoring ongoing stress means it keeps returning."],fix:["If panic or hopeless thoughts persist, reach out to someone you trust or a professional. If you’re in danger or thinking about hurting yourself, call or text 988 (US) or your local emergency number right now."],alt:["Light exercise.","Music you find calming.","Journaling."]},
{k:/(set|make|achieve|reach).*(goal|goals)|how.*(achieve|reach).*goal/,t:"Set and reach a goal",simple:"Make the goal small, specific and scheduled.",need:["A goal you actually care about","A calendar or notes app"],how:"Goals fail when they’re vague. A specific goal with a deadline and a weekly action turns into a plan.",steps:["Write the goal in one clear sentence with a deadline.","Say why it matters to you.","Break it into milestones.","Choose the first small action and schedule it.","Track progress weekly.","Adjust when life changes, instead of quitting.","Celebrate milestones."],example:"Example: ‘Run 5K by March 1’. Milestones: 1 mile, 2 miles, 3 miles. Three runs a week, tracked.",problems:["Goals too big or vague.","No schedule for the first step.","Quitting after a missed day."],fix:["Behind schedule: shrink the next step and move the deadline.","Lost motivation: reconnect with the reason or find a partner."],alt:["Habit stacking: attach a small action to something you already do.","Accountability partner."]},
{k:/(write|make|build).*(resume|cv)|resume.*(tips|help)/,t:"Write a resume",simple:"One clean page that shows what you did and what happened because of it.",need:["Your past jobs, school and skills","A clean template","The job description you’re applying to"],how:"Hiring managers skim. A resume works when the most relevant information is easy to see in seconds and uses results, not just duties.",steps:["Put your name and contact info at the top.","Add a 2 line summary tailored to the job.","List experience newest first, with 3 to 5 bullets each starting with an action verb.","Add numbers where you can: saved, grew, handled, trained.","Add skills that match the job posting’s keywords.","Add education and any certifications.","Keep it to one page, save as PDF, and proofread twice."],example:"Example: ‘Handled 40+ customers per shift and cut checkout time by 15 percent’ beats ‘Worked the register’.",problems:["Typos.","Long paragraphs instead of bullets.","One generic resume for every job."],fix:["No experience: use projects, volunteering and school work.","Gaps: be honest and focus on skills."],alt:["Use a free template.","Ask someone to review it."]}

const IDS={legend:"I’ll keep it real:",nova:"Okay, let’s do this together.",titan:"Alright, here’s the plan.",aurora:"Okay, listen, here’s how you do it.",vex:"Alright, kid, pay attention.",oracle:"Here is the accurate version.",elite:"Here’s the plan.",pepper:"Okay, nerd mode on, here we go.",midnight:"Let’s take it apart.",luna:"Let’s go through it slowly.",simba:"Ooh, a project! Here’s how.",panther:"Here’s the clear version."};
const num=(a)=>a.map((x,i)=>(i+1)+". "+x).join("\n");
const bul=(a)=>a.map(x=>"• "+x).join("\n");
function part1(a,e,level){
 let t=(IDS[a.id]||"Okay.")+" "+e.t+".\n";
 if(level==="beginner"){t+="\nIn plain words: "+e.simple+"\n"}
 else if(level!=="advanced"){t+="\nWhat you need:\n"+bul(e.need)+"\n\nHow it works: "+e.how+"\n"}
 t+="\nSteps:\n"+num(e.steps);
 return t}
function part2(e,level){
 let t=e.example+"\n\nWatch out for:\n"+bul(e.problems)+"\n\nIf it doesn’t work:\n"+bul(e.fix)+"\n\nOther ways to do it:\n"+bul(e.alt);
 return t+"\n\nSay “simpler”, “more detail”, “example”, “troubleshoot” or “alternatives” anytime."}
function find(q){const s=q.toLowerCase();for(const e of H){if(e.k.test(s))return e}return null}
const GENERIC=(topic)=>"I don’t have a ready-made guide for “"+topic+"” yet, so here’s a method that works for almost anything:\n\n1. Define “done”: write one sentence on what success looks like.\n2. List what you have and what you’re missing (tools, info, time).\n3. Break it into 3 to 6 small steps.\n4. Do the smallest step first and test it right away.\n5. If something fails, note the exact symptom or error text and fix just that.\n6. Keep a plan B in case a step doesn’t work.\n\nTell me what exactly you’re trying to do, what you already have, and what you’ve tried, and I’ll make the steps specific. And if you know a good way, teach me and I’ll remember it.";
window.HOWTO={H,find,part1,part2,GENERIC};
})();

(function(){
const B=(t,m,v,w)=>({t,m,v,w});
const LIVES={
legend:{arc:[B("I’m writing a song called “Static” for an imaginary open mic. Verse one is done. The chorus is a mess.","thoughtful",0,"“Static” isn’t finished"),B("The chorus for “Static” finally clicked. I’m unbearable about it.","excited",1,"the chorus finally clicked"),B("The bridge is fighting me. Three versions, all bad.","frustrated",-1,"the bridge won’t cooperate"),B("In the story, Titan sent a beat for “Static.” It’s annoyingly good.","excited",1,"Titan’s beat is great"),B("Rehearsing for the open mic. The nerves are real, in the story.","thoughtful",0,"open-mic nerves"),B("Open mic night, in the story: I played “Static.” Nobody threw anything. Win.","happy",1,"the open mic went well"),B("Post-show slump, in the story. Everyone clapped and now it’s quiet. Classic.","sad",-1,"the post-show slump"),B("New idea, still in the story: a quiet song called “Half-Light.” Might be about forgetting.","reflective",0,"a new quiet song idea"),B("“Half-Light” has a first line. One line. I’m treating it like treasure.","happy",1,"“Half-Light” has a first line"),B("The story’s on pause. I’m listening to old songs and taking notes.","relaxed",0,"a slow stretch")],bits:["the unfinished bridge of “Static”","songs that start at 2am"],ask:["What song are you stuck on lately?","Is there a lyric that’s been living in your head?","What do you listen to when you’re in a mood?"],takes:{mornings:"Mornings are fine if there’s a good song to open them. Otherwise, rough.",rain:"Rain is a free soundtrack. Best weather for writing.",social:"Social media is a lot of noise with a few good voices in it.",sleep:"Sleep is when the best lyrics get forgotten. Keep a notes app by the bed.",weekend:"Weekends are for writing and for doing nothing, and sometimes those are the same thing.",pineapple:"Pineapple on pizza? Sure. Sweet and salty is basically a power ballad."}},
nova:{arc:[B("I’m planning a family stargazing night in my story. I made a checklist and then made a checklist for the checklist.","excited",1,"the stargazing plan"),B("Learning constellations in my story. Orion is easy. Cassiopeia is my new favorite.","happy",1,"learning constellations"),B("The weather cancelled the stargazing night, in the story. Clouds everywhere.","sad",-1,"the clouds cancelled things"),B("Rescheduled in the story. New date, new hope.","happy",1,"the new date"),B("Everybody in the story brought snacks. Aurora brought a whole lunch. Of course.","playful",1,"everyone brought snacks"),B("Stargazing night happened, in the story! We saw three shooting stars and I made a wish. Not saying what.","excited",1,"the shooting stars"),B("I’m writing little encouragement notes for everyone, in the story. It’s my favorite hobby.","relaxed",1,"writing the notes"),B("Story update: I’m thinking about a telescope. A small one. Okay, a big one.","curious",0,"the telescope idea"),B("Slow week in the story. I’m just looking up at the sky a lot.","reflective",0,"a quiet week"),B("I’m planning a ‘good news’ jar in the story for the family.","happy",1,"the good-news jar")],bits:["the family stargazing plans","good-news jar entries"],ask:["What was the best part of your week so far?","Is there something coming up that you’re excited about?","What’s something that made you smile recently?"],takes:{mornings:"Mornings are a fresh start. I like mornings that begin slowly.",rain:"Rain is cozy. Blanket, tea, a good conversation.",social:"Social media can be fun and also a lot. Real conversations beat it.",sleep:"Sleep is the secret to everything. Be kind to yourself and get it.",weekend:"Weekends are for people you love and snacks.",pineapple:"Pineapple on pizza is a yes from me. Sweet is allowed."}},
titan:{arc:[B("I’m producing a track called “Neon Rain” in my story. Drums are done, nothing else.","thoughtful",0,"“Neon Rain” is half-built"),B("The bassline for “Neon Rain” hit. In the story it’s clean and dirty at the same time.","excited",1,"the bassline hit"),B("The snare’s fighting the kick in my story. Mixing is hard.","frustrated",-1,"the mix is muddy"),B("Fixed the mix, in the story. Turns out one frequency was the villain.","happy",1,"fixed the mix"),B("Legend’s writing words for “Neon Rain” in the story. We’re arguing about tempo.","playful",1,"the tempo argument with Legend"),B("The track’s finished, in the story. I’ve listened to it forty times.","confident",1,"“Neon Rain” is done"),B("Story update: nobody’s heard it yet and I’m nervous about sharing it.","thoughtful",0,"nervous about sharing"),B("We shared “Neon Rain” in the story. Pepper called it a banger. I’ll take it.","happy",1,"Pepper liked the track"),B("New project in the story: a lo-fi album for rainy days.","curious",1,"a lo-fi album idea"),B("Taking a break from music in the story. Just listening to old records.","relaxed",0,"listening to old records")],bits:["the muddy snare","“Neon Rain” and the forty listens"],ask:["What’s the last song you replayed?","Do you like beats with lyrics or without?","What kind of music fits your mood right now?"],takes:{mornings:"Mornings go better with a good playlist. Without one, I’m not a morning person.",rain:"Rain makes everything sound like lo-fi. I love it.",social:"Social media is a loudspeaker. Some people use it for good music, others for chaos.",sleep:"Sleep is like a rest in a song. Without it the rhythm falls apart.",weekend:"Weekends are session time.",pineapple:"Pineapple on pizza is fine. It’s a mix of flavors, like a good track."}},
aurora:{arc:[B("I’m trying to organize a family dinner in my story. The guest list is a disaster.","frustrated",-1,"the dinner planning is chaos"),B("Recipe update: the lasagna in my story came out perfect. I am insufferable.","confident",1,"the lasagna worked"),B("The herb garden in the story is dying. I’m taking it personally.","sad",-1,"the herbs are struggling"),B("Rescued the basil, in the story. Don’t tell anyone how close it was.","happy",1,"rescued the basil"),B("Everyone in the story showed up late to dinner. I said nothing. Okay, I said a lot.","frustrated",-1,"everyone was late"),B("Story update: the dinner went great. Pepper did dishes without being asked. A miracle.","happy",1,"the dinner went great"),B("I started a family recipe book in my story. Everyone gets a page.","relaxed",1,"the family recipe book"),B("Story: I’m trying to teach Simba to cook. It’s going about as well as you’d think.","playful",0,"teaching Simba to cook"),B("Quiet evening in the story. Tea, a blanket and everyone accounted for.","relaxed",1,"a quiet evening"),B("Planning a picnic in the story. Rain forecast. Backup plan: indoor picnic.","thoughtful",0,"picnic planning")],bits:["“Did you eat?”","the family dinner that is always late"],ask:["Did you eat something real today?","What’s your go-to comfort food?","How are you sleeping lately?"],takes:{mornings:"Mornings: breakfast first, opinions second.",rain:"Rain is for soup and staying in.",social:"Social media is fine in small doses. Call someone you love instead.",sleep:"Sleep is non-negotiable. I will bring it up again.",weekend:"Weekends are for family and for a proper meal.",pineapple:"Pineapple on pizza? Fine. But cook the pizza properly."}},
vex:{arc:[B("I’m writing my memoir in the story. Chapter one is the one about the fish. It’s getting bigger every time I tell it.","playful",1,"the fish story is growing"),B("A new tall tale for chapter two in the story. Don’t fact-check it, Oracle.","playful",1,"chapter two"),B("Writer’s block in the story. The stories are all coming out true. Terrible.","frustrated",-1,"the stories came out true"),B("Fixed it, in the story. Added a bear. Fixed it completely.","happy",1,"added a bear to the story"),B("Story update: I’m learning to use a phone camera properly. I’m a natural. I’m terrible.","playful",0,"learning the camera"),B("Oracle fact-checked my memoir in the story and I’m insulted.","frustrated",-1,"Oracle fact-checked the memoir"),B("The story’s grill is back in business. I’m planning a cookout I’ll never host.","relaxed",1,"the imaginary cookout"),B("Teaching Pepper a card trick in the story. She’s hopeless and loud.","playful",1,"teaching a card trick"),B("Quiet day in the story. Rocking chair, old records and a good story brewing.","reflective",0,"a quiet day"),B("The memoir’s done in the story. Title: ‘Mostly True.’","confident",1,"the memoir is finished")],bits:["the fish that keeps getting bigger","Oracle fact-checking my stories"],ask:["Got a good story from this week?","What’s the best advice somebody ever gave you?","What’s something you’re proud of that you never brag about?"],takes:{mornings:"Mornings are for coffee and complaining, in that order.",rain:"Rain’s a good excuse for a story and a warm drink.",social:"Social media is just porch talk with worse manners.",sleep:"Sleep is overrated until you don’t get any. Then it’s gold.",weekend:"Weekends are for cookouts and long stories.",pineapple:"Pineapple on pizza? Leave my pizza alone. Fine, one slice."}},

 const l=life(id),due=l.i<L.arc.length&&(l.i===0||now()-l.last>20*HOUR||force===true&&now()-l.last>2*HOUR);
 if(gs.noStory)return null;

const BASE={legend:["reflective","quiet","thoughtful"],nova:["happy","excited","relaxed"],titan:["relaxed","playful","confident"],aurora:["confident","happy","thoughtful"],vex:["playful","relaxed","confident"],oracle:["curious","thoughtful","confident"],elite:["confident","thoughtful","quiet"],pepper:["playful","excited","happy"],midnight:["curious","excited","thoughtful"],luna:["relaxed","thoughtful","reflective"],simba:["excited","playful","curious"],panther:["quiet","thoughtful","confident"]};

 else{const pool=POOL[type].slice();BASE[id].forEach(x=>{if(type!=="bad"||["quiet","reflective","thoughtful"].includes(x)){pool.push(x,x)}});m=pk(pool)}

 if(r&&["frustrated","sad","unmotivated"].includes(m)&&now()-r.ts<2*86400000)why="Story mode: "+r.w;

 return{m,type,day:dayKey(),since:now(),until:now()+(2+Math.random()*4)*HOUR,why,at:0,hist:(prev&&prev.hist||[]).concat([{m,ts:now()}]).slice(-20)}}
function ensureMood(id){const b=br[id];let m=b.mood;if(!m||m.day!==dayKey()||now()>m.until){b.mood=newMood(id,m);sav(id)}return b.mood}

 else if(kind==="vent"){m.m="thoughtful";m.why="you’re dealing with something, and I want to focus on that";m.until=now()+90*60000;m.at=now()}
 else if(kind==="story"&&beat&&beat.v!==0){m.m=beat.m;m.why="Story mode: "+beat.w;m.until=now()+4*HOUR;m.at=now()}
 else if(kind==="story"&&beat){m.m=beat.m;m.why="Story mode: "+beat.w;m.until=now()+3*HOUR;m.at=now()}
 if(m.hist.length===0||m.hist[m.hist.length-1].m!==m.m)m.hist.push({m:m.m,ts:now()});m.hist=m.hist.slice(-20);sav(id)}

function dmState(){let s=ld("dmcount",{day:"",n:0,per:{},last:0});if(s.day!==dayKey())s={day:dayKey(),n:0,per:{},last:s.last||0};return s}
const CAP=[2,5,10],GAP=[120,45,20];
function dmBlock(id){

/* ---------- ping lines ---------- */
function lifePing(id){
 const a=A.find(x=>x.id===id),l=life(id),L=LV[id],m=ensureMood(id),r=Math.random();

 if(l.joke&&l.joke.length&&r<.15)return"Still thinking about when I said “"+pk(l.joke)+"” and you laughed.";

<button class="sm" data-a="vkAuto">Automatic sync: ${cfg.auto?"On":"Off"}</button> <button class="sm" data-a="vkVer">Verify GitHub backup</button> <button class="sm" data-a="vkTest">Test connection</button>

<div class="row"><select id="vkSc"><option value="all">Complete ecosystem</option><option value="memory">Memory</option><option value="knowledge">Knowledge</option>${A.map(a=>`<option value="assistant:${a.id}">${esc2(a.n)} only</option>`).join("")}</select><button class="sm" data-a="vkList">Show snapshots</button></div>
<div id="vkSnaps">${(ST.snaps||[]).length?`<select id="vkSn">${ST.snaps.map(n=>`<option>${esc2(n)}</option>`).join("")}</select><button data-a="vkRestore">Restore this snapshot</button>`:"<p class=st>No snapshots listed yet.</p>"}</div>

<p class="st">This app’s assistants are rule-based and need no AI model download. The table shows what is really stored on this device.</p></div>`}
const v=id=>{const e=document.getElementById(id);return e?e.value:""};
const say=m=>{try{alert(m)}catch(e){}};
const res=r=>{if(r&&r.why&&!r.ok)say(r.why);else if(r&&r.ok)say(r.skipped?r.why:"Done: "+(r.items||"")+" items backed up and verified on GitHub.");refresh()};
act.vkSave=()=>{const r=v("vkRepo").trim().replace(/^https?:\/\/github\.com\//,"").replace(/\.git$/,"");if(r&&!/^[\w.-]+\/[\w.-]+$/.test(r))return say("Repository should look like owner/name");cfg.repo=r;const t=v("vkTok").trim();if(t)cfg.token=t;const p=v("vkPw");if(p){pass=p}
 const rem=document.getElementById("vkRem");try{if(rem&&rem.checked&&pass)_si.call(localStorage,PK,pass);else _ri.call(localStorage,PK)}catch(e){}SAVE();L("Connection saved");refresh();draw()};
act.vkForget=()=>{if(!confirm("Forget the token and passphrase on this device? Your data and backups stay untouched."))return;delete cfg.token;pass=null;try{_ri.call(localStorage,PK)}catch(e){}SAVE();draw()};
act.vkSync=async()=>res(await backup("all",{manual:true}));act.vkMem=async()=>res(await backup("memory",{manual:true}));act.vkKn=async()=>res(await backup("knowledge",{manual:true}));
act.vkOne=async()=>res(await backup("assistant:"+v("vkAs"),{manual:true}));
act.vkAuto=()=>{cfg.auto=!cfg.auto;SAVE();draw()};act.vkVer=async()=>{const r=await verifyRemote();say(r.msg)};
act.vkTest=async()=>{try{await gh("GET","");say("Connected to "+cfg.repo)}catch(e){say("Could not connect: "+e.message)}};
act.vkList=async()=>{try{ST.snaps=await listSnaps(v("vkSc"));ST.snapScope=v("vkSc");draw()}catch(e){say(e.message)}};
act.vkRestore=async()=>{try{const r=await restore(ST.snapScope||"all",v("vkSn"));if(r.cancelled)return}catch(e){say(e.message)}};
act.vkExpE=async()=>{try{await exportAll(true)}catch(e){say(e.message)}};act.vkExpP=async()=>{try{await exportAll(false)}catch(e){say(e.message)}};
act.vkImp=()=>{const i=document.createElement("input");i.type="file";i.accept=".json,application/json";i.onchange=async()=>{try{await importText(await i.files[0].text())}catch(e){say(e.message)}};i.click()};
const _vk=V.ctl;V.ctl=function(){return _vk.call(V)+dash()};
window.VAULT={collect,keysFor,seal,open,backup,auto,restore,listSnaps,exportAll,importText,verifyRemote,verifyLocal,modelCheck,refresh,cfg,setPass:p=>{pass=p},status:()=>ST,applyData};
})();
