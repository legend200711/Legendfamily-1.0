debugger", "Printing values is a quick way to see what code is doing. A debugger lets you pause code, step line by line and look at every variable. Learn both, and remove leftover prints before sharing code.", "titan"], ["u-code-22", "code", "Sorting algorithms", "Simple sorts like bubble sort are easy to understand but slow on big lists. Built-in sort functions use faster methods, around n log n. In real projects use the built-in sort unless you have a special reason.", "titan"], ["u-code-23", "code", "Stack and queue", "A stack is last in, first out, like a pile of plates, and the undo feature in many apps uses one. A queue is first in, first out, like a line at a store, and print jobs use one.", "titan"], ["u-code-24", "code", "Web accessibility", "Make pages work for everyone. Add alt text to images, use enough color contrast, make everything usable with a keyboard and label form fields. These steps also help search engines and people on small screens.", "titan"], ["u-code-25", "code", "Responsive design", "Add the viewport meta tag, use flexible layouts like flexbox and grid, and test on a phone-size screen. Design for small screens first, then add rules for bigger ones with media queries.", "titan"], ["u-code-26", "code", "Open source licenses", "A license tells others what they can do with code. The MIT license is short and very permissive. The GPL requires derived work to stay open too. Without any license, others generally cannot legally reuse your code.", "titan"], ["u-code-27", "code", "Learning to code", "Build small projects you care about, like a quiz or a budget tracker, instead of only watching tutorials. Read error messages, search for solutions and keep going. Consistent short practice beats occasional long sessions.", "titan"], ["u-code-28", "code", "SQL basics", "SQL talks to databases. SELECT reads rows, INSERT adds them, UPDATE changes them and DELETE removes them. A WHERE clause filters which rows. Always back up before running a command that changes or deletes data.", "titan"], ["u-code-29", "code", "Refactoring", "Refactoring means improving code's structure without changing what it does. Rename confusing things, break up long functions and remove duplicates. Do it in small steps and run tests after each one.", "titan"], ["u-elec-18", "elec", "Using a multimeter", "Set the dial to the right function. Measure voltage in parallel across a part, current in series by breaking the circuit and resistance with power off. Continuity mode beeps when a path is complete, which is perfect for checking wires and fuses.", "pepper"], ["u-elec-19", "elec", "Reading a datasheet", "A datasheet lists a part's limits and pinout. Check the absolute maximum ratings, the recommended operating range and the pin diagram. Never exceed the maximum voltage or current or the part may fail.", "pepper"], ["u-elec-20", "elec", "Battery types", "Alkaline batteries are single-use. NiMH rechargeables are safe and reusable. Lithium-ion packs hold lots of energy and need a proper charger and protection circuit. Never mix old and new, or different types, in one device.", "pepper"], ["u-elec-21", "elec", "Motors and servos", "A DC motor spins when powered and needs a driver circuit to run from a small board. A servo moves to a set angle and is great for robot arms. Motors can pull a lot of current, so give them a separate power supply.", "pepper"], ["u-elec-22", "elec", "Common sensors", "A photoresistor changes with light, a thermistor with temperature and an ultrasonic sensor measures distance using sound. Many sensors output a voltage or a digital signal that a microcontroller can read.", "pepper"], ["u-elec-23", "elec", "Raspberry Pi versus Arduino", "A Raspberry Pi is a small full computer that runs Linux, good for media and networking projects. An Arduino is a simple microcontroller that runs one program, great for sensors and quick real-time control.", "pepper"], ["u-elec-24", "elec", "Charging cables", "A cable can limit charging speed or fail inside. If a device charges slowly, try another cable and charger. Cheap unrated cables can overheat, so use ones from trusted brands for fast charging.", "pepper"], ["u-elec-25", "elec", "Phone battery care", "Heat is the biggest enemy of phone batteries. Avoid leaving a phone in a hot car, and do not charge it under a pillow. Keeping charge between about 20 and 80 percent when you can slows long-term wear.", "pepper"], ["u-elec-26", "elec", "Recycling electronics", "Never throw batteries or electronics in the trash. They hold toxic metals, and lithium batteries can start fires. Take them to a recycling drop-off or store that accepts e-waste.", "pepper"], ["u-elec-27", "elec", "Static electricity", "A static spark you cannot feel can still damage chips. Touch a bare metal part of the case before handling components, and avoid working on carpet. An anti-static wrist strap is a cheap safeguard.", "pepper"], ["u-wrest-21", "wrest", "Hell in a Cell 1998", "At King of the Ring on June 28, 1998, Mick Foley's character Mankind was thrown off the top of the Hell in a Cell cage by The Undertaker. It is one of the most famous and talked about moments in wrestling.", "luna"], ["u-wrest-22", "wrest", "Undertaker's streak", "The Undertaker went 21 and 0 at WrestleMania, a streak that became a legend. It ended at WrestleMania 30 in 2014 when Brock Lesnar beat him, which stunned the crowd.", "luna"], ["u-wrest-23", "wrest", "Montreal Screwjob", "On November 9, 1997 at Survivor Series, the finish of Bret Hart's match with Shawn Michaels was changed without Hart's knowledge. The real-life drama, called the Montreal Screwjob, is one of the most discussed events in wrestling.", "luna"], ["u-wrest-24", "wrest", "Austin 3:16", "After beating Jake Roberts at the 1996 King of the Ring, Steve Austin delivered his famous Austin 3:16 promo. It launched his rise as Stone Cold, a star who became the face of the Attitude Era.", "luna"], ["u-wrest-25", "wrest", "Referees", "Referees count pins, enforce rules, and pass signals between wrestlers and the production team. They are in the ring for safety and storytelling. A referee being knocked down is a classic way for a heel to cheat.", "luna"], ["u-wrest-26", "wrest", "The count of three", "A pin counts if the shoulders are down for three seconds. A wrestler can kick out before three, and the referee must count. A match can also end by submission, disqualification or count-out when someone stays outside the ring too long.", "luna"], ["u-wrest-27", "wrest", "Major promotions", "Big pro wrestling companies include WWE and AEW in the US, New Japan Pro-Wrestling in Japan and AAA and CMLL in Mexico. Many smaller promotions around the world develop new talent and unique styles.", "luna"], ["u-wrest-28", "wrest", "Don't try this at home", "Pro wrestling moves are planned and practiced with trained partners in rings built to absorb falls. Doing them on your own, on hard floors or with friends can cause serious injuries. Train only at a good wrestling school.", "luna"], ["u-wrest-29", "wrest", "Managers and valets", "Managers talk for a wrestler who might not be a great speaker and add to the story. Valets accompany wrestlers to the ring, and both can interfere to help their client win.", "luna"], ["u-wrest-30", "wrest", "Why heels matter", "Great heels make the crowd care. By cheating and taunting they give heroes something to overcome. A good rivalry needs a believable bad guy, and many fans love to hate them.", "luna"], ["u-vg-20", "vg", "How games are made", "Developers move from concept to a rough prototype, then full production, then testing and launch. Programmers, artists, designers, writers, composers and testers all work together. Many games take years.", "simba"], ["u-vg-21", "vg", "Indie game success", "Some small teams have hit big. Undertale from 2015 came largely from one developer, Toby Fox, and Stardew Valley from 2016 was made almost entirely by Eric Barone. Good ideas and polish can beat large budgets.", "simba"], ["u-vg-22", "vg", "Nintendo Switch", "Nintendo launched the Switch on March 3, 2017. It works as a home console that docks to a TV and as a handheld, and its hybrid idea made it hugely popular.", "simba"], ["u-vg-23", "vg", "Game ratings", "The ESRB rates games in the US as E for Everyone, E10+, T for Teen, M for Mature and AO for Adults Only. Ratings come with content descriptors. Parents can use them along with console parental controls.", "simba"], ["u-vg-24", "vg", "Streaming and Twitch", "Twitch launched in 2011 and made live game streaming mainstream. Streamers play, chat and build communities. Many viewers learn strategies, find new games or just enjoy the company.", "simba"], ["u-vg-25", "vg", "Anti-cheat and fair play", "Online games use anti-cheat software to keep matches fair. Cheating ruins games for others and can get you banned for good. Report cheaters in game rather than confronting them.", "simba"], ["u-vg-26", "vg", "Healthy gaming balance", "Games are great fun, and a healthy balance matters. Keep sleep, school or work, exercise and friends in your routine. If gaming is hurting your mood, grades or relationships, take a break or talk to someone.", "simba"], ["u-vg-27", "vg", "Controller drift", "Drift is when a thumbstick moves on its own because of wear. Cleaning with compressed air or isopropyl alcohol may help, and many controllers can be repaired or replaced. Check your warranty first.", "simba"], ["u-vg-28", "vg", "Video game music", "Composers like Koji Kondo, who wrote the music for Super Mario Bros. and Zelda, and Nobuo Uematsu of Final Fantasy made themes that millions can hum. Great game music supports the mood and makes moments memorable.", "simba"], ["u-vg-29", "vg", "PC versus console", "Consoles are simple, affordable and made for playing on a couch. PCs are flexible, upgradeable and can run mods, but cost more and need more setup. Many games now come out for both.", "simba"], ["u-retro-21", "retro", "Game and Watch", "Nintendo's Game and Watch handhelds started in 1980. Each had one game on an LCD screen, and Donkey Kong in 1982 had two screens. They paved the way for the Game Boy.", "midnight"], ["u-retro-22", "retro", "Commodore 64", "The Commodore 64, released in 1982, is among the best-selling single computer models of all time. Its sound chip and library of games made it a hit with home users and game players.", "midnight"], ["u-retro-23", "retro", "ZX Spectrum", "The ZX Spectrum, launched in 1982 by Sinclair in the UK, was a cheap home computer with a rubber keyboard. It sparked a huge bedroom coding scene and a big library of British games.", "midnight"], ["u-retro-24", "retro", "TurboGrafx-16", "NEC's PC Engine launched in Japan in 1987 and was called TurboGrafx-16 in North America. It had a small card format and strong arcade ports, and developed a loyal following despite sales struggles in the US.", "midnight"], ["u-retro-25", "retro", "Game Boy Color", "The Game Boy Color arrived in 1998 with a color screen, and it played the older Game Boy games too. It kept the line alive and was the home of Pokemon Gold and Silver.", "midnight"], ["u-retro-26", "retro", "Virtual Boy", "Nintendo's Virtual Boy launched in 1995 with a red-and-black stereoscopic display. It was uncomfortable to play and flopped, and Nintendo ended it within a year, making it a rare collector's item.", "midnight"], ["u-retro-27", "retro", "Mini consoles", "Nintendo released the NES Classic in 2016, a small plug-and-play console with 30 built-in games, and other companies followed with their own mini systems. They offer retro games in an easy form, though lists of games are fixed.", "midnight"], ["u-retro-28", "retro", "Arcade cabinets", "Classic arcade cabinets use CRT screens and a standard wiring layout called JAMMA. Restoring one means cleaning contacts, checking the monitor and being careful, since CRTs can hold a dangerous charge even when unplugged.", "midnight"], ["u-retro-29", "retro", "Why retro still matters", "Old games were built with tight limits, so designers focused on clear rules, tough challenge and strong art. Many fans love the simplicity, the music and the memories, and new generations discover them through re-releases.", "midnight"], ["u-retro-30", "retro", "Save states", "Emulators can save the exact moment of a game, a feature called a save state. It lets you retry hard parts, though it differs from the game's own saving. Keep battery saves backed up too.", "midnight"], ["u-prod-17", "prod", "Taming your inbox", "Check email at set times instead of all day. Unsubscribe from what you do not read, use folders or labels sparingly and aim for quick replies or deleting. A short reply now beats a long pile later.", "legend"], ["u-prod-18", "prod", "Better meetings", "Meet only when needed, share an agenda and set an end time. End with who does what by when. If a message can do the job, skip the meeting.", "legend"], ["u-prod-19", "prod", "Digital minimalism", "Keep the apps that help you and cut the ones that just eat time. Turn off non-essential notifications, move distracting apps off your home screen and set screen time limits for yourself.", "legend"], ["u-prod-20", "prod", "Note-taking", "Take notes in your own words, because rewriting forces understanding. Link related notes together, review them often and keep them where you can find them. A simple system you use beats a perfect one you ignore.", "legend"], ["u-prod-21", "prod", "Habit trackers", "A habit tracker is a simple chart where you mark each day you do a habit. The chain of marks motivates you. If you miss a day, never miss twice in a row.", "legend"], ["u-prod-22", "prod", "Morning routines", "A morning routine does not need to be fancy. Water, light movement, a quick plan for the day and no phone for the first few minutes can help. Choose a routine you can repeat on tired days.", "legend"], ["u-prod-23", "prod", "Overcommitting", "Saying yes to everything leaves little time for what matters. Check your calendar before you agree, leave space between tasks and expect things to take longer than planned.", "legend"], ["u-prod-24", "prod", "Deliberate practice", "To get better at a skill, practice just beyond your comfort zone, get feedback and repeat. Mindless repetition builds speed but not skill. Focused sessions of 30 to 60 minutes work well.", "legend"], ["u-prod-25", "prod", "Your workspace", "A clear desk, good light and a comfortable chair help you focus. Keep what you need within reach and the rest away. Put your phone out of sight while you do deep work.", "legend"], ["u-prod-26", "prod", "Delegating", "Delegating means handing a task to someone else with clear instructions. Explain what done looks like, give them what they need and check in without hovering. It frees your time for what only you can do.", "legend"], ["u-money-20", "money", "Budgeting apps", "A budget tracker can be a notebook, a spreadsheet or an app. What matters is looking at where your money goes each week. Review for a few minutes, then adjust the next week.", "elite"], ["u-money-21", "money", "Student loans", "Student loans must be repaid with interest. Know your interest rate, your servicer and your payment options. Paying extra toward the highest-rate loan saves money, and if you struggle, contact the servicer early about options.", "elite"], ["u-money-22", "money", "Checking your credit report", "In the US you can get free credit reports from the official site AnnualCreditReport.com. Check for accounts you do not recognize, wrong information and late marks. Dispute errors in writing with the credit bureau.", "elite"], ["u-money-23", "money", "Credit freeze", "A credit freeze stops new accounts from being opened in your name and is free in the US. If your information leaks or you worry about identity theft, you can freeze your credit at each bureau and unfreeze when you need credit.", "elite"], ["u-money-24", "money", "Buying a car", "Look at the total cost, not just the monthly payment. Include insurance, fuel and repairs. Very long loans cost more in interest, and a new car loses much of its value in the first years. Get your own loan quote before visiting a dealer.", "elite"], ["u-money-25", "money", "Dollar-cost averaging", "Dollar-cost averaging means investing a fixed amount on a regular schedule no matter what the market is doing. It avoids trying to time the market and builds the habit of investing steadily.", "elite"], ["u-money-26", "money", "Time horizon", "Money you need soon belongs in safe places, like savings. Money you will not need for 10 years or more can handle ups and downs in the market. Matching risk to when you need the money is the key.", "elite"], ["u-money-27", "money", "Phishing and fraud", "Scammers send fake texts, emails and calls to steal logins and money. Do not click unexpected links, never share one-time codes, and contact the company using a number from its official site. Real banks will not ask for your password.", "elite"], ["u-money-28", "money", "Subscription audit", "Once a month, scan your bank statements for subscriptions you forgot. Cancel the ones you do not use. Small monthly charges add up to hundreds of dollars a year.", "elite"], ["u-money-29", "money", "Frugal wins", "Cooking at home, comparing prices, waiting before big buys and using the library or free options all add up. The biggest savings usually come from housing, transportation and food, not from skipping small treats.", "elite"], ["u-sci-23", "sci", "Acids and bases", "The pH scale runs from 0 to 14. Seven is neutral like pure water, below 7 is acidic like lemon juice and above 7 is basic like soap. Each step is ten times stronger or weaker than the next.", "nova"], ["u-sci-24", "sci", "Conservation of mass", "In a chemical reaction atoms are rearranged, not created or destroyed, so the total mass stays the same. That is why chemical equations must balance, with the same atoms on both sides.", "nova" ime in nature", "Time outdoors, even a short walk in a park, can lower stress and lift mood. Look up, notice trees or water, and leave your phone in your pocket for a few minutes.", "aurora"], ["u-auto-1", "auto", "Checking engine oil", "With the engine off and the car on level ground, pull the dipstick, wipe it, reinsert it and pull again. The oil should sit between the two marks. Dark oil is normal, but milky or gritty oil needs a mechanic. Top up with the grade in your owner's manual.", "panther"], ["u-auto-2", "auto", "Check engine light", "A steady check engine light means the computer found a problem, often minor like a loose gas cap. A flashing light means a serious misfire, so reduce speed and get it checked soon. A cheap code reader can show the trouble code.", "panther"], ["u-auto-3", "auto", "Brake fluid and pads", "Brake pads wear down and should be replaced when thin. Brake fluid absorbs moisture over time, so many makers advise changing it every two to three years. A soft pedal or a pull to one side deserves a quick inspection.", "panther"], ["u-auto-4", "auto", "Tire tread", "Tires need tread to grip wet roads. A quick test is the penny test: put a penny in the groove with Lincoln's head down, and if you can see all of his head the tread is too low. Rotate tires about every 5,000 to 7,500 miles.", "panther"], ["u-auto-5", "auto", "Battery care", "Corrosion on terminals looks like white or blue crust and can be cleaned with a baking soda and water mix. Short trips and cold weather drain batteries. If a car clicks but will not start, the battery is a likely cause.", "panther"], ["u-auto-6", "auto", "Coolant and overheating", "If the temperature gauge climbs, turn off the air conditioning, turn on the heater to pull heat from the engine and pull over safely. Never open a hot radiator cap because scalding coolant can spray out. Let it cool first.", "panther"], ["u-auto-7", "auto", "Winter driving", "In snow and ice, slow down and leave extra space for stopping. Brake gently, steer smoothly and keep a blanket, flashlight, snacks and a phone charger in the car. Clear snow from the roof and all windows before driving.", "panther"], ["u-auto-8", "auto", "Stopping distance", "Stopping takes time to react plus time to brake, and both grow quickly with speed. At 60 miles per hour a car travels about 88 feet every second. Keep at least a three-second gap behind the car in front and more in rain.", "panther"], ["u-auto-9", "auto", "Buying a used car", "Check the vehicle history report, look for rust and uneven panel gaps, test drive on different roads and have an independent mechanic inspect it. Be wary of deals that seem too good, and never pay with gift cards or wire money to strangers.", "panther"], ["u-auto-10", "auto", "Hybrid and electric cars", "Hybrids pair a gas engine with a battery motor to save fuel. Electric cars run only on a battery, charge at home or at public stations and have fewer moving parts. Range drops in very cold weather.", "panther"], ["u-auto-11", "auto", "Car maintenance schedule", "Follow your owner's manual for oil changes, tire rotation, air filters, brake checks and fluid changes. A simple log in your phone helps you keep up. Small regular maintenance costs far less than big repairs.", "panther"], ["u-auto-12", "auto", "Roadside emergency kit", "Keep jumper cables, a spare tire with a jack, a tire pressure gauge, a flashlight, reflective triangles and a first aid kit in your car. Know where your spare and tools are before you need them.", "panther"]];

const EMR=`aurora|Depression: types and signs|Depression includes major depression, persistent low-grade depression and seasonal patterns. Signs include low mood or emptiness, lost interest, changes in sleep and appetite, fatigue, guilt and trouble concentrating. If it lasts two weeks or more, see a clinician. It is treatable with therapy, medication or both.
aurora|Anxiety disorders|Anxiety disorders include generalized anxiety (constant worry), social anxiety, panic disorder and phobias. Signs include restlessness, a racing heart, muscle tension and avoiding feared situations. Therapy such as CBT works well, and some people also benefit from medication. A clinician can assess what fits.
aurora|Panic attacks|A panic attack is a sudden surge of fear with a pounding heart, short breath and dizziness that peaks within minutes. It feels dangerous but passes. Slow breathing, naming what is happening and grounding with the five senses help. Get chest pain checked to be safe.
aurora|Trauma and PTSD|Trauma can leave the nervous system stuck on alert. PTSD may involve flashbacks, nightmares, avoidance, jumpiness and harsh beliefs after a frightening event. Trauma-focused therapy helps a great deal. Go gently, and work with a trained professional.
aurora|Social anxiety|Social anxiety is intense fear of being judged in social situations. It is more than shyness. It often improves with gradual practice, CBT and swapping thoughts like everyone is watching me for realistic ones.
nova|Bipolar disorder|Bipolar disorder involves mood episodes: mania or hypomania (high energy, little sleep, racing thoughts, risky choices) and depression. Bipolar I includes full mania, bipolar II includes hypomania and depression. It is a medical condition treated with mood stabilizing medication and therapy. Only a clinician can diagnose it.
nova|The stress response|Stress triggers fight, flight or freeze. Adrenaline and cortisol raise heart rate and sharpen focus. Short bursts help, but long-term stress wears on sleep, mood and health. Slow breathing, movement and rest let the body switch the alarm off.
nova|Sleep and mood|Sleep and mood affect each other. Poor sleep raises irritability and anxiety and can worsen depression. A steady schedule, a dark cool room, less late caffeine and screens off before bed help. Ongoing insomnia deserves a doctor’s attention.
oracle|Paranoia|Paranoia is persistent suspicion that others mean harm without enough evidence. It can come from stress, lack of sleep, substances, trauma, or conditions such as paranoid personality disorder or psychosis. Mild suspicion is common. If the thoughts feel convincing, frightening or disrupt life, talk to a clinician. Checking facts gently with someone you trust helps.
oracle|Stoic view of emotions|Stoic philosophy separates what you control, like your judgments and actions, from what you do not. Feelings are not wrong, but you can examine the thought behind them. Epictetus taught that we are disturbed more by our views of events than by the events themselves.
oracle|Hope and meaning|Viktor Frankl, a psychiatrist who survived the Nazi camps, argued that meaning helps people endure suffering. Small purposes, relationships and values can support hope in dark times. Hope grows through small steps, not only through feeling.
oracle|How treatment of mental illness changed|For centuries people with mental illness were hidden or mistreated in asylums. Modern care grew from 19th century reforms, medications from the 1950s, community care and talk therapy. Stigma has fallen but remains. Today treatment is evidence-based and recovery is expected.
legend|Burnout|Burnout is long-term exhaustion from chronic stress, with cynicism and a sense of being ineffective. It is not laziness. Recovery needs rest, boundaries, a lighter workload, support and sometimes changing the situation. If it deepens into hopelessness, see a professional.
legend|Decision fatigue|Making many decisions drains mental energy and leads to worse or avoided choices. Reduce it by deciding important things early in the day, using routines, limiting options and setting rules ahead of time.
legend|Resilience|Resilience is adapting well after stress. It grows from supportive relationships, realistic optimism, flexible thinking, healthy habits and learning from setbacks. It is built, not inborn, and asking for help is part of it.
titan|Doomscrolling and screen time|Doomscrolling is compulsively reading bad news, which can raise anxiety and hurt sleep. Set time limits, turn off non-essential notifications, pick fixed times for news and keep phones out of the bedroom.
titan|Mood tracking|Tracking mood, sleep and activity in a notes app can reveal patterns, like poor sleep before low days. Keep it simple: a score from 1 to 10 and a few words. Share the log with a clinician if you see one.
titan|Social media comparison|People post highlights, so comparing your life to feeds can fuel envy and low self-worth. Curate who you follow, take breaks and remember that what you see is edited.
pepper|Imposter syndrome|Imposter syndrome is feeling like a fraud despite real achievements, and it is common in high performers. Keep a record of wins, share the feeling with peers and treat mistakes as data. Skills are built, not just proven.
pepper|Perfectionism|Perfectionism sets standards so high that nothing feels good enough, and it often causes procrastination and anxiety. Aim for good enough, set time limits and judge effort as well as results.
pepper|OCD basics|Obsessive-compulsive disorder involves unwanted intrusive thoughts and repeated rituals done to ease distress. It is far more than being neat. Exposure and response prevention is the leading therapy, sometimes with medication.
vex|Music and mood|Music can change mood, release tension and help people process feelings. Upbeat tracks lift energy, slow tempos calm, and lyrics you relate to can help you feel understood. Music therapy is used alongside treatment.
vex|Stage fright|Performance anxiety causes shaking, a dry mouth and racing thoughts. Prepare well, practice in front of friends, breathe slowly and reframe nerves as excitement. Many great performers feel it every time.
vex|Creative blocks|Creative blocks often come from fear of judgment, perfectionism or exhaustion. Try small daily sessions, make bad drafts on purpose, change your setting and rest. A long block with low mood is worth talking about with someone.
vex|Sad songs and nostalgia|Sad songs can comfort by validating feelings. Nostalgia is a mix of warmth and longing that often boosts connection. If music keeps you stuck replaying the same worries, balance it with other activities.
elite|Financial anxiety|Money worry is a leading cause of stress. Helpful steps are knowing your numbers, making a simple budget, building a small emergency fund and paying the highest-interest debt first. Free credit counseling exists.
elite|Emotional spending|Buying to soothe stress gives a short lift and often regret. Wait 24 hours before non-essential purchases, notice the feeling behind the urge and find other comforts.
elite|Gratitude|Writing down three things you appreciate each day modestly improves mood over time. It works best as a habit with specific details, not forced positivity.
midnight|Loneliness and solitude|Loneliness is wanting more connection than you have, while solitude is chosen time alone. Loneliness affects health, so small steps help: one message, one shared activity. Quality of connection matters more than quantity.
midnight|Anger|Anger is a normal signal that a boundary was crossed. It becomes a problem when it explodes or is bottled up. Pause, breathe, name what is underneath it and act after the heat passes.
midnight|Emotional numbness|Feeling nothing can follow stress, trauma or depression as the mind protects itself. Gentle routines, movement and talking to someone help. If numbness lasts, a clinician can help.
luna|Exercise and mood|Regular movement reduces symptoms of anxiety and depression and improves sleep. Even a 10 minute walk helps. Pick something you enjoy and build gradually.
luna|Motivation and procrastination|Procrastination is usually avoiding a feeling, not laziness. Start with a two-minute step, remove friction and reward progress. Low energy that lasts for weeks may point to depression.
luna|Self-talk and confidence|Harsh self-talk drains confidence. Notice the voice, ask what you would say to a friend and swap in fair, specific statements. Confidence grows from keeping small promises to yourself.

act.pf=i=>{prof=prof.filter(p=>p.id!==i);sv("prof",prof);draw()};
act.dict=()=>{if(!DICT)return;if(dictOn)DICT.stop().catch(()=>{});else DICT.start().catch(()=>{})};
const hf0=act.hf;
act.hf=()=>{if(!DICT){hf0();return}
 if(hf){hf=false;DICT.stop().catch(()=>{});if(window.speechSynthesis)speechSynthesis.cancel();talking=false;hmsg="";draw()}
 else{hf=true;hmsg=" Listening. Speak, then pause. Say a name like “Hey Nova” to switch.";lock();DICT.start().catch(()=>{hf=false;hmsg=" Dictation was declined. Type, or use your keyboard mic.";draw()});draw()}};
function wire(){if(!DICT)return;
 DICT.onFinal(({text})=>{text=(text||"").trim();if(!text)return;
  if(hf){if(talking)return;let t=text;const m=text.match(/^(?:hey\s+)?(\w+)[,.]?\s*(.*)$/i);if(m){const f=A.find(a=>a.n.toLowerCase()===m[1].toLowerCase());if(f){cur=f.id;t=m[2]}}if(t.trim())ask(t)}
  else{const q=document.getElementById("q");if(q)q.value=(q.value+" "+text).trim()}});
 DICT.onState(({state})=>{dictOn=state==="listening";const b=document.querySelector('[data-a="dict"]');if(b)b.setAttribute("aria-pressed",String(dictOn))})}
const LLM_URL="";   // Phase 1: paste your Cloudflare Worker URL here (see worker/README.txt). Empty = offline mode.
const LLM={json:async(prompt)=>{
  const r=await fetch(LLM_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
  if(r.status===503){const e=new Error("budget");e.code="budget";throw e}
  if(!r.ok)throw new Error("llm "+r.status);
  const d=await r.json();
  const t=String(d.text||"").replace(/```json|```/g,"").trim();
  return JSON.parse(t.slice(t.indexOf("{"),t.lastIndexOf("}")+1));
}};
(async()=>{try{if(LLM_URL){SAMPLE=LLM}}catch(e){}if(tab==="chat"||tab==="voice")draw()})();
act.vg=i=>{gv[cur]=i;sv("gv",gv);draw();say("Hi, I\u2019m "+CA().n+".")};
draw();
</script>
<button id="inst" hidden>Install app</button>
<script>
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{}));
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
let dp=null;const ib=document.getElementById("inst");
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;ib.hidden=false});
ib.onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;ib.hidden=true};
addEventListener("appinstalled",()=>{ib.hidden=true});
</script>
