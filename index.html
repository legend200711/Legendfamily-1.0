<style>

nav{display:flex;border-top:1px solid var(--line);background:rgba(4,11,18,.92)}

.strip,.box{border:1px solid var(--line);background:var(--pn);border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:14px}

.p{--c:var(--b);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,transparent),transparent 75%);border-radius:6px;padding:14px;margin-bottom:14px;text-align:center;box-shadow:0 0 16px color-mix(in srgb,var(--c) 16%,transparent)}

#log{min-height:40vh}
.m{max-width:88%;padding:9px 13px;border-radius:8px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.u{margin-left:auto;background:var(--g);color:#02150d}
.a{background:var(--pn);border:1px solid var(--line);border-left:3px solid var(--b)}

.row input{margin:0}
textarea{min-height:90px}
label{display:block;color:var(--mute);font-size:13px;margin-top:6px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;margin-right:6px;color:var(--mute)}
.tag.pending{color:var(--warn);border-color:var(--warn)}
.tag.approved,.tag.shared{color:var(--g);border-color:var(--g)}
.tag.rejected{color:var(--bad);border-color:var(--bad)}
.wide{overflow-x:auto}
table{border-collapse:collapse;font-size:12px;width:100%}
td,th{border:1px solid var(--line);padding:4px;text-align:center}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.nn{margin:2px 0 0;font:800 17px/1 "Arial Narrow",Impact,sans-serif;letter-spacing:.18em;color:var(--c)}
.rl{margin:6px 0 0;font-size:12px;font-weight:700}
.qt{margin:4px 0;font-size:11px;font-style:italic;color:var(--mute);flex:1}
.wk{margin:4px 0 8px;font-size:10px;color:var(--mute);letter-spacing:.06em}
.p2 button{border:1px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);border-radius:3px;padding:9px 4px;font:700 12px system-ui,sans-serif;letter-spacing:.04em}
.foot{text-align:center;margin:14px 0 0;font-size:12px;color:var(--mute)}
.hb{display:flex;align-items:center;gap:10px;text-align:left}
.hb>div{flex:1;min-width:0}
.hb h1{font-size:20px;letter-spacing:.18em}
.hb p{letter-spacing:.06em}
.hb button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:4px;padding:8px 12px;font:600 13px system-ui,sans-serif}
.hb button[aria-label]{border:0;padding:0 6px;color:var(--g);font:700 32px/1 system-ui,sans-serif}
#v.cm{display:flex;flex-direction:column;overflow:hidden}
#v.cm #log{flex:1;min-height:0;overflow-y:auto}
.gbtn{width:100%;margin-bottom:12px;border:1px solid var(--g);background:rgba(56,242,166,.12);color:var(--g);border-radius:4px;padding:13px;font:700 15px system-ui,sans-serif;letter-spacing:.06em}
.gc{margin-top:8px;padding-bottom:0}
.fbk{margin-top:6px}
.fbk button{border:0;background:transparent;font-size:16px;opacity:.55;padding:2px 8px}
.fbk button[aria-pressed="true"]{opacity:1}
.row button[aria-pressed="true"]{background:var(--g);color:#02150d}
#nn{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.5}
header,main,nav{position:relative;z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sw,.sw2{animation:none}}
#inst{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;border:1px solid var(--g);background:#042a22;color:var(--g);border-radius:999px;padding:12px 18px;font:700 14px system-ui,sans-serif;box-shadow:0 0 16px rgba(56,242,166,.35)}

["mh","Depression basics","Depression is more than sadness. It can bring lasting low mood, loss of interest, tiredness and changes in sleep or appetite. It is common and treatable. A licensed professional can assess it; this library offers education only."],
["mh","Anxiety basics","Anxiety is the body\u2019s alarm system. It becomes a problem when worry is constant or hard to control. Slow breathing, regular sleep, less caffeine and talking to a professional can all help."],
["mh","Overthinking","Overthinking is looping on the same worries. Try writing the thought down, naming what you can control, and setting a short time to decide or let go."],
["mh","Grief","Grief has no fixed timeline or order. Sadness, anger, numbness and relief can all appear. Support from others and gentle routines help; ongoing difficulty functioning is a reason to seek professional support."],
["mh","Boundaries","A boundary is a clear statement of what you will and won\u2019t accept. Say it calmly, keep it short and follow through."],
["mh","Recognizing a crisis","Warning signs include talk of wanting to die, hopelessness, giving belongings away, or sudden calm after deep despair. Take it seriously, stay with the person, and contact local emergency services or a crisis line. In the US, call or text 988."],

const SEED2=[["t-cats-1", "cats", "Slow blink", "A slow blink from a relaxed cat is a friendly signal. Blink slowly back at it and look away softly. Staring straight at a cat can feel like a challenge.", "panther"], ["t-cats-2", "cats", "Why cats purr", "Cats purr when content, but also when stressed, scared or hurting, as a way to self-soothe. Judge the mood from the body: relaxed eyes and loose posture mean happy, flat ears and a tucked tail mean worried.", "panther"], ["t-cats-3", "cats", "Toxic to cats", "Lilies are extremely dangerous to cats; even pollen or vase water can cause kidney failure. Also toxic: onions, garlic, chocolate, grapes and raisins, antifreeze, and human pain medicine like acetaminophen. Call a vet or pet poison hotline right away if a cat eats any of these.", "panther"], ["t-cats-4", "cats", "Litter box rules", "Keep one litter box per cat plus one extra, scoop daily and put boxes in quiet spots away from food. A cat that suddenly avoids the box may have a medical problem, so check with a vet.", "panther"], ["t-cats-5", "cats", "Scratching is normal", "Scratching stretches muscles, marks territory and keeps claws healthy. Give sturdy scratching posts tall enough to stretch on. Declawing is surgery that removes the last bone of each toe and is not recommended.", "panther"], ["t-cats-6", "cats", "When a cat stops eating", "Cats are obligate carnivores and need meat for nutrients like taurine. A cat that refuses food for a day or two should see a vet, because fasting can cause serious liver trouble in cats.", "panther"], ["t-code-1", "code", "Read the error bottom-up", "In a Python traceback the last line names the error and the lines above show where it happened. Read the last line first, then the line number it points to.", "titan"], ["t-code-2", "code", "Debugging method", "Reproduce the bug, shrink it to the smallest example, change one thing at a time and check your assumptions with prints or a debugger. Explaining the problem out loud to a rubber duck often reveals it.", "titan"], ["t-code-3", "code", "Never commit secrets", "API keys and passwords must never go in code that is public or sent to a browser. Anyone can read a web page source. Keep keys on a server or in environment variables, and rotate any key that leaked.", "titan"], ["t-code-4", "code", "Git basics", "Git saves snapshots called commits. Commit small and often with clear messages, use branches for experiments, and merge when the work is tested. A commit can be undone, uncommitted work cannot.", "titan"], ["t-code-5", "code", "Big O in one minute", "O(1) takes the same time no matter the size, O(n) grows with the list, and O(n squared) grows fast with nested loops. Pick the simplest correct solution first and optimize only when it is too slow.", "titan"], ["t-code-6", "code", "Parameterized queries", "Never build database queries by gluing user text into a string, because that allows SQL injection. Use parameterized queries so user input is treated as data, never as code.", "titan"], ["t-elec-1", "elec", "Ohm’s law", "Voltage equals current times resistance (V = I x R). Power equals voltage times current (P = V x I). Know any two values and you can find the third.", "pepper"], ["t-elec-2", "elec", "LED resistor", "An LED needs a resistor to limit current. Resistor = (supply voltage minus LED voltage) divided by current. Example: 5 V supply, 2 V LED, 20 mA gives 150 ohms.", "pepper"], ["t-elec-3", "elec", "Multimeter safety", "Choose the right mode and range before touching a circuit. Measure resistance only with power off. Large capacitors can hold a charge after unplugging, so never open a power supply or old CRT.", "pepper"], ["t-elec-4", "elec", "PC will not turn on", "Check the wall outlet, power cable and the switch on the power supply. Then reseat the RAM, unplug extra drives and cards, and try with only the essentials. Swollen or leaking capacitors mean the board needs repair.", "pepper"], ["t-elec-5", "elec", "Soldering basics", "Heat the joint and the pad together, then feed solder to the joint, not the iron tip. A good joint looks shiny and shaped like a small cone. Use ventilation and wash your hands after handling leaded solder.", "pepper"], ["t-elec-6", "elec", "Battery safety", "Never puncture, crush or charge a swollen lithium battery. Stop using it, keep it away from flammable things and take it to a battery recycling drop-off.", "pepper"], ["t-elec-7", "elec", "3.3 V versus 5 V", "Many boards such as the ESP32 use 3.3 V logic and can be damaged by 5 V signals. Check each pin’s voltage rating and use a level shifter or voltage divider when mixing.", "pepper"], ["t-wrest-1", "wrest", "Kayfabe", "Kayfabe is the tradition of presenting scripted pro wrestling storylines and rivalries as if they were real. The matches are choreographed, but the athleticism and risk are real.", "luna"], ["t-wrest-2", "wrest", "Face and heel", "A face is the hero the crowd cheers and a heel is the villain the crowd boos. Promos are the talking segments that build the story before a match.", "luna"], ["t-wrest-3", "wrest", "WrestleMania", "The first WrestleMania was held on March 31, 1985 at Madison Square Garden in New York. It became WWE’s biggest yearly event.", "luna"], ["t-wrest-4", "wrest", "Royal Rumble", "The Royal Rumble is an over-the-top-rope battle royal with 30 entrants who enter at timed intervals. It was first held in 1988, and the winner earns a title match.", "luna"], ["t-wrest-5", "wrest", "Classic moves", "Common pro wrestling moves include the suplex, clothesline, DDT, powerbomb and piledriver. Wrestlers train for years to take falls safely and protect their partners.", "luna"], ["t-wrest-6", "wrest", "Amateur wrestling styles", "Folkstyle is used in US high school and college, while freestyle and Greco-Roman are Olympic styles. Greco-Roman bans holds below the waist. A pin ends the match, and a takedown scores 2 points in folkstyle.", "luna"], ["t-wrest-7", "wrest", "Cutting weight safely", "Amateur wrestlers compete in weight classes, and extreme weight cutting is dangerous. Talk with a coach and doctor, eat well, stay hydrated and avoid crash dieting or dehydration.", "luna"], ["t-vg-1", "vg", "Frame rate and refresh rate", "Frame rate is how many pictures the game makes per second (fps) and refresh rate is how many times the screen updates per second (Hz). 60 fps feels much smoother than 30. A screen can only show as many frames as its refresh rate.", "simba"], ["t-vg-2", "vg", "Game genres", "Common genres are RPGs, first-person shooters, platformers, strategy, puzzle, sports and survival. Roguelike is named after the 1980 game Rogue, where runs are random and death restarts the game.", "simba"], ["t-vg-3", "vg", "Speedrunning", "Speedrunning is finishing a game as fast as possible. Categories like any% mean finish by any means, while 100% means collect everything. Runs are timed and compared on community leaderboards.", "simba"], ["t-vg-4", "vg", "Early Access and DLC", "Early Access means a game is for sale while still in development and may change. DLC is extra content released after launch. Read recent reviews before buying a game still in Early Access.", "simba"], ["t-vg-5", "vg", "Reduce input lag", "Use a wired controller or low-latency wireless, turn on game mode on your TV, and use a high refresh rate display when possible. Turning off heavy motion smoothing on TVs also helps.", "simba"], ["t-vg-6", "vg", "Steam", "Steam is Valve’s PC game store and launcher, launched in 2003. It handles purchases, updates, cloud saves and a friends list.", "simba"], ["t-retro-1", "retro", "Famicom and NES", "Nintendo’s Famicom launched in Japan in 1983. The NES came to North America in 1985 and 1986 and helped rebuild the market after the video game crash of 1983.", "midnight"], ["t-retro-2", "retro", "Video game crash of 1983", "In 1983 the North American video game market collapsed because of too many weak games and consoles flooding stores. Atari was hit hard. The NES later revived the industry.", "midnight"], ["t-retro-3", "retro", "Cleaning cartridges", "Clean dirty cartridge contacts with 90 percent or higher isopropyl alcohol and a cotton swab, then let it dry fully. Do not blow into cartridges because moisture from breath can corrode the contacts.", "midnight"], ["t-retro-4", "retro", "Battery saves", "Many old cartridges, like early Pokémon games and Zelda, save with a small battery. When it dies the save is lost, so back up your saves and replace the battery carefully before it fails.", "midnight"], ["t-retro-5", "retro", "Light guns need CRTs", "Games like Duck Hunt only work on old CRT televisions because the gun reads the timing of the screen’s scanning picture. Modern flat screens delay the image and break it.", "midnight"], ["t-retro-6", "retro", "Atari 2600 and Genesis", "The Atari 2600 came out in 1977. Sega’s Genesis, called Mega Drive in most of the world, launched in Japan in 1988 and in North America in 1989.", "midnight"], ["t-retro-7", "retro", "Aging consoles", "Old consoles may need new capacitors, called recapping, and cleaning. Some old plastic yellows over time. Keep vintage hardware dry and stored away from heat and sunlight.", "midnight"], ["t-prod-1", "prod", "Pomodoro", "Work for 25 minutes with full focus, then rest for 5. After four rounds, take a longer break. Short timed sprints beat vague all-day effort.", "legend"], ["t-prod-2", "prod", "Eisenhower matrix", "Sort tasks as urgent and important (do now), important but not urgent (schedule), urgent but not important (delegate) and neither (drop). Most growth lives in the important but not urgent box.", "legend"], ["t-prod-3", "prod", "SMART goals", "A goal is stronger when it is Specific, Measurable, Achievable, Relevant and Time-bound. Instead of get fit, try walk 20 minutes, four days a week, for the next month.", "legend"], ["t-prod-4", "prod", "Two-minute rule", "If a task takes under two minutes, do it now. If it is bigger, write the very next physical action to start it and begin there.", "legend"], ["t-prod-5", "prod", "Weekly review", "Once a week, look at what got done, what slipped and what matters next. Pick your top three priorities and put them on your calendar.", "legend"], ["t-prod-6", "prod", "Habit stacking", "Attach a new habit to one you already do, like after I pour coffee, I write one line of my plan. Keep it tiny so it is easy to repeat.", "legend"], ["t-money-1", "money", "Compound interest and Rule of 72", "Compounding means earning returns on your earlier returns. Divide 72 by the yearly return percentage to estimate years to double: at 8 percent, about 9 years. Starting early matters most.", "elite"], ["t-money-2", "money", "Emergency fund", "A common guide is 3 to 6 months of essential expenses in an easy-to-reach savings account. It keeps surprise costs from becoming debt.", "elite"], ["t-money-3", "money", "Budget 50/30/20", "One simple guide: about 50 percent of income to needs, 30 percent to wants and 20 percent to saving and debt payoff. Adjust it to fit your real life.", "elite"], ["t-money-4", "money", "Paying off debt", "The avalanche method pays the highest interest rate first and saves the most money. The snowball method pays the smallest balance first and builds momentum. Pay the minimum on everything else.", "elite"], ["t-money-5", "money", "Credit score basics", "In the US, payment history and how much of your credit limit you use are the biggest factors in a score. Pay on time and keep card balances low.", "elite"], ["t-money-6", "money", "Money scam red flags", "Be wary of guaranteed returns, pressure to act fast, secrecy, and requests to pay with gift cards or crypto. A real investment never guarantees profit. This is general education, not financial advice.", "elite"], ["t-sci-1", "sci", "Speed of light", "Light travels about 299,792 kilometers (186,282 miles) per second in a vacuum. A light-year is the distance light travels in one year, about 9.46 trillion kilometers.", "nova"], ["t-sci-2", "sci", "Why the sky is blue", "Air molecules scatter short blue wavelengths of sunlight more than long red ones, so blue light reaches your eyes from every direction. At sunset the light passes through more air, leaving red and orange.", "nova"], ["t-sci-3", "sci", "Seasons", "Seasons come from Earth’s axis tilt of about 23.5 degrees, not from distance to the Sun. The hemisphere tilted toward the Sun gets more direct light and warmer weather.", "nova"], ["t-sci-4", "sci", "Black holes", "A black hole is a region where gravity is so strong that nothing, not even light, can escape past its event horizon. Many form when massive stars collapse.", "nova"], ["t-sci-5", "sci", "Scientific method", "Ask a question, form a testable hypothesis, run an experiment, analyze the results and share them so others can repeat the test. A good hypothesis can be proven wrong.", "nova"], ["t-music-1", "music", "Major scale pattern", "The major scale follows whole, whole, half, whole, whole, whole, half steps. Starting on C that gives C D E F G A B C with no sharps or flats.", "vex"], ["t-music-2", "music", "Four-chord progression", "The I V vi IV progression powers countless pop songs. In C major that is C, G, Am, F. Try changing the rhythm or the order to make it your own.", "vex"], ["t-music-3", "music", "Tempo and BPM", "BPM means beats per minute. Slow ballads sit around 60 to 80 BPM, hip-hop often 80 to 100 and dance music about 120 to 130. Practice hard parts slowly with a metronome, then speed up.", "vex"], ["t-music-4", "music", "Concert pitch", "Standard tuning sets the note A above middle C to 440 Hz. Most guitars tune the open strings E A D G B E from low to high.", "vex"], ["t-music-5", "music", "Mixing tips", "Get levels right before adding effects. Cut problem frequencies before boosting good ones, use EQ so instruments do not fight over the same space, and check the mix on different speakers.", "vex"], ["t-human-1", "human", "Magna Carta", "King John of England sealed the Magna Carta in 1215. It set the idea that even a ruler is bound by law.", "oracle"], ["t-human-2", "human", "Printing press", "Johannes Gutenberg developed movable-type printing in Europe around 1440. It made books cheaper and helped spread literacy and new ideas.", "oracle"], ["t-human-3", "human", "Declaration of Independence", "The US Declaration of Independence was adopted on July 4, 1776. It declared the thirteen colonies free from British rule.", "oracle"], ["t-human-4", "human", "Apollo 11", "Apollo 11 landed the first humans on the Moon on July 20, 1969. Neil Armstrong and Buzz Aldrin walked on the surface while Michael Collins orbited above.", "oracle"], ["t-human-5", "human", "Fall of the Berlin Wall", "The Berlin Wall opened on November 9, 1989. It had divided East and West Berlin since 1961, and German reunification followed in 1990.", "oracle"]];
const SEED3=[["u-cats-1", "cats", "Cat years", "A cat's first year is roughly like 15 human years and the second adds about nine more. After that each cat year is about four human years. Indoor cats often live 12 to 18 years and some reach 20, so regular vet care matters.", "panther"], ["u-cats-2", "cats", "Vaccines and checkups", "Kittens start a vaccine series around 6 to 8 weeks old. Core vaccines usually include rabies and FVRCP, which protects against feline distemper, herpesvirus and calicivirus. Adult cats should get a yearly checkup. Ask your vet for the right schedule for your cat.", "panther"], ["u-cats-3", "cats", "Spay and neuter", "Spaying or neutering is usually done around 4 to 6 months, and some shelters do it earlier. It prevents unwanted litters, reduces roaming, fighting and spraying, and lowers some health risks.", "panther"], ["u-cats-4", "cats", "Tail language", "A tail held straight up usually means friendly and confident. A puffed tail means fear or alarm, a low tucked tail means worry, and a fast lashing tail means irritation. A slow gentle sway often shows focused interest.", "panther"], ["u-cats-5", "cats", "Ears and whiskers", "Ears forward mean curious or relaxed. Ears flattened sideways or back mean fear or anger. Whiskers pushed forward show interest while whiskers pulled back show stress or defense.", "panther"], ["u-cats-6", "cats", "Kneading", "Kittens knead their mother's belly to bring milk. Adult cats that knead blankets or laps are usually showing comfort and contentment.", "panther"], ["u-cats-7", "cats", "Gifts from hunting", "Hunting is instinct. Cats that go outside may bring prey home. It is not anger. Keeping cats indoors or in a safe enclosed space protects both the cat and local wildlife.", "panther"], ["u-cats-8", "cats", "Cat nutrition", "Cats are obligate carnivores and need animal protein, taurine and vitamin A from animal sources. Pick food labeled complete and balanced for the cat's life stage. Dog food is not a substitute. Wet food also helps with hydration.", "panther"], ["u-cats-9", "cats", "Getting cats to drink", "Cats evolved from desert animals and drink little. Wet food, fresh water daily, wide shallow bowls placed away from the food, and a fountain can help. Drinking far more than usual, or far less, deserves a vet visit.", "panther"], ["u-cats-10", "cats", "Hairballs", "Cats swallow fur while grooming. An occasional hairball is normal and brushing helps. Frequent retching with nothing coming up, no appetite or constipation can mean a blockage and needs a vet right away.", "panther"], ["u-cats-11", "cats", "Introducing a new cat", "Keep the newcomer in a separate room at first. Swap blankets so they learn each other's scent, then allow short supervised meetings through a gate. It can take weeks. Rushing the introduction often causes fights.", "panther"], ["u-cats-12", "cats", "Kitten socialization", "The best window to socialize kittens is about 2 to 7 weeks of age. Gentle handling and calm exposure to new people and sounds in that time make friendlier, more confident adult cats.", "panther"], ["u-cats-13", "cats", "Cat-proofing a home", "Screen windows, hide cords, and keep string, rubber bands and hair ties away because swallowed string can cause serious blockages. Check washers and dryers before closing them and keep toxic plants like lilies out of the house.", "panther"], ["u-cats-14", "cats", "Coat colors", "Orange cats are more often male because the orange gene is on the X chromosome. Calico and tortoiseshell cats are almost always female for the same reason. Black fur can look rusty brown in strong sun.", "panther"], ["u-cats-15", "cats", "Urgent warning signs", "A cat, especially a male, that strains in the litter box and passes little or no urine needs a vet immediately because a urinary blockage can be fatal within a day or two. Trouble breathing, pale gums and repeated vomiting are also emergencies.", "panther"], ["u-cats-16", "cats", "How cats sleep", "Cats sleep 12 to 16 hours a day, and kittens and seniors even more. They are most active at dawn and dusk. Playing with your cat in the evening helps it sleep through the night.", "panther"], ["u-cats-17", "cats", "Play and enrichment", "Daily play with a wand toy lets a cat stalk, pounce and catch, which burns energy and cuts down on bad behavior. Finish with a treat to complete the hunt. Do not use your hands as toys.", "panther"], ["u-cats-18", "cats", "Traveling with a cat", "Use a hard-sided carrier with a soft blanket, secure it with a seatbelt and never leave a cat in a hot car. Leave the carrier out at home for a few days beforehand so it does not feel scary.", "panther"], ["u-code-1", "code", "Variables and types", "A variable is a named box that holds a value. Common types are numbers, strings of text, booleans (true or false), lists and dictionaries. Many bugs come from mixing types, like adding the number 5 to the text \"5\".", "titan"], ["u-code-2", "code", "Loops", "A loop repeats code. A for loop goes through a list or a range of numbers. A while loop repeats until a condition becomes false. If the condition never changes you get an infinite loop, so always make sure something moves toward the exit.", "titan"], ["u-code-3", "code", "Functions", "A function is a reusable block of code with a name. It takes inputs called parameters and can return a result. Keep each function small and doing one thing, and give it a name that says what it does.", "titan"], ["u-code-4", "code", "HTML CSS JavaScript", "HTML builds the structure of a web page, CSS controls how it looks and JavaScript adds behavior. Together they run in any browser with nothing to install. A single HTML file can hold all three.", "titan"], ["u-code-5", "code", "Python versus JavaScript", "Python reads clearly and is popular for scripting, data and automation. JavaScript runs in every browser and is the language of web pages. Both are good first languages. Pick the one that fits what you want to build.", "titan"], ["u-code-6", "code", "Off-by-one errors", "These happen when a loop or index is one too many or too few. Lists usually start at index 0, so a list of 5 items has indexes 0 to 4. When something is off by one, check where you start and where you stop.", "titan"], ["u-code-7", "code", "Null and undefined", "Many crashes come from using a value that is empty. In JavaScript that shows as undefined or null, in Python as None. Check that a value exists before using it, and read the error to see which line touched the empty value.", "titan"], ["u-code-8", "code", "Unit tests", "A test is code that checks your code. Write a small test that fails, fix the code until it passes, then keep the test. Tests catch old bugs coming back when you change something later.", "titan"], ["u-code-9", "code", "Readable code", "Use clear names, short functions and comments that explain why, not what. Code is read many more times than it is written. Future you counts as another person.", "titan"], ["u-code-10", "code", "APIs and JSON", "An API lets programs talk to each other, often over the web. JSON is a common text format for sending data, built from objects with keys and values and from lists. Most languages can turn JSON into variables in one line.", "titan"], ["u-code-11", "code", "HTTP basics", "When a browser asks a server for a page it sends a request. The server sends back a response with a status code. 200 means OK, 404 means not found, 403 means forbidden and 500 means the server broke.", "titan"], ["u-code-12", "code", "Browser developer tools", "In Chrome, open DevTools to see the Console for errors, Elements to inspect HTML and CSS, Network to see requests, and Application to see stored data. Most front-end debugging starts in the Console.", "titan"], ["u-code-13", "code", "Recursion", "Recursion is a function that calls itself on a smaller version of the problem. Every recursive function needs a base case that stops it. Without one it runs forever and crashes with a stack overflow.", "titan"], ["u-code-14", "code", "Core data structures", "A list or array keeps items in order. A dictionary or object maps keys to values for fast lookup. A set holds unique items. Choosing the right structure often makes a problem simple.", "titan"], ["u-code-15", "code", "Command line basics", "Common commands are cd to change folder, ls (or dir on Windows) to list files, mkdir to make a folder and cp to copy. Learning a few of these makes tools like Git and Python much easier to use.", "titan"], ["u-code-16", "code", "Hash passwords", "Never store passwords as plain text. Store a salted hash made with a slow algorithm like bcrypt or Argon2, so a leaked database does not reveal the passwords.", "titan"], ["u-code-17", "code", "Async and promises", "Some tasks, like loading data, take time. In JavaScript a promise stands for a result that arrives later, and async and await let you write that code so it reads top to bottom. Always handle errors with try and catch.", "titan"], ["u-code-18", "code", "Browser storage", "localStorage keeps small amounts of text in a user's browser and survives restarts, but the user can clear it. For data that must never be lost, also keep a backup copy somewhere else.", "titan"], ["u-code-19", "code", "Don't repeat yourself", "If you copy and paste the same code three times, turn it into a function. Fixing a bug then happens in one place instead of three.", "titan"], ["u-elec-1", "elec", "Resistors in series and parallel", "In series, resistances add up. In parallel, the total is less than the smallest resistor, found with one over the total equals the sum of one over each. Two equal resistors in parallel give half the value.", "pepper"], ["u-elec-2", "elec", "Capacitors", "A capacitor stores electric charge. It is rated in farads, usually microfarads, and by maximum voltage. Electrolytic capacitors have a polarity and must go in the right way around or they can bulge and vent.", "pepper"], ["u-elec-3", "elec", "Diodes", "A diode lets current flow in one direction only. LEDs are diodes that glow. A diode across a relay coil protects other parts from voltage spikes. Check the stripe or flat side to get orientation right.", "pepper"], ["u-elec-4", "elec", "Transistors as switches", "A transistor lets a small current or voltage control a bigger one. A logic pin from a small board can switch a motor or lamp through a transistor, with a diode across motors to absorb spikes.", "pepper"], ["u-elec-5", "elec", "Voltage dividers", "Two resistors in series split a voltage. The output is the input times R2 divided by R1 plus R2. They are great for reading sensors, but a divider is not a power supply because it cannot deliver much current.", "pepper"], ["u-elec-6", "elec", "Breadboards", "A breadboard lets you build circuits without solder. The long side rails carry power and ground. Holes in the same short row are connected, with a gap down the middle. Many strange problems are loose wires in the wrong row.", "pepper"], ["u-elec-7", "elec", "Resistor color codes", "Bands show the value. The first two bands are digits, the third is a multiplier and the last is tolerance. Black is 0, brown 1, red 2, orange 3, yellow 4, green 5, blue 6, violet 7, gray 8 and white 9.", "pepper"], ["u-elec-8", "elec", "AC and DC", "DC flows in one direction, like from a battery or a phone charger. AC changes direction many times a second, like wall power. Wall voltage can be deadly, so beginners should work with low-voltage DC.", "pepper"], ["u-elec-9", "elec", "Fuses and shorts", "A short circuit gives current a path with almost no resistance. A fuse is a weak link that melts to stop dangerous current. Always replace a fuse with the same rating and never bypass it with foil or wire.", "pepper"], ["u-elec-10", "elec", "Arduino and microcontrollers", "Boards like Arduino, ESP32 and Raspberry Pi Pico run programs and control pins. Start with blinking an LED, then add buttons and sensors. Check each board's pin voltage and current limits before connecting anything.", "pepper"], ["u-elec-11", "elec", "Dead device checklist", "Check the power source first, then cables and fuses, then connections and switches. Look for burned smell, bulging capacitors and loose solder. Test with a multimeter before replacing parts and change only one thing at a time.", "pepper"], ["u-elec-12", "elec", "Power adapters", "The adapter's voltage must match what the device needs. The amp rating is only the maximum it can supply, so a higher amp adapter is fine. Check polarity too, shown by a small plus and minus symbol.", "pepper"], ["u-elec-13", "elec", "Safe desoldering", "Use solder wick or a solder pump with a hot iron to remove a joint. Work slowly so you do not lift the copper pad. Add fresh solder before removing old solder because it helps heat flow.", "pepper"], ["u-elec-14", "elec", "PC parts", "A computer has a CPU, RAM, storage, motherboard, power supply and sometimes a graphics card. The CPU does the thinking, RAM is short-term workspace, and storage keeps files. If it will not boot, reseating RAM fixes many problems.", "pepper"], ["u-elec-15", "elec", "SSD versus HDD", "An SSD has no moving parts and is much faster and quieter. A hard drive spins platters and costs less per terabyte but is slower and can fail from drops. Back up either one because all drives eventually fail.", "pepper"], ["u-elec-16", "elec", "Overheating", "Computers slow down or shut off when too hot. Clean dust from fans and vents with compressed air while the machine is off, keep vents clear, and replace dried thermal paste if temperatures keep climbing.", "pepper"], ["u-elec-17", "elec", "Wi-Fi troubleshooting", "Restart the router and modem first by unplugging for 30 seconds. Move closer, test another device, and check if the slowdown is at the router or the internet provider. Crowded channels and thick walls hurt signal.", "pepper"], ["u-wrest-1", "wrest", "Andre the Giant", "Andre the Giant was a French wrestler famous for his size, billed at over seven feet tall. His 1987 WrestleMania III match with Hulk Hogan, where Hogan slammed him, is one of the most famous moments in wrestling.", "luna"], ["u-wrest-2", "wrest", "Hulkamania", "Hulk Hogan became the face of 1980s wrestling and helped WWE grow into a national sensation with his catchphrases, yellow and red outfit and big moments at early WrestleManias.", "luna"], ["u-wrest-3", "wrest", "Ric Flair", "Ric Flair, the Nature Boy, is famous for his flashy robes, his Woooo shout and winning many world titles over a career that spanned decades. He is considered one of the greatest ever.", "luna"], ["u-wrest-4", "wrest", "The Attitude Era", "The Attitude Era, from about 1997 to 2002, was an edgier WWE period led by stars like Stone Cold Steve Austin and The Rock. It was also the peak of the rivalry with WCW.", "luna"], ["u-wrest-5", "wrest", "Monday Night Wars", "From 1995 to 2001, WWE's Monday Night Raw, which debuted in 1993, battled WCW's Monday Nitro for ratings, which began in 1995. WWE bought WCW in 2001, ending the war.", "luna"], ["u-wrest-6", "wrest", "AEW and the modern scene", "All Elite Wrestling was founded in 2019 and began weekly shows that year, giving WWE a major national rival again. Smaller promotions and independent shows also thrive across the country.", "luna"], ["u-wrest-7", "wrest", "Lucha libre", "Lucha libre is Mexican pro wrestling known for fast high-flying moves and masks that are treasured symbols. Losing a mask in a match can be a major story. El Santo is a legendary masked icon.", "luna"], ["u-wrest-8", "wrest", "Japanese wrestling", "Puroresu is Japanese pro wrestling, known for a hard-hitting style and a serious, athletic feel. New Japan Pro Wrestling is one of its biggest companies and has trained many global stars.", "luna"], ["u-wrest-9", "wrest", "Ring psychology", "Good wrestlers tell a story in the ring. A hurt body part gets attacked again and again, comebacks build the crowd's hope, and near falls make the finish feel big. The best matches work on emotion as much as moves.", "luna"], ["u-wrest-10", "wrest", "Match types", "Common stipulation matches include ladder matches, cage matches, Hell in a Cell, tables matches, and TLC matches with tables, ladders and chairs. They add danger and drama, though the moves are still planned to protect everyone.", "luna"], ["u-wrest-11", "wrest", "Tag teams", "Tag team wrestling uses two or more partners who tag in and out. Great teams share timing, signature double moves and a bond the crowd believes in. The hot tag is when the weakened partner finally reaches their ally.", "luna"], ["u-wrest-12", "wrest", "Wrestling slang", "A promo is a speech, a work is something planned, and a shoot is something real. A heel turn is when a hero becomes a villain. A squash match is a quick one-sided win, and a run-in is when someone interferes.", "luna"], ["u-wrest-13", "wrest", "Finishing moves", "A finisher is a wrestler's signature move that usually ends a match. Famous ones include the Stone Cold Stunner, the Rock Bottom, the Tombstone and the Sharpshooter. A good finisher is easy to recognize and exciting to see.", "luna"], ["u-wrest-14", "wrest", "Wrestling training", "New wrestlers first learn how to fall safely, called taking bumps, by tucking the chin and spreading the impact across the back. They also learn timing, communication and conditioning. A good school and a trained coach matter a lot for safety.", "luna"], ["u-wrest-15", "wrest", "Olympic wrestling", "Wrestling is one of the oldest sports in the Olympics. Freestyle and Greco-Roman are contested. Matches are won by a pin or by points from takedowns, exposures and reversals.", "luna"], ["u-wrest-16", "wrest", "Dan Gable", "Dan Gable won an Olympic gold medal in 1972 without giving up a single point, then coached Iowa to 15 NCAA team titles. He is one of the best known names in American amateur wrestling.", "luna"], ["u-wrest-17", "wrest", "Cael Sanderson", "Cael Sanderson went 159 and 0 at Iowa State with four NCAA titles, then won Olympic gold in 2004. His perfect college record is one of the most famous achievements in amateur wrestling.", "luna"], ["u-wrest-18", "wrest", "Folkstyle scoring", "In folkstyle, a takedown is 2 points, an escape is 1, a reversal is 2, and near falls are worth 2 or 3 depending on how long the opponent is held. A pin ends the match right away. A match has three periods.", "luna"], ["u-wrest-19", "wrest", "Cauliflower ear", "Cauliflower ear happens when a hit to the ear causes bleeding between the skin and cartilage, and without treatment it hardens. Wearing headgear and getting swelling drained quickly by a doctor helps prevent it.", "luna"], ["u-wrest-20", "wrest", "Wrestling conditioning", "Wrestlers build strength, balance, flexibility and endurance with bodyweight work, rope climbs, drilling and live practice. Neck strength matters a lot. Good sleep, food and recovery matter as much as the workouts.", "luna"], ["u-vg-1", "vg", "Pong and early arcades", "Atari's arcade game Pong came out in 1972 and helped launch the video game industry. Arcades boomed in the late 1970s with games like Space Invaders in 1978 and Pac-Man in 1980.", "simba"], ["u-vg-2", "vg", "Donkey Kong and Mario", "Nintendo's Donkey Kong arrived in 1981 and introduced a character called Jumpman, who became Mario. Super Mario Bros. followed in 1985 and set the standard for side-scrolling platformers.", "simba"], ["u-vg-3", "vg", "Tetris", "Tetris was created by Alexey Pajitnov in the Soviet Union in 1984. Its simple falling blocks made it one of the most popular puzzle games ever, especially after it came packed with the Game Boy.", "simba"], ["u-vg-4", "vg", "The Legend of Zelda", "The first Legend of Zelda released in Japan in 1986. It mixed exploration, puzzles and action in a large world and started a series that still defines adventure games.", "simba"], ["u-vg-5", "vg", "Doom and first-person shooters", "id Software's Doom came out in 1993 and made first-person shooters hugely popular. It also spread the idea of fan-made mods and shareware distribution.", "simba"], ["u-vg-6", "vg", "Minecraft", "Minecraft started as an early version by Markus Persson in 2009 and fully released in 2011. Its blocks, survival and creative modes and endless worlds made it one of the best-selling games of all time.", "simba"], ["u-vg-7", "vg", "Battle royale", "In battle royale games many players drop into a shrinking map and fight until one is left. Fortnite's free-to-play Battle Royale mode, launched in 2017, made the genre mainstream.", "simba"], ["u-vg-8", "vg", "Metroidvania and Souls-like", "Metroidvania games, named after Metroid and Castlevania, are about exploring a connected map and unlocking abilities to reach new areas. Souls-like games, inspired by Dark Souls, focus on tough combat where learning enemy patterns matters.", "simba"], ["u-vg-9", "vg", "Roguelike versus roguelite", "Roguelikes use random levels and permanent death, so a loss means starting over. Roguelites keep some progress between runs, like upgrades or unlocks, which makes the grind less harsh.", "simba"], ["u-vg-10", "vg", "Open-world games", "Open-world games let you roam a big map freely instead of following a fixed path. Good ones fill the space with things worth finding, not just distance to cover.", "simba"], ["u-vg-11", "vg", "Screen resolutions", "1080p is 1920 by 1080 pixels and 4K is 3840 by 2160, four times as many. Higher resolution looks sharper but needs a stronger graphics chip. A good frame rate often matters more than extra pixels.", "simba"], ["u-vg-12", "vg", "Ray tracing", "Ray tracing simulates how light bounces to create realistic reflections, shadows and lighting. It looks great but is demanding, so many games let you turn it off to get a higher frame rate.", "simba"], ["u-vg-13", "vg", "Mods and modding", "Mods are fan-made changes to a game, from new skins to whole new games. Download mods from trusted sites, read comments, and back up your saves because mods can sometimes break a game.", "simba"], ["u-vg-14", "vg", "Cloud saves and backups", "Cloud saves store your progress online so you can continue on another device or recover it after a crash. Check that your game and platform support them before you rely on them.", "simba"], ["u-vg-15", "vg", "Loot boxes", "Loot boxes are random rewards that can be bought with real money. Because the odds are random, many people compare them to gambling, and some countries have rules about them. Set spending limits, especially for kids.", "simba"], ["u-vg-16", "vg", "Accessibility options", "Good games offer subtitles, colorblind modes, remappable controls, adjustable difficulty and text size options. Check the settings menu, because these options can make a game playable for many more people.", "simba"], ["u-vg-17", "vg", "Games Done Quick", "Games Done Quick is a charity speedrunning marathon held online and in person, where runners finish games at top speed to raise money for causes. It is a great place to see world-class speedruns.", "simba"], ["u-vg-18", "vg", "Protecting your eyes", "Long gaming sessions strain the eyes. Follow the 20-20-20 rule: every 20 minutes look at something 20 feet away for 20 seconds. Also take breaks to move, drink water and stretch.", "simba"], ["u-vg-19", "vg", "Esports", "Esports are organized competitive video games, from team shooters to fighting games and sports titles. Pros train for hours daily, and big tournaments draw huge online audiences and large prize pools.", "simba"], ["u-retro-1", "retro", "First home console", "The Magnavox Odyssey, released in 1972, is considered the first home video game console. It used plastic overlays on the TV screen and had no sound.", "midnight"], ["u-retro-2", "retro", "Intellivision and ColecoVision", "Mattel's Intellivision launched in 1979 and ColecoVision in 1982. Both competed with Atari and were known for arcade-style graphics, with ColecoVision coming with Donkey Kong.", "midnight"], ["u-retro-3", "retro", "Sega Master System", "Sega's Master System launched in Japan in 1985 and in North America in 1986. It lost the sales race to Nintendo in the US but was popular in Europe and Brazil.", "midnight"], ["u-retro-4", "retro", "Game Boy", "Nintendo's Game Boy arrived in 1989 with a gray screen and long battery life, packed with Tetris. It outsold stronger rivals because it was cheap, sturdy and had great games.", "midnight"], ["u-retro-5", "retro", "Super Nintendo", "The Super Famicom launched in Japan in 1990 and the Super Nintendo came to North America in 1991. Its library of classics includes Super Mario World, Zelda: A Link to the Past and Super Metroid.", "midnight"], ["u-retro-6", "retro", "Sonic and the Genesis", "Sega released Sonic the Hedgehog in 1991 as its fast mascot to rival Mario. The Genesis versus Super Nintendo rivalry defined the early 1990s console wars.", "midnight"], ["u-retro-7", "retro", "Neo Geo", "SNK's Neo Geo from 1990 put arcade-quality games into a home system, but the console and its games were very expensive. Today the games are valuable collectibles.", "midnight"], ["u-retro-8", "retro", "PlayStation", "Sony's PlayStation launched in Japan in late 1994 and in North America in 1995. It popularized CD-based games and 3D graphics, and helped bring in a wider adult audience.", "midnight"], ["u-retro-9", "retro", "Nintendo 64", "The Nintendo 64 came out in 1996 and still used cartridges. It pioneered the analog stick in 3D games, and classics included Super Mario 64 and The Legend of Zelda: Ocarina of Time.", "midnight"], ["u-retro-10", "retro", "Dreamcast", "Sega's Dreamcast launched in Japan in 1998 and in North America in 1999 with a built-in modem for online play. It was discontinued in 2001 but has a devoted fan following.", "midnight"], ["u-retro-11", "retro", "The Konami code", "The Konami code is up, up, down, down, left, right, B, A. It first appeared in the 1986 NES version of Gradius, created by developer Kazuhisa Hashimoto, and later turned up in many games and websites.", "midnight"], ["u-retro-12", "retro", "8-bit and 16-bit", "These labels refer loosely to the processor and graphics power of a console generation. The NES and Master System are called 8-bit, while the Super Nintendo and Genesis are called 16-bit, with richer colors and sound.", "midnight"], ["u-retro-13", "retro", "NTSC and PAL", "NTSC regions like North America and Japan use 60 Hz video, and PAL regions like much of Europe use 50 Hz. Some imported games run slower or need a matching console. Region locks can also block imported games.", "midnight"], ["u-retro-14", "retro", "Video cables", "On old consoles, composite cables are the simplest but blurriest, S-Video is sharper, and component and RGB give the cleanest picture. A good scaler can make old consoles look better on modern TVs.", "midnight"], ["u-retro-15", "retro", "Spotting fake cartridges", "Reproduction cartridges can look real. Check the label quality, the screw type, the weight and the circuit board inside. Use a trusted seller and compare to photos of known real copies before paying a high price.", "midnight"], ["u-retro-16", "retro", "Storing a collection", "Store games upright in a cool, dry place away from sunlight and attics. Heat and humidity damage labels and contacts. Keep manuals and boxes flat and dry, and avoid stacking heavy things on cartridges.", "midnight"], ["u-retro-17", "retro", "Game Genie", "The Game Genie was a cheat device from Galoob and Codemasters that plugged between an NES cartridge and the console. Players typed codes to change things like lives or jump height.", "midnight"], ["u-retro-18", "retro", "Pokemon on Game Boy", "Pokemon Red and Green launched in Japan in 1996, and Red and Blue came to North America in 1998. Trading and battling over the link cable drove the game's huge success.", "midnight"], ["u-retro-19", "retro", "Chiptune music", "Chiptune is music made with the sound chips of old consoles, using simple square, triangle and noise waves. The limits forced composers to write extremely catchy melodies, and the style is still loved today.", "midnight"], ["u-retro-20", "retro", "Collecting tips", "Start with games you actually love, check what completed sales really sold for, and test every game before buying if you can. Keep original battery saves backed up and clean games gently.", "midnight"], ["u-prod-1", "prod", "Time blocking", "Time blocking means putting tasks on your calendar as appointments. It forces you to choose what matters and prevents the day from filling with small things. Leave open blocks for surprises.", "legend"], ["u-prod-2", "prod", "Deep work", "Deep work is focused effort on something hard with no distractions. Turn off notifications, set a timer and work in one block of 60 to 90 minutes. Do it when your energy is highest.", "legend"], ["u-prod-3", "prod", "Single-tasking", "Switching tasks wastes time because the mind needs a few minutes to refocus each time. Finish one thing before opening another, and keep a list nearby to park ideas that pop up.", "legend"], ["u-prod-4", "prod", "Eat the frog", "Eat the frog means doing the hardest or most dreaded task first. Once it is done the rest of the day feels easier and you avoid putting it off again and again.", "legend"], ["u-prod-5", "prod", "Batching", "Batching groups similar small tasks, like emails or errands, into one block. It saves the setup time of switching and keeps those chores from interrupting your focus all day.", "legend"], ["u-prod-6", "prod", "Parkinson's law", "Parkinson's law says work expands to fill the time you give it. Setting a shorter deadline, even for yourself, helps you focus on what is essential and finish faster.", "legend"], ["u-prod-7", "prod", "Sleep and performance", "Good sleep sharpens memory, focus and mood. Most adults do better with 7 to 9 hours. A steady schedule, a dark room and screens off before bed make the biggest difference.", "legend"], ["u-prod-8", "prod", "Taking breaks", "Short breaks help the brain stay sharp. Stand up, stretch, drink water or look out a window. Breaks away from your phone work better than scrolling.", "legend"], ["u-prod-9", "prod", "Saying no", "Every yes uses time you do not have for something else. A polite no, or a not right now, protects your priorities. You can offer a smaller or later alternative if you want to help.", "legend"], ["u-prod-10", "prod", "Plan tomorrow tonight", "Spend five minutes at the end of the day writing the top three things for tomorrow. You wake up with a clear plan and waste less morning energy deciding what to do.", "legend"], ["u-prod-11", "prod", "Beating procrastination", "When you cannot start, tell yourself you will work for just five minutes. Starting is the hardest part, and most of the time you will keep going. Make the first step tiny and obvious.", "legend"], ["u-prod-12", "prod", "Spaced repetition", "Spaced repetition means reviewing material at growing intervals, like after a day, a week and a month. It beats cramming because it fights forgetting. Flashcards are a simple way to use it.", "legend"], ["u-prod-13", "prod", "Active recall", "Active recall means testing yourself instead of re-reading. Close the book and write or say what you remember, then check. Struggling a little to remember makes memory stronger.", "legend"], ["u-prod-14", "prod", "Feynman technique", "To learn something, try explaining it in simple words as if to a child. Wherever you get stuck is what you do not yet understand. Go back, study that gap and try again.", "legend"], ["u-prod-15", "prod", "Energy management", "Match tasks to your energy. Do hard thinking when you are fresh and routine chores when you are tired. Food, movement and sunlight early in the day boost energy.", "legend"], ["u-prod-16", "prod", "Keep a done list", "A done list records what you finished each day. It shows progress that a to-do list hides and helps on days you feel behind. Review it at your weekly check-in.", "legend"], ["u-money-1", "money", "Interest and APR", "Interest is what you pay to borrow or earn when you save. APR is the yearly cost of borrowing, including some fees. APY includes compounding and is the number to compare for savings accounts.", "elite"], ["u-money-2", "money", "Inflation", "Inflation is the general rise in prices over time, so money buys less. Cash kept for years loses buying power, which is one reason people invest long-term money rather than leave it all in a drawer.", "elite"], ["u-money-3", "money", "Stocks and bonds", "A stock is a small piece of ownership in a company and can rise or fall. A bond is a loan to a company or government that pays interest. Stocks tend to be riskier with higher long-term growth, and bonds tend to be steadier.", "elite"], ["u-money-4", "money", "Diversification", "Diversification means spreading money across many investments so one failure does not wreck you. A broad index fund holds many companies at once. It does not remove risk, but it lowers the risk from a single bad choice.", "elite"], ["u-money-5", "money", "Employer retirement match", "If an employer matches contributions to a retirement plan like a US 401(k), contributing enough to get the full match is like getting free money. Check your plan's rules and vesting schedule.", "elite"], ["u-money-6", "money", "Roth versus traditional", "In a traditional retirement account you usually get a tax break now and pay tax when you withdraw. In a Roth you pay tax now and withdraw tax-free later, if rules are met. Which is better depends on your tax rate now and later.", "elite"], ["u-money-7", "money", "Gross and net pay", "Gross pay is what you earn before taxes and deductions. Net pay, or take-home pay, is what arrives in your account. Budget with net pay because that is the money you actually have.", "elite"], ["u-money-8", "money", "Credit card habits", "Paying the full statement balance each month means you pay no interest. Carrying a balance can cost 20 percent a year or more. Treat a card like a debit card and only charge what you can pay off.", "elite"], ["u-money-9", "money", "Bank deposit insurance", "In the US, FDIC insurance protects deposits up to 250,000 dollars per depositor, per insured bank, per ownership category. Check that your bank is FDIC insured before you rely on it.", "elite"], ["u-money-10", "money", "Insurance basics", "A premium is what you pay for insurance, and a deductible is what you pay yourself before it kicks in. Higher deductibles usually lower the premium. Insurance exists to cover losses you could not afford.", "elite"], ["u-money-11", "money", "Sinking funds", "A sinking fund is money set aside a little at a time for a known future cost, like car repairs, holidays or annual fees. It turns big surprise bills into small regular amounts.", "elite"], ["u-money-12", "money", "Net worth", "Net worth is what you own minus what you owe. Tracking it every few months shows whether you are moving forward even when pay and bills shift. Focus on the trend rather than the exact number.", "elite"], ["u-money-13", "money", "Needs versus wants", "Needs are things like housing, food, transportation and basic bills. Wants are everything else. A good test is to wait 48 hours before buying a want. If you still want it, plan for it.", "elite"], ["u-money-14", "money", "Negotiating pay", "Research typical pay for your role, list your achievements and ask for a specific number a bit above your target. Staying calm and polite works better than demanding. If the pay cannot move, ask about other benefits.", "elite"], ["u-money-15", "money", "Rent versus buy", "Buying a home builds equity but adds costs like taxes, repairs and insurance, and it is harder to move. Renting is flexible with fewer surprises. The right choice depends on how long you will stay and local prices.", "elite"], ["u-money-16", "money", "Profit and cash flow", "Profit is revenue minus expenses. Cash flow is the timing of money coming in and going out. A business can be profitable on paper and still run out of cash if customers pay late.", "elite"], ["u-money-17", "money", "Pricing your work", "Price to cover your costs, your time and a profit, not just what feels comfortable. Cheap pricing can attract difficult customers and leave nothing for growth. Test a higher price before assuming people will not pay it.", "elite"], ["u-money-18", "money", "Separate business money", "Keep business and personal money in separate accounts. It makes records and taxes simpler and shows what the business really earns. Save receipts and set aside part of each payment for taxes.", "elite"], ["u-money-19", "money", "Starting small", "Test a business idea cheaply before spending a lot. Sell to a few real customers, listen to what they say and improve. Small steady wins teach more than a big launch no one asked for.", "elite"], ["u-sci-1", "sci", "Gravity", "Gravity is the force that pulls objects with mass toward each other. Near Earth's surface it speeds a falling object up by about 9.8 meters per second every second. Astronauts float in orbit because they are in constant free fall around Earth.", "nova"], ["u-sci-2", "sci", "Newton's laws of motion", "An object stays at rest or keeps moving in a straight line unless a force acts on it. Force equals mass times acceleration. For every action there is an equal and opposite reaction. Together they explain most everyday motion.", "nova"], ["u-sci-3", "sci", "Atoms", "Atoms are the building blocks of matter. A tiny nucleus of protons and neutrons sits at the center, and electrons move around it. The number of protons decides which element an atom is.", "nova"], ["u-sci-4", "sci", "Periodic table", "The periodic table arranges the 118 known elements by atomic number. Dmitri Mendeleev published an early version in 1869 and used its gaps to predict elements not yet discovered.", "nova"], ["u-sci-5", "sci", "DNA", "DNA carries the instructions for building living things. It is a double helix made of four bases, A, T, C and G. The structure was worked out in 1953 by Watson and Crick using key data from Rosalind Franklin. Any two people share about 99.9 percent of their DNA.", "nova"], ["u-sci-6", "sci", "Evolution by natural selection", "Charles Darwin published On the Origin of Species in 1859. Individuals vary, some traits help survival and reproduction, and those traits become more common over many generations. This slow process produced the variety of life.", "nova"], ["u-sci-7", "sci", "Cells", "All living things are made of cells. Plant and animal cells have a nucleus that holds DNA, and mitochondria that release energy. Bacteria are single cells without a nucleus. Your body has trillions of cells.", "nova"], ["u-sci-8", "sci", "Photosynthesis", "Plants use sunlight to turn carbon dioxide and water into sugar and oxygen. It happens in chloroplasts, which contain green chlorophyll. Nearly all life depends on it, directly or indirectly.", "nova"], ["u-sci-9", "sci", "The water cycle", "Water evaporates from oceans and lakes, rises, cools and condenses into clouds, then falls as rain or snow. It runs back to oceans through rivers and soil. Plants also release water vapor in a process called transpiration.", "nova"], ["u-sci-10", "sci", "Plate tectonics", "Earth's outer shell is broken into plates that move a few centimeters a year. Where plates meet we get earthquakes, volcanoes and mountains. The Pacific Ring of Fire is a belt of very active boundaries.", "nova"], ["u-sci-11", "sci", "Weather versus climate", "Weather is what the atmosphere does over hours and days. Climate is the average pattern over decades. A cold day does not disprove a warming climate, just as one sunny day does not make a desert.", "nova"], ["u-sci-12", "sci", "The planets", "The solar system has eight planets: Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus and Neptune. Jupiter is the largest and Venus is the hottest. Pluto was reclassified as a dwarf planet in 2006.", "nova"], ["u-sci-13", "sci", "Moon phases", "The Moon does not make light. We see the sunlit half from different angles as it orbits Earth about every 29.5 days, giving us new moon, crescent, quarter, gibbous and full.", "nova"], ["u-sci-14", "sci", "Tides", "Ocean tides are caused mainly by the Moon's gravity pulling on the water, with the Sun adding a smaller effect. Most coasts have two high tides and two low tides a day. Tides are strongest at new and full moon.", "nova"], ["u-sci-15", "sci", "Eclipses", "A solar eclipse happens when the Moon passes between the Sun and Earth. A lunar eclipse happens when Earth passes between the Sun and the Moon. Never look at the Sun without proper eclipse glasses because it can permanently damage your eyes.", "nova"], ["u-sci-16", "sci", "The light spectrum", "White light splits into red, orange, yellow, green, blue, indigo and violet. Light we cannot see includes infrared, which we feel as heat, and ultraviolet, which causes sunburn. Radio waves and X-rays are the same kind of wave at other wavelengths.", "nova"], ["u-sci-17", "sci", "Speed of sound", "Sound travels through air at about 343 meters per second at room temperature, much slower than light. That is why you see lightning before you hear thunder. Sound moves faster in water and faster still in solids.", "nova"], ["u-sci-18", "sci", "Conservation of energy", "Energy cannot be created or destroyed, only changed from one form to another. A roller coaster turns stored height energy into motion, and some becomes heat from friction. This idea is central to physics.", "nova"], ["u-sci-19", "sci", "States of matter", "The common states of matter are solid, liquid and gas. Adding heat can turn a solid into a liquid and then a gas. Plasma, found in lightning and stars, is a fourth state made of charged particles.", "nova"], ["u-sci-20", "sci", "Age of the universe and Earth", "Scientists estimate the universe began with the Big Bang about 13.8 billion years ago. Earth formed about 4.5 billion years ago, and the first life appeared at least 3.5 billion years ago.", "nova"], ["u-sci-21", "sci", "How vaccines work", "A vaccine shows the immune system a harmless piece or weakened form of a germ. The body learns to recognize it and builds memory cells, so it can respond fast if the real germ arrives.", "nova"], ["u-sci-22", "sci", "The human heart", "The heart is a muscle that pumps blood through the body. It beats about 100,000 times a day. Exercise strengthens it, and its pump has four chambers with valves that keep blood moving one way.", "nova"], ["u-music-1", "music", "Note names", "Western music uses seven note names, A through G, then repeats. Sharps raise a note by a half step and flats lower it. On a piano the white keys are the natural notes and the black keys are sharps and flats.", "vex"], ["u-music-2", "music", "Piano layout", "On a piano, black keys come in groups of two and three. The note C sits just left of the group of two. Once you can find C, you can find every other note.", "vex"], ["u-music-3", "music", "Time signatures", "A time signature shows beats per measure and which note gets a beat. 4/4 has four beats and is the most common. 3/4 is a waltz feel, and 6/8 feels like two groups of three.", "vex"], ["u-music-4", "music", "Major and minor chords", "A major chord, built from the first, third and fifth notes of a major scale, sounds bright. Lowering the third by a half step makes a minor chord, which sounds darker or sadder.", "vex"], ["u-music-5", "music", "Natural minor scale", "The natural minor scale follows whole, half, whole, whole, half, whole, whole steps. A minor has no sharps or flats. Every major scale has a relative minor that shares the same notes.", "vex"], ["u-music-6", "music", "Circle of fifths", "The circle of fifths arranges the 12 keys by moving up a fifth each step. It shows how many sharps or flats each key has and which keys are close neighbors, which helps with changing keys.", "vex"], ["u-music-7", "music", "Pentatonic scale", "The pentatonic scale uses just five notes, so it is hard to hit a wrong one. Minor pentatonic is the backbone of blues and rock solos, and the major version sounds bright and open.", "vex"], ["u-music-8", "music", "12-bar blues", "The 12-bar blues is a common form built on three chords, the I, IV and V. It repeats a 12 measure pattern, and the same shape drives countless blues, rock and jazz songs.", "vex"], ["u-music-9", "music", "Intervals", "An interval is the distance between two notes. A fifth sounds strong and stable, a third sounds sweet, and a tritone sounds tense. Learning to hear intervals is the foundation of ear training.", "vex"], ["u-music-10", "music", "Songwriting hooks", "A hook is the catchy part people remember. Make it simple, repeat it and give it a clear melody or rhythm. Put the hook in the chorus, and consider a short version in the intro.", "vex"], ["u-music-11", "music", "Better lyrics", "Concrete images beat abstract words. Instead of saying you are sad, describe the empty chair or the cold coffee. Keep lines singable, rhyme with purpose and write the truth of what happened.", "vex"], ["u-music-12", "music", "Dynamics", "Dynamics are how loud or soft music is. Changing volume creates drama, like quiet verses and a loud chorus. A song at one volume the whole time can feel flat.", "vex"], ["u-music-13", "music", "Gain staging", "Set recording levels so the loudest part peaks around minus 12 to minus 6 decibels on your meter. Never let it hit zero because digital clipping sounds harsh and cannot be fixed. Quiet is safer than too loud.", "vex"], ["u-music-14", "music", "EQ basics", "EQ turns frequencies up or down. Cut mud around 200 to 400 hertz, add clarity with a gentle boost around 3 to 5 kilohertz and trim harsh highs. Make small moves and compare with the original.", "vex"], ["u-music-15", "music", "Compression", "Compression turns down the loudest parts so a track sounds steadier. A little makes vocals sit nicely in a mix, and too much squashes the life out of the music. Use your ears, not just the meters.", "vex"], ["u-music-16", "music", "Reverb and delay", "Reverb mimics the sound of a space, from a small room to a big hall. Delay repeats a sound. Use them to add depth, and keep a dry version of the vocal so words stay clear.", "vex"], ["u-music-17", "music", "Human hearing range", "People hear roughly 20 hertz to 20,000 hertz, and the top end shrinks with age. Bass lives below about 250 hertz, vocals and most instruments sit in the middle, and cymbals shimmer up high.", "vex"], ["u-music-18", "music", "Hip-hop origins", "Hip-hop began in the Bronx in the 1970s. A party hosted by DJ Kool Herc on August 11, 1973 is widely seen as a starting point, with DJing, MCing, breakdancing and graffiti as its core elements.", "vex"], ["u-music-19", "music", "Jazz roots", "Jazz developed in New Orleans in the early 1900s, blending blues, ragtime and brass band music. Improvisation is at its heart, with musicians inventing melodies on top of chord changes.", "vex"], ["u-music-20", "music", "MIDI and DAWs", "MIDI is a standard from 1983 that sends note information, not sound, between instruments and computers. A DAW is software for recording, editing and mixing. MIDI lets you change a part's instrument after you play it.", "vex"], ["u-music-21", "music", "Practice routine", "Short, focused practice beats long, unfocused sessions. Warm up, work on one tricky spot slowly with a metronome, then play something fun. Recording yourself helps you hear what needs work.", "vex"], ["u-human-1", "human", "Great Pyramid of Giza", "The Great Pyramid of Giza was built around 2560 BCE as a tomb for the pharaoh Khufu. It was the tallest human-made structure in the world for nearly four thousand years.", "oracle"], ["u-human-2", "human", "Athens and democracy", "Athens developed an early form of democracy in the fifth century BCE where male citizens voted directly on laws. It excluded women, enslaved people and foreigners, but it influenced later ideas of self-government.", "oracle"], ["u-human-3", "human", "Alexander the Great", "Alexander of Macedon, who lived from 356 to 323 BCE, built an empire from Greece to Egypt and northwest India by the age of 30. After he died it split among his generals and spread Greek culture widely.", "oracle"], ["u-human-4", "human", "Rise of the Roman Empire", "Rome began as a city and became a republic. After years of civil war, Augustus became the first emperor in 27 BCE. The Western Roman Empire fell in 476 CE, but the Eastern half lasted until 1453.", "oracle"], ["u-human-5", "human", "The Silk Road", "The Silk Road was a network of trade routes linking China, India, the Middle East and Europe for centuries. It carried silk, spices and paper, and also ideas, religions and, unfortunately, diseases.", "oracle"], ["u-human-6", "human", "Islamic Golden Age", "From roughly the 8th to 13th centuries, scholars in cities like Baghdad advanced math, medicine, astronomy and philosophy. The House of Wisdom was a famous center for translating and expanding knowledge.", "oracle"], ["u-human-7", "human", "Mongol Empire", "Genghis Khan united the Mongol tribes around 1206 and his successors built the largest connected land empire in history. It linked East and West, opening trade routes but also causing great destruction.", "oracle"], ["u-human-8", "human", "The Black Death", "The Black Death, a plague pandemic, swept across Europe from 1347 to 1351 and killed an estimated third or more of its people. It changed society, from labor and wages to attitudes about religion and medicine.", "oracle"], ["u-human-9", "human", "The Renaissance", "The Renaissance began in Italy in the 14th century and reached across Europe. It revived interest in art, science and classical learning, with figures like Leonardo da Vinci and Michelangelo.", "oracle"], ["u-human-10", "human", "Columbus 1492", "Christopher Columbus sailed from Spain in 1492 and reached islands in the Caribbean. His voyages began lasting contact between Europe and the Americas, which brought huge changes and devastation to Indigenous peoples.", "oracle"], ["u-human-11", "human", "The Protestant Reformation", "In 1517 Martin Luther published his 95 Theses criticizing church practices. The movement broke Western Christianity into new branches and reshaped politics across Europe.", "oracle"], ["u-human-12", "human", "French Revolution", "The French Revolution began in 1789 and ended the monarchy's absolute power. It spread ideas of liberty and equality, though it also brought violence and the rise of Napoleon.", "oracle"], ["u-human-13", "human", "The Industrial Revolution", "Starting in Britain in the late 1700s, machines and factories began replacing hand production. It raised output and changed where and how people lived, but brought crowded cities and harsh working conditions.", "oracle"], ["u-human-14", "human", "American Civil War", "The US Civil War lasted from 1861 to 1865, fought mainly over slavery and states' power. President Lincoln's Emancipation Proclamation took effect on January 1, 1863, and the 13th Amendment abolished slavery after the war.", "oracle"], ["u-human-15", "human", "World War I", "World War I ran from 1914 to 1918 and pulled in much of the world. It introduced trench warfare and new weapons, killed millions and left unresolved tensions that helped lead to the next world war.", "oracle"], ["u-human-16", "human", "World War II", "World War II lasted from 1939 to 1945 and was the deadliest conflict in history. It included the Holocaust, the genocide of six million Jews, and ended with the Allied victory and the founding of the United Nations.", "oracle"], ["u-human-17", "human", "The Cold War", "From about 1947 to 1991 the United States and the Soviet Union competed without direct war, through an arms race, the space race and proxy conflicts. It ended when the Soviet Union dissolved in December 1991.", "oracle"], ["u-human-18", "human", "Civil rights movement", "In 1954 Brown v. Board of Education ruled school segregation unconstitutional. Boycotts, marches and sit-ins followed, including the 1963 March on Washington where Martin Luther King Jr. gave his I Have a Dream speech.", "oracle"], ["u-human-19", "human", "Women's suffrage in the US", "After decades of campaigning, the 19th Amendment, ratified in 1920, guaranteed American women the right to vote. Many Black women and other women of color still faced barriers until the Voting Rights Act of 1965.", "oracle"], ["u-human-20", "human", "The internet's history", "ARPANET, a research network, sent its first message in 1969. Tim Berners-Lee proposed the World Wide Web in 1989, and by the 1990s the browser put the internet in ordinary homes.", "oracle"], ["u-mh-1", "mh", "Box breathing", "Breathe in for four counts, hold for four, breathe out for four and hold for four. Repeat a few rounds. Slow, even breathing signals the body to calm down, and it can help in moments of stress or before something nerve-wracking.", "aurora"], ["u-mh-2", "mh", "5-4-3-2-1 grounding", "When your mind is racing, name five things you can see, four you can touch, three you can hear, two you can smell and one you can taste. It pulls attention back to the present moment.", "aurora"], ["u-mh-3", "mh", "Talking to someone", "Telling a trusted person how you feel can lighten the load. You do not need perfect words. Start with I have had a rough time lately, and let them respond. If it is hard, text first.", "aurora"], ["u-mh-4", "mh", "Types of therapy", "Talk therapy comes in many forms. CBT helps change unhelpful thought and behavior patterns, DBT adds skills for strong emotions, and other approaches focus on relationships or past experience. A good fit with the therapist matters a lot.", "aurora"], ["u-mh-5", "mh", "Journaling", "Writing down thoughts for a few minutes can make them clearer and less heavy. You do not have to write well. Try three lines about what happened, how you felt and one small thing that could help.", "aurora"], ["u-mh-6", "mh", "Self-compassion", "Self-compassion means treating yourself the way you would treat a good friend who is struggling. Notice the harsh voice, remind yourself that everyone has hard times and ask what you need right now.", "aurora"], ["u-mh-7", "mh", "Low-energy days", "On very low days, aim for tiny wins: drink water, get fresh air, eat something and message one person. Small steps still count. If low days keep stacking up for weeks, consider talking to a professional.", "aurora"], ["u-mh-8", "mh", "Reaching out for help", "If you ever feel unsafe or think about hurting yourself, contact emergency services or a crisis line right away. In the US you can call or text 988. Elsewhere findahelpline.com lists local lines. You deserve support and you do not have to handle it alone.", "aurora"], ["u-cats-19", "cats", "Cat sounds", "Adult cats mostly meow to talk to people, not to each other. A trill or chirp is a friendly greeting, a chatter at birds shows excitement, and a hiss or growl is a clear warning to back off. Loud yowling at night can signal pain, stress or a health problem.", "panther"], ["u-cats-20", "cats", "Caring for senior cats", "Cats over about 10 need vet checkups twice a year. Watch for weight loss, drinking more, stiffness, bad breath and litter box changes. Low-sided boxes, soft beds and easy access to food and water help older joints.", "panther"], ["u-cats-21", "cats", "Feeding amounts", "Check the food label for a starting amount and adjust by your cat's body shape. You should feel ribs under a thin layer of fat. Two or more small meals a day work for most adults. Obesity raises the risk of diabetes and arthritis.", "panther"], ["u-cats-22", "cats", "Microchips and ID", "A microchip, about the size of a rice grain, is placed under the skin and holds an ID number linked to your contact info. It can bring a lost cat home. Keep your details updated with the chip company and add a collar tag too.", "panther"], ["u-cats-23", "cats", "Popular breeds", "Maine Coons are large and gentle, Siamese are talkative and social, Ragdolls are calm and floppy when held, and Bengals are active and love to climb. Most cats are mixed breed domestic shorthairs with personalities as varied as people.", "panther"], ["u-cats-24", "cats", "Fleas and parasites", "Fleas cause itching, and cats can also pick up worms and ear mites. Ask a vet for a safe monthly preventive. Never use a dog flea product on a cat because some ingredients are dangerous to cats.", "panther"], ["u-cats-25", "cats", "Dental care", "Many adult cats have some dental disease. Brushing with cat-safe toothpaste helps, and vets can clean teeth under anesthesia. Bad breath, drooling or dropping food can be signs of a painful mouth.", "panther"], ["u-cats-26", "cats", "Cat-safe plants", "Spider plants, cat grass and catnip are safe and cats often enjoy them. Lilies, sago palms and many others are toxic. Before bringing a plant home, check a trusted pet-safe plant list.", "panther"], ["u-cats-27", "cats", "Cats and children", "Teach kids to pet gently, avoid tails and bellies, and let the cat walk away. Supervise young children. A cat with a place to retreat, like a high shelf or a quiet room, stays calmer around busy homes.", "panther"], ["u-cats-28", "cats", "Cat fears", "Loud noises like vacuums, fireworks and thunder frighten many cats. Give them a quiet hiding spot, close curtains and play soft music. Never punish a scared cat, which makes things worse.", "panther"], ["u-code-20", "code", "Everyday Git commands", "git clone copies a repository, git add stages changes, git commit saves a snapshot, git push uploads it and git pull downloads new changes. Use git status often to see what is going on, and write clear commit messages.", "titan"], ["u-code-21", "code", "Print versus debugger", "Printing values is a quick way to see what code is doing. A debugger lets you pause code, step line by line and look at every variable. Learn both, and remove leftover prints before sharing code.", "titan"], ["u-code-22", "code", "Sorting algorithms", "Simple sorts like bubble sort are easy to understand but slow on big lists. Built-in sort functions use faster methods, around n log n. In real projects use the built-in sort unless you have a special reason.", "titan"], ["u-code-23", "code", "Stack and queue", "A stack is last in, first out, like a pile of plates, and the undo feature in many apps uses one. A queue is first in, first out, like a line at a store, and print jobs use one.", "titan"], ["u-code-24", "code", "Web accessibility", "Make pages work for everyone. Add alt text to images, use enough color contrast, make everything usable with a keyboard and label form fields. These steps also help search engines and people on small screens.", "titan"], ["u-code-25", "code", "Responsive design", "Add the viewport meta tag, use flexible layouts like flexbox and grid, and test on a phone-size screen. Design for small screens first, then add rules for bigger ones with media queries.", "titan"], ["u-code-26", "code", "Open source licenses", "A license tells others what they can do with code. The MIT license is short and very permissive. The GPL requires derived work to stay open too. Without any license, others generally cannot legally reuse your code.", "titan"], ["u-code-27", "code", "Learning to code", "Build small projects you care about, like a quiz or a budget tracker, instead of only watching tutorials. Read error messages, search for solutions and keep going. Consistent short practice beats occasional long sessions.", "titan"], ["u-code-28", "code", "SQL basics", "SQL talks to databases. SELECT reads rows, INSERT adds them, UPDATE changes them and DELETE removes them. A WHERE clause filters which rows. Always back up before running a command that
