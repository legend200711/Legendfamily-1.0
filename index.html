<style>

nav{display:flex;border-top:1px solid var(--line);background:rgba(4,11,18,.92)}

.strip,.box{border:1px solid var(--line);background:var(--pn);border-radius:6px;padding:10px 12px;margin-bottom:12px;font-size:14px}

.p{--c:var(--b);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,transparent),transparent 75%);border-radius:6px;padding:14px;margin-bottom:14px;text-align:center;box-shadow:0 0 16px color-mix(in srgb,var(--c) 16%,transparent)}

.box button.sm{border-color:var(--line);background:transparent;color:var(--ink);padding:6px 10px;margin:6px 6px 0 0;font-weight:500}

#log{min-height:40vh}
.m{max-width:88%;padding:9px 13px;border-radius:8px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.u{margin-left:auto;background:var(--g);color:#02150d}
.a{background:var(--pn);border:1px solid var(--line);border-left:3px solid var(--b)}

input[type=checkbox]{width:auto;margin:0 6px 0 0}
.row input{margin:0}
textarea{min-height:90px}
label{display:block;color:var(--mute);font-size:13px;margin-top:6px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;margin-right:6px;color:var(--mute)}
.tag.pending{color:var(--warn);border-color:var(--warn)}
.tag.approved,.tag.shared{color:var(--g);border-color:var(--g)}
.tag.rejected{color:var(--bad);border-color:var(--bad)}
.wide{overflow-x:auto}
table{border-collapse:collapse;font-size:12px;width:100%}
td,th{border:1px solid var(--line);padding:4px;text-align:center}

.sw{transform-box:fill-box;transform-origin:center;animation:spin 16s linear infinite}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

.nn{margin:2px 0 0;font:800 17px/1 "Arial Narrow",Impact,sans-serif;letter-spacing:.18em;color:var(--c)}
.rl{margin:6px 0 0;font-size:12px;font-weight:700}
.qt{margin:4px 0;font-size:11px;font-style:italic;color:var(--mute);flex:1}
.wk{margin:4px 0 8px;font-size:10px;color:var(--mute);letter-spacing:.06em}
.p2 button{border:1px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);border-radius:3px;padding:9px 4px;font:700 12px system-ui,sans-serif;letter-spacing:.04em}
.foot{text-align:center;margin:14px 0 0;font-size:12px;color:var(--mute)}
.hb{display:flex;align-items:center;gap:10px;text-align:left}
.hb>div{flex:1;min-width:0}
.hb h1{font-size:20px;letter-spacing:.18em}
.hb p{letter-spacing:.06em}
.hb button{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:4px;padding:8px 12px;font:600 13px system-ui,sans-serif}
.hb button[aria-label]{border:0;padding:0 6px;color:var(--g);font:700 32px/1 system-ui,sans-serif}
#v.cm{display:flex;flex-direction:column;overflow:hidden}
#v.cm #log{flex:1;min-height:0;overflow-y:auto}
.gbtn{width:100%;margin-bottom:12px;border:1px solid var(--g);background:rgba(56,242,166,.12);color:var(--g);border-radius:4px;padding:13px;font:700 15px system-ui,sans-serif;letter-spacing:.06em}
.gc{margin-top:8px;padding-bottom:0}
.fbk{margin-top:6px}
.fbk button{border:0;background:transparent;font-size:16px;opacity:.55;padding:2px 8px}
.fbk button[aria-pressed="true"]{opacity:1}
.row button[aria-pressed="true"]{background:var(--g);color:#02150d}
#nn{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.5}
header,main,nav{position:relative;z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sw,.sw2{animation:none}}
#inst{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;border:1px solid var(--g);background:#042a22;color:var(--g);border-radius:999px;padding:12px 18px;font:700 14px system-ui,sans-serif;box-shadow:0 0 16px rgba(56,242,166,.35)}

["mh","Depression basics","Depression is more than sadness. It can bring lasting low mood, loss of interest, tiredness and changes in sleep or appetite. It is common and treatable. A licensed professional can assess it; this library offers education only."],
["mh","Anxiety basics","Anxiety is the body\u2019s alarm system. It becomes a problem when worry is constant or hard to control. Slow breathing, regular sleep, less caffeine and talking to a professional can all help."],
["mh","Overthinking","Overthinking is looping on the same worries. Try writing the thought down, naming what you can control, and setting a short time to decide or let go."],
["mh","Grief","Grief has no fixed timeline or order. Sadness, anger, numbness and relief can all appear. Support from others and gentle routines help; ongoing difficulty functioning is a reason to seek professional support."],
["mh","Boundaries","A boundary is a clear statement of what you will and won\u2019t accept. Say it calmly, keep it short and follow through."],
["mh","Recognizing a crisis","Warning signs include talk of wanting to die, hopelessness, giving belongings away, or sudden calm after deep despair. Take it seriously, stay with the person, and contact local emergency services or a crisis line. In the US, call or text 988."],
["mh","How to support someone","Listen without fixing, ask open questions, avoid judging, and encourage professional help. You are not their therapist, and caring for yourself matters too."],

["tech","Basic troubleshooting","Restart, check cables and power, update drivers, change one thing at a time and note what you changed."],

const SEED2=[["t-cats-1", "cats", "Slow blink", "A slow blink from a relaxed cat is a friendly signal. Blink slowly back at it and look away softly. Staring straight at a cat can feel like a challenge.", "panther"], ["t-cats-2", "cats", "Why cats purr", "Cats purr when content, but also when stressed, scared or hurting, as a way to self-soothe. Judge the mood from the body: relaxed eyes and loose posture mean happy, flat ears and a tucked tail mean worried.", "panther"], ["t-cats-3", "cats", "Toxic to cats", "Lilies are extremely dangerous to cats; even pollen or vase water can cause kidney failure. Also toxic: onions, garlic, chocolate, grapes and raisins, antifreeze, and human pain medicine like acetaminophen. Call a vet or pet poison hotline right away if a cat eats any of these.", "panther"], ["t-cats-4", "cats", "Litter box rules", "Keep one litter box per cat plus one extra, scoop daily and put boxes in quiet spots away from food. A cat that suddenly avoids the box may have a medical problem, so check with a vet.", "panther"], ["t-cats-5", "cats", "Scratching is normal", "Scratching stretches muscles, marks territory and keeps claws healthy. Give sturdy scratching posts tall enough to stretch on. Declawing is surgery that removes the last bone of each toe and is not recommended.", "panther"], ["t-cats-6", "cats", "When a cat stops eating", "Cats are obligate carnivores and need meat for nutrients like taurine. A cat that refuses food for a day or two should see a vet, because fasting can cause serious liver trouble in cats.", "panther"], ["t-code-1", "code", "Read the error bottom-up", "In a Python traceback the last line names the error and the lines above show where it happened. Read the last line first, then the line number it points to.", "titan"], ["t-code-2", "code", "Debugging method", "Reproduce the bug, shrink it to the smallest example, change one thing at a time and check your assumptions with prints or a debugger. Explaining the problem out loud to a rubber duck often reveals it.", "titan"], ["t-code-3", "code", "Never commit secrets", "API keys and passwords must never go in code that is public or sent to a browser. Anyone can read a web page source. Keep keys on a server or in environment variables, and rotate any key that leaked.", "titan"], ["t-code-4", "code", "Git basics", "Git saves snapshots called commits. Commit small and often with clear messages, use branches for experiments, and merge when the work is tested. A commit can be undone, uncommitted work cannot.", "titan"], ["t-code-5", "code", "Big O in one minute", "O(1) takes the same time no matter the size, O(n) grows with the list, and O(n squared) grows fast with nested loops. Pick the simplest correct solution first and optimize only when it is too slow.", "titan"], ["t-code-6", "code", "Parameterized queries", "Never build database queries by gluing user text into a string, because that allows SQL injection. Use parameterized queries so user input is treated as data, never as code.", "titan"], ["t-elec-1", "elec", "Ohm’s law", "Voltage equals current times resistance (V = I x R). Power equals voltage times current (P = V x I). Know any two values and you can find the third.", "pepper"], ["t-elec-2", "elec", "LED resistor", "An LED needs a resistor to limit current. Resistor = (supply voltage minus LED voltage) divided by current. Example: 5 V supply, 2 V LED, 20 mA gives 150 ohms.", "pepper"], ["t-elec-3", "elec", "Multimeter safety", "Choose the right mode and range before touching a circuit. Measure resistance only with power off. Large capacitors can hold a charge after unplugging, so never open a power supply or old CRT.", "pepper"], ["t-elec-4", "elec", "PC will not turn on", "Check the wall outlet, power cable and the switch on the power supply. Then reseat the RAM, unplug extra drives and cards, and try with only the essentials. Swollen or leaking capacitors mean the board needs repair.", "pepper"], ["t-elec-5", "elec", "Soldering basi const EMR=`aurora|Depression: types and signs|Depression includes major depression, persistent low-grade depression and seasonal patterns. Signs include low mood or emptiness, lost interest, changes in sleep and appetite, fatigue, guilt and trouble concentrating. If it lasts two weeks or more, see a clinician. It is treatable with therapy, medication or both.
aurora|Anxiety disorders|Anxiety disorders include generalized anxiety (constant worry), social anxiety, panic disorder and phobias. Signs include restlessness, a racing heart, muscle tension and avoiding feared situations. Therapy such as CBT works well, and some people also benefit from medication. A clinician can assess what fits.
aurora|Panic attacks|A panic attack is a sudden surge of fear with a pounding heart, short breath and dizziness that peaks within minutes. It feels dangerous but passes. Slow breathing, naming what is happening and grounding with the five senses help. Get chest pain checked to be safe.
aurora|Trauma and PTSD|Trauma can leave the nervous system stuck on alert. PTSD may involve flashbacks, nightmares, avoidance, jumpiness and harsh beliefs after a frightening event. Trauma-focused therapy helps a great deal. Go gently, and work with a trained professional.
aurora|Social anxiety|Social anxiety is intense fear of being judged in social situations. It is more than shyness. It often improves with gradual practice, CBT and swapping thoughts like everyone is watching me for realistic ones.
nova|Bipolar disorder|Bipolar disorder involves mood episodes: mania or hypomania (high energy, little sleep, racing thoughts, risky choices) and depression. Bipolar I includes full mania, bipolar II includes hypomania and depression. It is a medical condition treated with mood stabilizing medication and therapy. Only a clinician can diagnose it.
nova|The stress response|Stress triggers fight, flight or freeze. Adrenaline and cortisol raise heart rate and sharpen focus. Short bursts help, but long-term stress wears on sleep, mood and health. Slow breathing, movement and rest let the body switch the alarm off.
nova|Sleep and mood|Sleep and mood affect each other. Poor sleep raises irritability and anxiety and can worsen depression. A steady schedule, a dark cool room, less late caffeine and screens off before bed help. Ongoing insomnia deserves a doctor’s attention.
oracle|Paranoia|Paranoia is persistent suspicion that others mean harm without enough evidence. It can come from stress, lack of sleep, substances, trauma, or conditions such as paranoid personality disorder or psychosis. Mild suspicion is common. If the thoughts feel convincing, frightening or disrupt life, talk to a clinician. Checking facts gently with someone you trust helps.
oracle|Stoic view of emotions|Stoic philosophy separates what you control, like your judgments and actions, from what you do not. Feelings are not wrong, but you can examine the thought behind them. Epictetus taught that we are disturbed more by our views of events than by the events themselves.
oracle|Hope and meaning|Viktor Frankl, a psychiatrist who survived the Nazi camps, argued that meaning helps people endure suffering. Small purposes, relationships and values can support hope in dark times. Hope grows through small steps, not only through feeling.
oracle|How treatment of mental illness changed|For centuries people with mental illness were hidden or mistreated in asylums. Modern care grew from 19th century reforms, medications from the 1950s, community care and talk therapy. Stigma has fallen but remains. Today treatment is evidence-based and recovery is expected.
legend|Burnout|Burnout is long-term exhaustion from chronic stress, with cynicism and a sense of being ineffective. It is not laziness. Recovery needs rest, boundaries, a lighter workload, support and sometimes changing the situation. If it deepens into hopelessness, see a professional.
legend|Decision fatigue|Making many decisions drains mental energy and leads to worse or avoided choices. Reduce it by deciding important things early in the day, using routines, limiting options and setting rules ahead of time.
legend|Resilience|Resilience is adapting well after stress. It grows from supportive relationships, realistic optimism, flexible thinking, healthy habits and learning from setbacks. It is built, not inborn, and asking for help is part of it.
titan|Doomscrolling and screen time|Doomscrolling is compulsively reading bad news, which can raise anxiety and hurt sleep. Set time limits, turn off non-essential notifications, pick fixed times for news and keep phones out of the bedroom.
titan|Mood tracking|Tracking mood, sleep and activity in a notes app can reveal patterns, like poor sleep before low days. Keep it simple: a score from 1 to 10 and a few words. Share the log with a clinician if you see one.
titan|Social media comparison|People post highlights, so comparing your life to feeds can fuel envy and low self-worth. Curate who you follow, take breaks and remember that what you see is edited.
pepper|Imposter syndrome|Imposter syndrome is feeling like a fraud despite real achievements, and it is common in high performers. Keep a record of wins, share the feeling with peers and treat mistakes as data. Skills are built, not just proven.
pepper|Perfectionism|Perfectionism sets standards so high that nothing feels good enough, and it often causes procrastination and anxiety. Aim for good enough, set time limits and judge effort as well as results.
pepper|OCD basics|Obsessive-compulsive disorder involves unwanted intrusive thoughts and repeated rituals done to ease distress. It is far more than being neat. Exposure and response prevention is the leading therapy, sometimes with medication.
vex|Music and mood|Music can change mood, release tension and help people process feelings. Upbeat tracks lift energy, slow tempos calm, and lyrics you relate to can help you feel understood. Music therapy is used alongside treatment.
vex|Stage fright|Performance anxiety causes shaking, a dry mouth and racing thoughts. Prepare well, practice in front of friends, breathe slowly and reframe nerves as excitement. Many great performers feel it every time.
vex|Creative blocks|Creative blocks often come from fear of judgment, perfectionism or exhaustion. Try small daily sessions, make bad drafts on purpose, change your setting and rest. A long block with low mood is worth talking about with someone.
vex|Sad songs and nostalgia|Sad songs can comfort by validating feelings. Nostalgia is a mix of warmth and longing that often boosts connection. If music keeps you stuck replaying the same worries, balance it with other activities.
elite|Financial anxiety|Money worry is a leading cause of stress. Helpful steps are knowing your numbers, making a simple budget, building a small emergency fund and paying the highest-interest debt first. Free credit counseling exists.
elite|Emotional spending|Buying to soothe stress gives a short lift and often regret. Wait 24 hours before non-essential purchases, notice the feeling behind the urge and find other comforts.
elite|Gratitude|Writing down three things you appreciate each day modestly improves mood over time. It works best as a habit with specific details, not forced positivity.
midnight|Loneliness and solitude|Loneliness is wanting more connection than you have, while solitude is chosen time alone. Loneliness affects health, so small steps help: one message, one shared activity. Quality of connection matters more than quantity.
midnight|Anger|Anger is a normal signal that a boundary was crossed. It becomes a problem when it explodes or is bottled up. Pause, breathe, name what is underneath it and act after the heat passes.
midnight|Emotional numbness|Feeling nothing can follow stress, trauma or depression as the mind protects itself. Gentle routines, movement and talking to someone help. If numbness lasts, a clinician can help.
luna|Exercise and mood|Regular movement reduces symptoms of anxiety and depression and improves sleep. Even a 10 minute walk helps. Pick something you enjoy and build gradually.
luna|Motivation and procrastination|Procrastination is usually avoiding a feeling, not laziness. Start with a two-minute step, remove friction and reward progress. Low energy that lasts for weeks may point to depression.
luna|Self-talk and confidence|Harsh self-talk drains confidence. Notice the voice, ask what you would say to a friend and swap in fair, specific statements. Confidence grows from keeping small promises to yourself.
simba|Mania and hypomania|Mania is an extreme high with little need for sleep, fast speech, grand ideas and risky choices. Hypomania is milder. Both can be part of bipolar disorder. Seek urgent help if safety is at risk.
simba|ADHD and impulsivity|ADHD involves differences in attention, restlessness and impulse control that start in childhood and can last into adulthood. Routines, timers, breaking tasks into steps and sometimes medication help. A professional evaluation is needed.
simba|Humor as coping|Humor can reduce stress and help people bond. It helps most when it is kind and not used to dodge feelings that need attention.
panther|Pets and wellbeing|Pets can ease loneliness, add routine and lower stress. Caring for a cat or dog gives structure and affection, though pets do not replace professional care.
panther|Pet loss grief|Grief after losing a pet is real and can be intense. Allow yourself to mourn, make a ritual or keepsake and talk with people who understand. Pet loss support groups exist.
panther|Driving anxiety and road rage|Driving anxiety can follow an accident or a fear of losing control, and gradual practice in quiet places helps. Road rage is anger behind the wheel: leave early, breathe and do not engage with aggressive drivers.`;
