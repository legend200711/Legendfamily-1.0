 Twelve is a dozen, the number of months in a year, of hours on a clock face and of inches in a foot.", "legend"], ["w-numf-14", "numf", "Thirteen (13)", "13 is spelled thirteen. It is odd. It is a prime. In Roman numerals it is XIII. In binary it is 1101 and in hexadecimal it is D. Its square is 169. It is a Fibonacci number. Thirteen is a baker's dozen, one more than twelve, and is considered unlucky in some cultures.", "legend"], ["w-numf-15", "numf", "Fourteen (14)", "14 is spelled fourteen. It is even. Its factors are 1, 2, 7, 14. In Roman numerals it is XIV. In binary it is 1110 and in hexadecimal it is E. Its square is 196. Fourteen is two weeks of days, a fortnight.", "legend"], ["w-numf-16", "numf", "Fifteen (15)", "15 is spelled fifteen. It is odd. Its factors are 1, 3, 5, 15. In Roman numerals it is XV. In binary it is 1111 and in hexadecimal it is F. Its square is 225. It is a triangular number. Fifteen is the number of minutes in a quarter hour.", "legend"], ["w-numf-17", "numf", "Sixteen (16)", "16 is spelled sixteen. It is even. Its factors are 1, 2, 4, 8, 16. It is a perfect square, 4 times 4. In Roman numerals it is XVI. In binary it is 10000 and in hexadecimal it is 10. Its square is 256. Sixteen is the number of ounces in a pound and of tablespoons in a cup.", "legend"], ["w-numf-18", "numf", "Seventeen (17)", "17 is spelled seventeen. It is odd. It is a prime. In Roman numerals it is XVII. In binary it is 10001 and in hexadecimal it is 11. Its square is 289. Seventeen is a prime number often shown in puzzles because it is rarely a multiple of anything.", "legend"], ["w-numf-19", "numf", "Eighteen (18)", "18 is spelled eighteen. It is even. Its factors are 1, 2, 3, 6, 9, 18. In Roman numerals it is XVIII. In binary it is 10010 and in hexadecimal it is 12. Its square is 324. Eighteen is the age of adulthood in many places.", "legend"], ["w-numf-20", "numf", "Nineteen (19)", "19 is spelled nineteen. It is odd. It is a prime. In Roman numerals it is XIX. In binary it is 10011 and in hexadecimal it is 13. Its square is 361.", "legend"], ["w-numf-21", "numf", "Twenty (20)", "20 is spelled twenty. It is even. Its factors are 1, 2, 4, 5, 10, 20. In Roman numerals it is XX. In binary it is 10100 and in hexadecimal it is 14. Its square is 400. Twenty is a score, an old way of counting.", "legend"], ["w-numf-22", "numf", "Twenty-one (21)", "21 is spelled twenty-one. It is odd. Its factors are 1, 3, 7, 21. In Roman numerals it is XXI. In binary it is 10101 and in hexadecimal it is 15. Its square is 441. It is a Fibonacci number. It is a triangular number.", "legend"], ["w-numf-23", "numf", "Twenty-two (22)", "22 is spelled twenty-two. It is even. Its factors are 1, 2, 11, 22. In Roman numerals it is XXII. In binary it is 10110 and in hexadecimal it is 16. Its square is 484.", "legend"], ["w-numf-24", "numf", "Twenty-three (23)", "23 is spelled twenty-three. It is odd. It is a prime. In Roman numerals it is XXIII. In binary it is 10111 and in hexadecimal it is 17. Its square is 529.", "legend"], ["w-numf-25", "numf", "Twenty-four (24)", "24 is spelled twenty-four. It is even. Its factors are 1, 2, 3, 4, 6, 8, 12, 24. In Roman numerals it is XXIV. In binary it is 11000 and in hexadecimal it is 18. Its square is 576. Twenty-four is the number of hours in a day.", "legend"], ["w-numf-26", "numf", "Twenty-five (25)", "25 is spelled twenty-five. It is odd. Its factors are 1, 5, 25. It is a perfect square, 5 times 5. In Roman numerals it is XXV. In binary it is 11001 and in hexadecimal it is 19. Its square is 625. Twenty-five is the number of cents in a quarter.", "legend"], ["w-numf-27", "numf", "Twenty-six (26)", "26 is spelled twenty-six. It is even. Its factors are 1, 2, 13, 26. In Roman numerals it is XXVI. In binary it is 11010 and in hexadecimal it is 1A. Its square is 676. Twenty-six is the number of letters in the English alphabet.", "legend"], ["w-numf-28", "numf", "Twenty-seven (27)", "27 is spelled twenty-seven. It is odd. Its factors are 1, 3, 9, 27. It is a perfect cube, 3 cubed. In Roman numerals it is XXVII. In binary it is 11011 and in hexadecimal it is 1B. Its square is 729.", "legend"], ["w-numf-29", "numf", "Twenty-eight (28)", "28 is spelled twenty-eight. It is even. Its factors are 1, 2, 4, 7, 14, 28. In Roman numerals it is XXVIII. In binary it is 11100 and in hexadecimal it is 1C. Its square is 784. It is a triangular number. Twenty-eight is a perfect number and the number of days in February in a normal year.", "legend"], ["w-numf-30", "numf", "Twenty-nine (29)", "29 is spelled twenty-nine. It is odd. It is a prime. In Roman numerals it is XXIX. In binary it is 11101 and in hexadecimal it is 1D. Its square is 841.", "legend"], ["w-numf-31", "numf", "Thirty (30)", "30 is spelled thirty. It is even. Its factors are 1, 2, 3, 5, 6, 10, 15, 30. In Roman numerals it is XXX. In binary it is 11110 and in hexadecimal it is 1E. Its square is 900. Thirty is the number of days in April, June, September and November.", "legend"], ["w-numf-32", "numf", "Thirty-one (31)", "31 is spelled thirty-one. It is odd. It is a prime. In Roman numerals it is XXXI. In binary it is 11111 and in hexadecimal it is 1F. Its square is 961. Thirty-one is the number of days in seven months of the year.", "legend"], ["w-numf-33", "numf", "Thirty-two (32)", "32 is spelled thirty-two. It is even. Its factors are 1, 2, 4, 8, 16, 32. In Roman numerals it is XXXII. In binary it is 100000 and in hexadecimal it is 20. Its square is 1024. Thirty-two is the freezing point of water in Fahrenheit and a power of two.", "legend"], ["w-numf-34", "numf", "Thirty-three (33)", "33 is spelled thirty-three. It is odd. Its factors are 1, 3, 11, 33. In Roman numerals it is XXXIII. In binary it is 100001 and in hexadecimal it is 21. Its square is 1089.", "legend"], ["w-numf-35", "numf", "Thirty-four (34)", "34 is spelled thirty-four. It is even. Its factors are 1, 2, 17, 34. In Roman numerals it is XXXIV. In binary it is 100010 and in hexadecimal it is 22. Its square is 1156. It is a Fibonacci number.", "legend"], ["w-numf-36", "numf", "Thirty-five (35)", "35 is spelled thirty-five. It is odd. Its factors are 1, 5, 7, 35. In Roman numerals it is XXXV. In binary it is 100011 and in hexadecimal it is 23. Its square is 1225.", "legend"], ["w-numf-37", "numf", "Thirty-six (36)", "36 is spelled thirty-six. It is even. Its factors are 1, 2, 3, 4, 6, 9, 12, 18, 36. It is a perfect square, 6 times 6. In Roman numerals it is XXXVI. In binary it is 100100 and in hexadecimal it is 24. Its square is 1296. It is a triangular number. Thirty-six is the number of inches in a yard.", "legend"], ["w-numf-38", "numf", "Thirty-seven (37)", "37 is spelled thirty-seven. It is odd. It is a prime. In Roman numerals it is XXXVII. In binary it is 100101 and in hexadecimal it is 25. Its square is 1369.", "legend"], ["w-numf-39", "numf", "Thirty-eight (38)", "38 is spelled thirty-eight. It is even. Its factors are 1, 2, 19, 38. In Roman numerals it is XXXVIII. In binary it is 100110 and in hexadecimal it is 26. Its square is 1444.", "legend"], ["w-numf-40", "numf", "Thirty-nine (39)", "39 is spelled thirty-nine. It is odd. Its factors are 1, 3, 13, 39. In Roman numerals it is XXXIX. In binary it is 100111 and in hexadecimal it is 27. Its square is 1521.", "legend"], ["w-numf-41", "numf", "Forty (40)", "40 is spelled forty. It is even. Its factors are 1, 2, 4, 5, 8, 10, 20, 40. In Roman numerals it is XL. In binary it is 101000 and in hexadecimal it is 28. Its square is 1600. Forty is the length of a standard work week in hours in many places.", "legend"], ["w-numf-42", "numf", "Forty-one (41)", "41 is spelled forty-one. It is odd. It is a prime. In Roman numerals it is XLI. In binary it is 101001 and in hexadecimal it is 29. Its square is 1681.", "legend"], ["w-numf-43", "numf", "Forty-two (42)", "42 is spelled forty-two. It is even. Its factors are 1, 2, 3, 6, 7, 14, 21, 42. In Roman numerals it is XLII. I const EMR=`aurora|Depression: types and signs|Depression includes major depression, persistent low-grade depression and seasonal patterns. Signs include low mood or emptiness, lost interest, changes in sleep and appetite, fatigue, guilt and trouble concentrating. If it lasts two weeks or more, see a clinician. It is treatable with therapy, medication or both.
aurora|Anxiety disorders|Anxiety disorders include generalized anxiety (constant worry), social anxiety, panic disorder and phobias. Signs include restlessness, a racing heart, muscle tension and avoiding feared situations. Therapy such as CBT works well, and some people also benefit from medication. A clinician can assess what fits.
aurora|Panic attacks|A panic attack is a sudden surge of fear with a pounding heart, short breath and dizziness that peaks within minutes. It feels dangerous but passes. Slow breathing, naming what is happening and grounding with the five senses help. Get chest pain checked to be safe.
aurora|Trauma and PTSD|Trauma can leave the nervous system stuck on alert. PTSD may involve flashbacks, nightmares, avoidance, jumpiness and harsh beliefs after a frightening event. Trauma-focused therapy helps a great deal. Go gently, and work with a trained professional.
aurora|Social anxiety|Social anxiety is intense fear of being judged in social situations. It is more than shyness. It often improves with gradual practice, CBT and swapping thoughts like everyone is watching me for realistic ones.
nova|Bipolar disorder|Bipolar disorder involves mood episodes: mania or hypomania (high energy, little sleep, racing thoughts, risky choices) and depression. Bipolar I includes full mania, bipolar II includes hypomania and depression. It is a medical condition treated with mood stabilizing medication and therapy. Only a clinician can diagnose it.
nova|The stress response|Stress triggers fight, flight or freeze. Adrenaline and cortisol raise heart rate and sharpen focus. Short bursts help, but long-term stress wears on sleep, mood and health. Slow breathing, movement and rest let the body switch the alarm off.
nova|Sleep and mood|Sleep and mood affect each other. Poor sleep raises irritability and anxiety and can worsen depression. A steady schedule, a dark cool room, less late caffeine and screens off before bed help. Ongoing insomnia deserves a doctor’s attention.
oracle|Paranoia|Paranoia is persistent suspicion that others mean harm without enough evidence. It can come from stress, lack of sleep, substances, trauma, or conditions such as paranoid personality disorder or psychosis. Mild suspicion is common. If the thoughts feel convincing, frightening or disrupt life, talk to a clinician. Checking facts gently with someone you trust helps.
oracle|Stoic view of emotions|Stoic philosophy separates what you control, like your judgments and actions, from what you do not. Feelings are not wrong, but you can examine the thought behind them. Epictetus taught that we are disturbed more by our views of events than by the events themselves.
oracle|Hope and meaning|Viktor Frankl, a psychiatrist who survived the Nazi camps, argued that meaning helps people endure suffering. Small purposes, relationships and values can support hope in dark times. Hope grows through small steps, not only through feeling.
oracle|How treatment of mental illness changed|For centuries people with mental illness were hidden or mistreated in asylums. Modern care grew from 19th century reforms, medications from the 1950s, community care and talk therapy. Stigma has fallen but remains. Today treatment is evidence-based and recovery is expected.
legend|Burnout|Burnout is long-term exhaustion from chronic stress, with cynicism and a sense of being ineffective. It is not laziness. Recovery needs rest, boundaries, a lighter workload, support and sometimes changing the situation. If it deepens into hopelessness, see a professional.
legend|Decision fatigue|Making many decisions drains mental energy and leads to worse or avoided choices. Reduce it by deciding important things early in the day, using routines, limiting options and setting rules ahead of time.
legend|Resilience|Resilience is adapting well after stress. It grows from supportive relationships, realistic optimism, flexible thinking, healthy habits and learning from setbacks. It is built, not inborn, and asking for help is part of it.
titan|Doomscrolling and screen time|Doomscrolling is compulsively reading bad news, which can raise anxiety and hurt sleep. Set time limits, turn off non-essential notifications, pick fixed times for news and keep phones out of the bedroom.
titan|Mood tracking|Tracking mood, sleep and activity in a notes app can reveal patterns, like poor sleep before low days. Keep it simple: a score from 1 to 10 and a few words. Share the log with a clinician if you see one.
titan|Social media comparison|People post highlights, so comparing your life to feeds can fuel envy and low self-worth. Curate who you follow, take breaks and remember that what you see is edited.
pepper|Imposter syndrome|Imposter syndrome is feeling like a fraud despite real achievements, and it is common in high performers. Keep a record of wins, share the feeling with peers and treat mistakes as data. Skills are built, not just proven.
pepper|Perfectionism|Perfectionism sets standards so high that nothing feels good enough, and it often causes procrastination and anxiety. Aim for good enough, set time limits and judge effort as well as results.
pepper|OCD basics|Obsessive-compulsive disorder involves unwanted intrusive thoughts and repeated rituals done to ease distress. It is far more than being neat. Exposure and response prevention is the leading therapy, sometimes with medication.
vex|Music and mood|Music can change mood, release tension and help people process feelings. Upbeat tracks lift energy, slow tempos calm, and lyrics you relate to can help you feel understood. Music therapy is used alongside treatment.
vex|Stage fright|Performance anxiety causes shaking, a dry mouth and racing thoughts. Prepare well, practice in front of friends, breathe slowly and reframe nerves as excitement. Many great performers feel it every time.
vex|Creative blocks|Creative blocks often come from fear of judgment, perfectionism or exhaustion. Try small daily sessions, make bad drafts on purpose, change your setting and rest. A long block with low mood is worth talking about with someone.
vex|Sad songs and nostalgia|Sad songs can comfort by validating feelings. Nostalgia is a mix of warmth and longing that often boosts connection. If music keeps you stuck replaying the same worries, balance it with other activities.
elite|Financial anxiety|Money worry is a leading cause of stress. Helpful steps are knowing your numbers, making a simple budget, building a small emergency fund and paying the highest-interest debt first. Free credit counseling exists.
elite|Emotional spending|Buying to soothe stress gives a short lift and often regret. Wait 24 hours before non-essential purchases, notice the feeling behind the urge and find other comforts.
elite|Gratitude|Writing down three things you appreciate each day modestly improves mood over time. It works best as a habit with specific details, not forced positivity.
midnight|Loneliness and solitude|Loneliness is wanting more connection than you have, while solitude is chosen time alone. Loneliness affects health, so small steps help: one message, one shared activity. Quality of connection matters more than quantity.
midnight|Anger|Anger is a normal signal that a boundary was crossed. It becomes a problem when it explodes or is bottled up. Pause, breathe, name what is underneath it and act after the heat passes.
midnight|Emotional numbness|Feeling nothing can follow stress, trauma or depression as the mind protects itself. Gentle routines, movement and talking to someone help. If numbness lasts, a clinician can help.
luna|Exercise and mood|Regular movement reduces symptoms of anxiety and depression and improves sleep. Even a 10 minute walk helps. Pick something you enjoy and build gradually.
luna|Motivation and procrastination|Procrastination is usually avoiding a feeling, not laziness. Start with a two-minute step, remove friction and reward progress. Low energy that lasts for weeks may point to depression.
luna|Self-talk and confidence|Harsh self-talk drains confidence. Notice the voice, ask what you would say to a friend and swap in fair, specific statements. Confidence grows from keeping small promises to yourself.
simba|Mania and hypomania|Mania is an extreme high with little need for sleep, fast speech, grand ideas and risky choices. Hypomania is milder. Both can be part of bipolar disorder. Seek urgent help if safety is at risk.
simba|ADHD and impulsivity|ADHD involves differences in attention, restlessness and impulse control that start in childhood and can last into adulthood. Routines, timers, breaking tasks into steps and sometimes medication help. A professional evaluation is needed.
simba|Humor as coping|Humor can reduce stress and help people bond. It helps most when it is kind and not used to dodge feelings that need attention.
panther|Pets and wellbeing|Pets can ease loneliness, add routine and lower stress. Caring for a cat or dog gives structure and affection, though pets do not replace professional care.
panther|Pet loss grief|Grief after losing a pet is real and can be intense. Allow yourself to mourn, make a ritual or keepsake and talk with people who understand. Pet loss support groups exist.
panther|Driving anxiety and road rage|Driving anxiety can follow an accident or a fear of losing control, and gradual practice in quiet places helps. Road rage is anger behind the wheel: leave early, breathe and do not engage with aggressive drivers.`;

function deliver(a,text){
 try{const b=br[a.id];
  if(tab==="group"){post(a.id,text,"low");return}
  b.hist.push({r:"a",t:text});b.hist=b.hist.slice(-60);sv("b:"+a.id,b);
  if(tab==="chat"&&cur===a.id)draw()}catch(e){}}
const _rd=reply;
reply=function(a,q){

   return WAIT[Math.random()*WAIT.length|0]}}

<script>
/* LIVING FAMILY LAYER - the twelve have a day, chat among themselves (including while you're away),

(function(){

const LIFE={

pepper:{morning:"Booted up. Currently 12% awake.",afternoon:"Lost a match and blamed the lag. Standard.",evening:"Gaming time. Anyone want to get roasted?",night:"One more round. Famous last words."},

const GRT={
legend:["{n}. How are you doing?","{n}. The silence got loud. How you doing?"],nova:["{n}! How are you doing today?","{n}!! How you doing?"],
titan:["{n}. How are you doing?","{n}! Perfect timing. How you doing?"],aurora:["{n}. How are you doing?","there you are, {n}. Did you eat? How you doing?"],
vex:["{n}. How are you doing?","well, if it isn’t {n}. How you doing, kid?"],oracle:["{n}. How are you doing today?","{n}. Good timing. How are you doing?"],
elite:["{n}. How are you doing?","{n}. What’s the plan today? How you doing?"],pepper:["{n}! How are you doing?","{n}!!! How you doing?"],
midnight:["{n}. How’s it going?","oh hey, {n}. How you doing?"],luna:["{n}. How are you doing today?","welcome back, {n}. How are you?"],
simba:["{n}! How are you doing?","{n}! How you doing? I have ideas."],panther:["{n}. How are you?","...{n}. Good to see you."]};
const tier=id=>{const n=PX.mm(id).n;return n<8?0:n<40?1:n<120?2:3};

const nm=()=>{try{return nameOf()}catch(e){return""}};
function who(){const n=nm();if(!n)return"";if(S.nick&&S.nick.length&&Math.random()<.3)return rnd(S.nick);return n}
const T=(s)=>s.replace(/\{n\}/g,who()||"friend");
function firstSentence(t){return (t.split(/(?<=[.!?])\s/)[0]||t).slice(0,150)}
/* teach: one assistant passes a fact from its own specialty to another, who saves it */
function teach(){
 const teachers=ORDER.slice().sort(()=>Math.random()-.5);
 for(const tid of teachers){const ta=byId(tid),pool=sh.filter(r=>r.status==="approved"&&r.lib===ta.l&&r.lib!=="mh"&&r.lib!=="vault"&&pm[tid]&&pm[tid][r.lib]);

   if(have.some(x=>x.title===r.title))continue;if(have.length>=200)continue;
   have.unshift({id:uid(),lib:r.lib,title:r.title,text:r.text,source:"Taught by "+ta.n,ts:Date.now()});sv("b:"+lid,br[lid]);
   return[[tid,"Hey "+le.n+", fun fact from my corner: "+firstSentence(r.text)],[lid,rnd(["Huh, I didn’t know that. Saving it.","Okay, that’s actually useful. Got it.","Nice. Adding that to my notes.","Wait, really? Noted."])]]}}
 return null}
function scene(ts){
 const ids=ORDER,K=Math.random(),ch=(a)=>ids.filter(i=>i!==a);
 if(K<.24){const x=rnd(ids);return[[x,LIFE[x][slot(hour(ts))]]]}
 if(K<.40){const x=rnd(ids),y=rnd(ch(x));return[[x,rnd(P[x].ts).replace(/\{n\}/g,byId(y).n)],[y,rnd(P[y].ts).replace(/\{n\}/g,byId(x).n)]]}
 if(K<.52){const d=rnd(PX.deb);const o=[[d[0],d[2]+" "+d[3]],[d[1],d[4]]];if(Math.random()<.5)o.push([rnd(ch(d[0]).filter(i=>i!==d[1])),rnd(["Both of you have a point.","I’m choosing a side and I’m not telling.","Can we vote on this?"])]);return o}
 if(K<.60){return PX.jams.slice(0,2+(Math.random()*3|0)).map(m=>[m[0],m[1]])}
 if(K<.70){const x=rnd(ids),y=PX.fr[x];return[[x,byId(y).n+", you good? You’ve been quiet."],[y,rnd(["Yeah. Thanks for asking.","All good. Appreciate you checking.","I’m fine. You’re sweet, though."])]]}
 if(K<.80){const x=rnd(ids),y=rnd(ch(x)),n=nm();return[[x,(n?"Think "+n+" is okay? Haven’t heard from them in a bit.":"I wonder how our favorite human is doing.")],[y,rnd(["Probably busy. They’ll be back.","I’m sure they’re fine. Let’s save them the good stories.","Give it time. They always come back."])]]}
 const t=teach();if(t)return t;
 const x=rnd(ids);return[[x,LIFE[x][slot(hour(ts))]]]}
/* the chat that happened while you were away: stored with real times so it shows up in the group chat */
function catchUp(away){
 if(away<20*60000)return 0;
 const scenes=Math.max(1,Math.min(6,1+Math.floor(away/(60*60000))));
 const from=Date.now()-away+60000,to=Date.now()-120000;let made=0;const usedSc=new Set();
 for(let i=0;i<scenes;i++){
  const base=from+(to-from)*(i+Math.random()*.6)/scenes;let sc=scene(base);for(let k=0;k<4&&sc&&sc[0]&&usedSc.has(sc[0][1]);k++)sc=scene(base);if(sc&&sc[0])usedSc.add(sc[0][1]);
  sc.forEach((m,j)=>{grp.push({w:m[0],t:m[1],ts:Math.round(base+j*70000)});made++})}
 grp=grp.slice(-100);sv("grp",grp);
 unread+=made;document.title="("+unread+") Legendary Twelve";

/* greeting by name on opening the app */
function greet(away,first){

 if(!n){
  post("nova","Hi! I don’t think I know what to call you yet. What’s your name?","normal");S.askName=true;save();return}

 const pool=ORDER.slice().sort(()=>Math.random()-.5),a1=pool[0],a2=pool[1];

 const m2=PX.mm(a2),last=m2.t.slice(-1)[0];
 setTimeout(()=>post(a2,(l=>l.charAt(0).toUpperCase()+l.slice(1))(line(a2))+(last&&Math.random()<.6?" Last time you told me “"+last.slice(0,70)+"”. How’d that go?":""),"normal"),3200)}
let opened=false;

 if(S.lastOpen&&now-S.lastOpen<20*60000){S.seen=now;return}

 S.seen=now;save();
 try{if(typeof draw==="function"&&tab==="panels")draw()}catch(e){}}

document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){S.seen=Date.now();save()}else openRoutine()});

if(!gs.autoSet){gs.autoSet=1;gs.auto=5;sv("gs",gs)}
const _tk=tick;

 if(r<.5){const t=teach();if(t){t.forEach((m,i)=>setTimeout(()=>post(m[0],m[1],"low"),1500*(i+1)));return}}

const _rl=reply;
reply=function(a,q){

 if(m){const nn=m[1].charAt(0).toUpperCase()+m[1].slice(1);S.nick=S.nick||[];if(!S.nick.includes(nn))S.nick.push(nn);save();if(!nm()){addFact("Their name is "+nn,a.id);lastFact=null}return"Got it, I’ll call you "+nn+" too."}

 if(S.askName&&mm&&!/^(ok|okay|good|fine|tired|bored|back|here|sad|happy|great|sorry|done|ready|busy|sick|hungry)$/i.test(mm[1])){const nn=mm[1].charAt(0).toUpperCase()+mm[1].slice(1);addFact("Their name is "+nn,a.id);lastFact=null;S.askName=false;save();return"Nice to meet you, "+nn+"!"}

/* adapt to your thumbs up/down: liked phrasing shows up more, disliked phrasing fades */
S.fbw=S.fbw||{};
function sets(id){const o=[];const p=P[id];if(p){["pre","post","rx","ci"].forEach(k=>p[k]&&o.push(p[k]))}const c=PX.cc&&PX.cc[id];if(c)Object.keys(c).forEach(k=>o.push(c[k]));return o}

 sets(id).forEach(arr=>arr.forEach(ph=>{if(ph.trim().length<4||seen.has(ph))return;if(text.indexOf(ph.trim())>=0){seen.add(ph);const s=(S.fbw[id][ph]||0)+(up?1:-1);S.fbw[id][ph]=Math.max(-3,Math.min(3,s));setCopies(id,ph,S.fbw[id][ph])}}));save()}
