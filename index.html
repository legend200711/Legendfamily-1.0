<script>
/* TOPIC ENCYCLOPEDIA LAYER: 165,341 offline topics in 64 shards (topics_1..64.json), loaded on demand.
   Sources: WordNet 3.0 (Princeton), GeoNames via geonamescache (CC BY 4.0), ISO lists via pycountry. */
(function(){
"use strict";
const SH=64,TOTAL=165341,mem=new Map(),loading=new Map();
const enc=new TextEncoder();
const norm=s=>String(s).normalize("NFKD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/_/g," ").replace(/[^a-z0-9 '\-]/g," ").replace(/\s+/g," ").trim();
const fnv=k=>{let h=0x811c9dc5;const b=enc.encode(k);for(let i=0;i<b.length;i++){h^=b[i];h=Math.imul(h,0x01000193)>>>0}return h>>>0};
const fileOf=k=>"topics_"+(fnv(k)%SH+1)+".json";
function load(f){
 if(mem.has(f)){const v=mem.get(f);mem.delete(f);mem.set(f,v);return Promise.resolve(v)}
 if(loading.has(f))return loading.get(f);
 if(typeof fetch==="undefined")return Promise.reject(new Error("nofetch"));
 const p=fetch(f).then(r=>{if(!r.ok)throw new Error("http");return r.json()}).then(j=>{mem.set(f,j);while(mem.size>6)mem.delete(mem.keys().next().value);loading.delete(f);return j}).catch(e=>{loading.delete(f);throw e});
 loading.set(f,p);return p}
const ready=k=>mem.has(fileOf(k));
async function get(k,depth){
 const j=await load(fileOf(k));let l=j[k]||[];const out=[];
 for(const e of l){if(typeof e==="string"){if((depth|0)<1){const pk=e.slice(1),pj=await load(fileOf(pk));(pj[pk]||[]).forEach(x=>{if(typeof x!=="string"&&!out.some(o=>JSON.stringify(o)===JSON.stringify(x)))out.push(x)})}}else out.push(e)}
 return out}
/* ---------- wording ---------- */
const POS={n:"noun",v:"verb",a:"adjective",r:"adverb"};
const an=w=>/^[aeiou]/i.test(w)?"an ":"a ";
const num=n=>{n=+n;return isFinite(n)&&n?n.toLocaleString("en-US"):""};
const list=s=>s?s.split(",").filter(Boolean):[];
function one(e,full){
 const t=e[0];
 if(POS[t]){const[,ti,gl,syn,kind,inc,parts,partof,ant,ex]=e;
  let s=ti+" ("+POS[t]+"): "+gl.replace(/\.$/,"")+".";
  if(full){const sy=list(syn),kd=list(kind),ic=list(inc),pt=list(parts),po=list(partof),an_=list(ant);
   if(sy.length)s+=" Also called: "+sy.slice(0,4).join(", ")+".";
   if(kd.length)s+=" It is a kind of "+kd.join(" or ")+".";
   if(ic.length)s+=" Kinds include: "+ic.join(", ")+".";
   if(pt.length)s+=" Parts: "+pt.join(", ")+".";
   if(po.length)s+=" It is part of "+po.join(" or ")+".";
   if(an_.length)s+=" Opposite: "+an_.join(", ")+".";
   if(ex){const x=ex.split("§")[0];if(x)s+=" For example: “"+x+"”."}}
  return s}
 if(t==="c"){const[,n,c,a1,pop,tz,la,lo]=e;return n+" is a city in "+(a1&&!/^\d+$/.test(a1)&&a1.length>2?a1+", ":"")+c+(+pop?" with roughly "+num(pop)+" people":"")+(tz?" (time zone "+tz+")":"")+"."}
 if(t==="k"){const[,n,cap,cont,pop,area,cur,lang,tld,ph,iso]=e;let s=n+" is a country"+(cont?" in "+cont:"")+".";if(cap)s+=" Its capital is "+cap+".";if(+pop)s+=" Population about "+num(pop)+".";if(+area)s+=" Area about "+num(Math.round(+area))+" square km.";if(cur)s+=" Currency: "+cur+".";if(lang)s+=" Languages (codes): "+lang+".";return s}
 if(t==="s"){const[,n,ty,c]=e;return n+" is "+an(ty)+ty+" in "+c+"."}
 if(t==="l")return e[1]+" is a language"+(e[2]?" (code "+e[2]+")":"")+".";
 if(t==="m")return e[1]+" is a currency (code "+e[2]+").";
 if(t==="x")return e[1]+" is a writing system (ISO 15924 code "+e[2]+").";
 return String(e[1]||"")}
function render(ents,key){
 if(!ents.length)return null;
 let s=one(ents[0],true);
 const rest=ents.slice(1,4).map(e=>{const x=one(e,false);return x.length>140?x.slice(0,137).replace(/\s+\S*$/,"")+"…":x});
 if(rest.length)s+="\n\nOther meanings and matches:\n"+rest.map((r,i)=>"("+(i+2)+") "+r).join("\n");
 if(ents.length>4)s+="\n("+(ents.length-4)+" more entries for “"+key+"”.)";
 return s}
/* ---------- question parsing ---------- */
function parseQ(q){
 const s=q.toLowerCase().replace(/[’‘]/g,"'").replace(/[?!.]+$/,"").replace(/\s+/g," ").trim();let m;
 if(/^(random topic|surprise me|tell me something (?:random|interesting)|random fact|topic of the day)$/.test(s))return{t:"random"};
 if(m=s.match(/^(?:what(?:'s| is) the )?capital (?:city )?of (.{2,40})$/))return{t:"capital",w:norm(m[1])};
 if(m=s.match(/^(?:what(?:'s| is) the )?population of (.{2,40})$/)||s.match(/^how many people (?:live )?in (.{2,40})$/))return{t:"pop",w:norm(m[1])};
 if(m=s.match(/^what (?:currency|money) (?:does|do) (.{2,40}?) (?:use|have)$/))return{t:"cur",w:norm(m[1])};
 if(m=s.match(/^(?:what(?:'s| is| are| was| were)|whats|who(?:'s| is| was| are| were)|where(?:'s| is| was| are)|tell me about|tell me more about|explain|describe|look up|lookup|topic|encyclopedia|info on|information on|information about|learn about|teach me about)\s+(?:the |a |an )?(.{2,60})$/)){
  const w=norm(m[1]);
  if(!w||w.split(" ").length>5||/\b(you|your|yours|i|we|my|me|our|doing|going|up to|opposite|plural|past tense|meaning|synonyms?|antonyms?|spelling|spell|definition|rhymes?|pronounce|pronunciation|today|tomorrow|time|date|weather|happening|wrong|new|up|good|bad)\b/.test(w))return null;
  return{t:"about",w,forced:/^(look ?up|topic|encyclopedia|info|information|learn|teach me)/.test(s)}}
 return null}
const TT=["Looking that up…","Let me check my topics…","One sec, flipping through the encyclopedia…"];
const rn=a=>a[Math.random()*a.length|0];
async function answerTopic(p){
 if(p.t==="random"){const f="topics_"+(1+Math.random()*SH|0)+".json",j=await load(f),ks=Object.keys(j).filter(k=>{const v=j[k];return v.length&&typeof v[0]!=="string"&&!/^\d/.test(k)&&(POS[v[0][0]]?v[0][2].length>30:true)});const k=rn(ks);const ents=await get(k);return"Random topic: "+render(ents,k)}
 const ents=await get(p.w);if(!ents.length)return null;
 if(p.t==="about")return render(ents,p.w);
 const c=ents.find(e=>e[0]==="k"),ct=ents.find(e=>e[0]==="c");
 if(p.t==="capital"){if(c&&c[2])return"The capital of "+c[1]+" is "+c[2]+".";return null}
 if(p.t==="pop"){if(c&&+c[4])return c[1]+" has about "+num(c[4])+" people.";if(ct&&+ct[4])return ct[1]+" has roughly "+num(ct[4])+" people.";return null}
 if(p.t==="cur"){if(c&&c[6])return c[1]+" uses the "+c[6]+".";return null}
 return null}
/* ---------- reply fallback: only when nothing else knew the answer ---------- */
const _tp=reply,dv=(a,t)=>window.DICTIONARY.deliver(a,t);
const SELF=/^(you|yourself|me|myself|us|everyone|everybody|anyone|we|i|it|this|that|here|there|them|him|her|the group|your name|my name)$/;
const mine=k=>{try{return A.some(x=>norm(x.n)===k||x.id===k||norm(x.n).split(" ").includes(k))||(sh||[]).some(r=>r.status==="approved"&&norm(r.title)===k)}catch(e){return false}};
function getSync(k){const f=fileOf(k);if(!mem.has(f))return null;const l=mem.get(f)[k]||[];const out=[];for(const e of l){if(typeof e==="string"){const pk=e.slice(1),pf=fileOf(pk);if(!mem.has(pf))return null;(mem.get(pf)[pk]||[]).forEach(x=>{if(typeof x!=="string"&&!out.some(o=>JSON.stringify(o)===JSON.stringify(x)))out.push(x)})}else out.push(e)}return out}
function fromEnts(p,ents){
 if(!ents||!ents.length)return null;
 if(p.t==="about")return render(ents,p.w);
 const c=ents.find(e=>e[0]==="k"),ct=ents.find(e=>e[0]==="c");
 if(p.t==="capital")return c&&c[2]?"The capital of "+c[1]+" is "+c[2]+".":null;
 if(p.t==="pop")return c&&+c[4]?c[1]+" has about "+num(c[4])+" people.":(ct&&+ct[4]?ct[1]+" has roughly "+num(ct[4])+" people.":null);
 if(p.t==="cur")return c&&c[6]?c[1]+" uses the "+c[6]+".":null;
 return null}
const ld_=a=>{try{return window.DICTIONARY.lead(a)||""}catch(e){return""}};
reply=function(a,q){
 const p=parseQ(q);
 let calm=false;try{calm=(typeof CR!=="undefined"&&CR.test(q.replace(/[’‘]/g,"'")))||((window.PERSONALITY.mm(a.id)||{}).care>0)}catch(e){}
 if(!p||calm)return _tp(a,q);
 if(p.t==="random"){answerTopic(p).then(t=>{if(t)dv(a,t)}).catch(()=>{});return rn(TT)}
 if(!p.forced&&(SELF.test(p.w)||mine(p.w)))return _tp(a,q);
 /* topics first: exact-name lookup is more precise than the library's loose matching */
 const fin=t=>ld_(a)+t;
 const sy=getSync(p.w);
 if(sy!==null){const t=fromEnts(p,sy);if(t)return fin(t);return _tp(a,q)}
 const fb=()=>{const r=_tp(a,q);if(typeof r==="string"&&r&&!/…$/.test(r))dv(a,r)};
 get(p.w).then(ents=>{const t=fromEnts(p,ents);if(t)dv(a,fin(t));else fb()}).catch(fb);
 return rn(TT)}
window.TOPICS={total:TOTAL,norm,fileOf,get,parseQ,answerTopic,render,one,load,mem,count:()=>TOTAL};
})();
</script>
